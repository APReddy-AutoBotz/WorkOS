services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - workos-postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_BIND_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    command: ["node", "server/migrate.mjs"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_MODE: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the db service in .env.production}
      PGSSLMODE: ${PGSSLMODE:-disable}

  app:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-0.0.0}
        VITE_APP_MODE: production
        VITE_ALLOW_TEST_FALLBACK: "false"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_MODE: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the db service in .env.production}
      PGSSLMODE: ${PGSSLMODE:-disable}
      API_SESSION_SECRET: ${API_SESSION_SECRET:?Set API_SESSION_SECRET in .env.production}
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      IDENTITY_PROVIDER: entra
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env.production}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID in .env.production}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?Set ENTRA_CLIENT_SECRET in .env.production}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:?Set ENTRA_REDIRECT_URI in .env.production}
      AUTO_SEED_DEMO: "false"
      RESET_DEMO_DATA: "false"
      ALLOW_TEST_FALLBACK: "false"
      VITE_ALLOW_TEST_FALLBACK: "false"
      LOCAL_LOGIN_ENABLED: "false"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_BIND_PORT:-4000}:4000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  workos-postgres-data:
