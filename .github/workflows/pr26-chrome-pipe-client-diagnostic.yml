name: PR26 Chrome Pipe Client Diagnostic

on:
  push:
    branches:
      - controller/pr26-isolation-recovery-20260829
    paths:
      - '.github/workflows/pr26-chrome-pipe-client-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Compare raw and retained PipeCdpClient
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          ref: 523eb774cf98114a37ccda73b9b73643b47e0b4c
          path: controller
          fetch-depth: 1
          persist-credentials: false

      - name: Execute raw and retained client probes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/chrome-client-diagnostic"
          mkdir -p "$out"
          cat > "$RUNNER_TEMP/probe.mjs" <<'NODE'
          import { spawn, spawnSync } from 'node:child_process';
          import { mkdtemp } from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          import { PipeCdpClient, removeProfile, terminateProcessTree } from `${process.cwd()}/controller/.github/scripts/wos01a-browser-lifecycle-v2.mjs`;

          const command = process.env.CHROME_BIN || 'google-chrome';
          const resolvedResult = spawnSync('bash', ['-lc', `command -v ${JSON.stringify(command)}`], {encoding: 'utf8'});
          if (resolvedResult.status !== 0) throw new Error(`Unable to resolve ${command}`);
          const resolved = resolvedResult.stdout.trim();
          const baseArgs = profile => [
            '--headless=new', '--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu',
            '--disable-background-networking', '--disable-component-update', '--disable-default-apps',
            '--disable-extensions', '--disable-sync', '--metrics-recording-only', '--no-first-run',
            '--remote-debugging-pipe', `--user-data-dir=${profile}`, 'about:blank',
          ];

          const withTimeout = (promise, ms, label) => Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timeout ${ms}ms`)), ms)),
          ]);

          async function spawnChrome(label) {
            const profile = await mkdtemp(path.join(os.tmpdir(), `workos-${label}-`));
            const child = spawn(resolved, baseArgs(profile), {stdio: ['ignore', 'pipe', 'pipe', 'pipe', 'pipe'], detached: true});
            let stdout = '';
            let stderr = '';
            child.stdout.on('data', chunk => { stdout += chunk; });
            child.stderr.on('data', chunk => { stderr += chunk; });
            return {child, profile, getOutput: () => ({stdout, stderr})};
          }

          async function cleanup(subject) {
            let processError = null;
            let profileError = null;
            try { await terminateProcessTree(subject.child, {waitMs: 5000}); } catch (error) { processError = String(error?.stack || error); }
            try { await removeProfile(subject.profile, {deadlineMs: 10000}); } catch (error) { profileError = String(error?.stack || error); }
            return {processError, profileError, exitCode: subject.child.exitCode, signalCode: subject.child.signalCode};
          }

          async function rawProbe() {
            const subject = await spawnChrome('raw');
            const response = Buffer.alloc(0);
            let buffer = response;
            let result;
            try {
              result = await withTimeout(new Promise((resolve, reject) => {
                subject.child.stdio[4].on('data', chunk => {
                  buffer = Buffer.concat([buffer, Buffer.from(chunk)]);
                  const boundary = buffer.indexOf(0);
                  if (boundary < 0) return;
                  try { resolve(JSON.parse(buffer.subarray(0, boundary).toString('utf8'))); }
                  catch (error) { reject(error); }
                });
                subject.child.stdio[4].on('error', reject);
                subject.child.once('exit', (code, signal) => reject(new Error(`raw Chrome exited ${code}/${signal}`)));
                subject.child.stdio[3].write(`${JSON.stringify({id: 1, method: 'Browser.getVersion', params: {}})}\0`, error => error && reject(error));
              }), 10000, 'raw Browser.getVersion');
            } catch (error) {
              result = {error: String(error?.stack || error)};
            }
            const output = subject.getOutput();
            const cleanupResult = await cleanup(subject);
            return {
              kind: 'raw', resolved, result, bytes: buffer.length,
              stream3: {readable: subject.child.stdio[3].readable, writable: subject.child.stdio[3].writable},
              stream4: {readable: subject.child.stdio[4].readable, writable: subject.child.stdio[4].writable},
              output, cleanup: cleanupResult,
            };
          }

          async function retainedProbe() {
            const subject = await spawnChrome('retained');
            const client = new PipeCdpClient(subject.child.stdio[4], subject.child.stdio[3], {commandTimeoutMs: 10000});
            let result;
            try {
              result = await withTimeout(client.send('Browser.getVersion'), 12000, 'retained Browser.getVersion');
            } catch (error) {
              result = {error: String(error?.stack || error)};
            }
            const stateBeforeClose = {
              closed: client.closed,
              sequence: client.sequence,
              pending: client.pending.size,
              bufferedBytes: client.buffer.length,
            };
            await client.close().catch(() => {});
            const output = subject.getOutput();
            const cleanupResult = await cleanup(subject);
            return {
              kind: 'retained', resolved, result, stateBeforeClose,
              stream3: {readable: subject.child.stdio[3].readable, writable: subject.child.stdio[3].writable},
              stream4: {readable: subject.child.stdio[4].readable, writable: subject.child.stdio[4].writable},
              output, cleanup: cleanupResult,
            };
          }

          const raw = await rawProbe();
          const retained = await retainedProbe();
          console.log(JSON.stringify({raw, retained}, null, 2));
          if (raw.result?.error || retained.result?.error) process.exitCode = 1;
          NODE
          node "$RUNNER_TEMP/probe.mjs" | tee "$out/results.json"

      - name: Upload exact client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr26-chrome-pipe-client-diagnostic
          path: ${{ runner.temp }}/chrome-client-diagnostic
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
