# This focused synthetic check does not replace historical WOS-02 acceptance,
# the full-history scanner, review, or integration and release gates.
name: WOS-02 synthetic session isolation

on:
  pull_request:
    branches: [codex/pr38-per-run-session-ad61f472-nov02]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  isolation:
    name: Pinned synthetic session regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify event scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = ad61f472bd64e425ef87f2990dba3a5d7f95ce4a
          test "$HEAD_REPO" = "$REPOSITORY"

      - name: Checkout validation workflow head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: validation
          fetch-depth: 2
          persist-credentials: false

      - name: Verify validation branch scope
        working-directory: validation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ad61f472bd64e425ef87f2990dba3a5d7f95ce4a
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/wos02-session-isolation-validation.yml
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - name: Checkout exact PR114 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ad61f472bd64e425ef87f2990dba3a5d7f95ce4a
          path: controller
          persist-credentials: false

      - name: Checkout pinned historical product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f269a1138760384a503e2e2673d3fb1701ead98e
          path: product
          persist-credentials: false

      - name: Verify exact clean source trees
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = ad61f472bd64e425ef87f2990dba3a5d7f95ce4a
          test "$(git -C controller rev-parse 'HEAD^{tree}')" = 216f6b3181b655f2a0b9cce25e1d634daca45e38
          test -z "$(git -C controller status --porcelain)"
          test "$(git -C product rev-parse HEAD)" = f269a1138760384a503e2e2673d3fb1701ead98e
          test "$(git -C product rev-parse 'HEAD^{tree}')" = b8074db08ad3191f8b3447115c1e8fbc11804ff4
          test -z "$(git -C product status --porcelain)"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run synthetic harness and pinned product token regression
        working-directory: controller
        env:
          WOS02_TARGET_SERVER: ${{ github.workspace }}/product/server/index.mjs
        run: node --experimental-vm-modules tests/wos02-harness-session-isolation-smoke.mjs
