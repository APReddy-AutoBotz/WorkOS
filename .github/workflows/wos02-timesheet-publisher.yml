name: WOS-02 Guarded Timesheet Publication

on:
  push:
    branches:
      - controller/wos02-exact-acceptance

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: codex/wos-02-organization-setup-foundation
          fetch-depth: 0

      - name: Verify exact live leases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c623c3336190b34a622be8a8f7c08139ba405e22"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | cut -f1)" = "c623c3336190b34a622be8a8f7c08139ba405e22"
          test "$(git rev-parse HEAD^{tree})" = "566ee6a6426e6a41e0783d86c7b3598d9f9c3b05"

      - name: Decode and verify exact recovery payload
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/payload.b64 > /tmp/correction.diff.gz
          test "$(wc -c < /tmp/correction.diff.gz)" = "3524"
          echo "c472224848ac61b209a4ccf7314db1fa68c47c8f02e43af0ddba02be6d8396bd  /tmp/correction.diff.gz" | sha256sum -c -
          gzip -dc /tmp/correction.diff.gz > /tmp/correction.diff
          test "$(wc -c < /tmp/correction.diff)" = "13467"
          echo "d1190e3b2b2316bee9b38012154d4c0d3eefeca6059d9456ced12faa67100ea3  /tmp/correction.diff" | sha256sum -c -

      - name: Apply exact payload and verify tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --binary /tmp/correction.diff
          git diff --check
          git add -A
          git config user.name "WorkOS Controller"
          git config user.email "workos-controller@users.noreply.github.com"
          git commit -m "fix: scope canonical timesheet imports"
          test "$(git rev-parse HEAD^{tree})" = "90e2bed5b34f48dd7d0dbd262102a8e032f7a094"
          test "$(git diff --name-only c623c3336190b34a622be8a8f7c08139ba405e22..HEAD | wc -l | tr -d ' ')" = "5"

      - name: Revalidate lease and publish non-force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | cut -f1)" = "c623c3336190b34a622be8a8f7c08139ba405e22"
          git push origin HEAD:refs/heads/codex/wos-02-organization-setup-foundation

      - name: Verify published head and tree
        shell: bash
        run: |
          set -euo pipefail
          published=""
          for i in 1 2 3 4 5; do
            published="$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | cut -f1)"
            test "$published" = "$(git rev-parse HEAD)" && break
            sleep 2
          done
          test "$published" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^{tree})" = "90e2bed5b34f48dd7d0dbd262102a8e032f7a094"
