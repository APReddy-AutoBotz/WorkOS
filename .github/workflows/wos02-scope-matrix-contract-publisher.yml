name: WOS-02 Scope Matrix Contract Publisher

on:
  push:
    branches: [controller/wos02-migration-publisher-temp2]
    paths: ['.github/workflows/wos02-scope-matrix-contract-publisher.yml']

permissions:
  contents: write
  pull-requests: read

env:
  EXPECTED_MAIN: 3070c80a71640fa4275477d0d2f1538cc8d2a819
  EXPECTED_PRODUCT: 031be9e18b6871594f0cfef25f8b098741dde74c
  EXPECTED_PRODUCT_TREE: 6f8813a9bb0a4821734ae8cd0a60f935fe1e16e1
  EXPECTED_CONTROLLER: 631b8d590ce3245efc4f8c23febf0666ad9d348b

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact live leases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$EXPECTED_MAIN"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq .head.sha)" = "$EXPECTED_PRODUCT"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq .draft)" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/$EXPECTED_PRODUCT --jq .commit.tree.sha)" = "$EXPECTED_PRODUCT_TREE"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq .head.sha)" = "$EXPECTED_CONTROLLER"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq .draft)" = "true"

      - name: Checkout exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CONTROLLER }}
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout helper script
        uses: actions/checkout@v4
        with:
          ref: controller/wos02-migration-publisher-temp2
          path: helper
          fetch-depth: 1
          persist-credentials: false

      - name: Correct and verify only the stale controller contract
        run: |
          set -euo pipefail
          node helper/.github/scripts/wos02-scope-matrix-contract-fix.mjs .github/scripts/wos02-scope-write-acceptance.mjs
          node --check .github/scripts/wos02-scope-write-acceptance.mjs
          git diff --check
          test "$(git diff --name-only | wc -l)" = 1
          test "$(git diff --name-only)" = ".github/scripts/wos02-scope-write-acceptance.mjs"
          grep -q 'organization-scoped duplicate employee code' .github/scripts/wos02-scope-write-acceptance.mjs
          grep -q 'org-duplicate' .github/scripts/wos02-scope-write-acceptance.mjs
          grep -q 'legal-b-employee' .github/scripts/wos02-scope-write-acceptance.mjs

      - name: Revalidate and non-force fast-forward existing controller branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$EXPECTED_MAIN"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq .head.sha)" = "$EXPECTED_PRODUCT"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq .head.sha)" = "$EXPECTED_CONTROLLER"
          git config user.name 'WorkOS Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/scripts/wos02-scope-write-acceptance.mjs
          git commit -m 'test: align organization-scoped employee identifier contract'
          git push origin HEAD:controller/wos02-exact-acceptance
