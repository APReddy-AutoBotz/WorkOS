name: WorkOS Controller Verification Reporter v1

on:
  push:
    branches:
      - controller/workos-root-publisher-v1
    paths:
      - '.github/workflows/workos-controller-verification-reporter-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: workos-controller-verification-reporter-v1
  cancel-in-progress: false

jobs:
  authority:
    name: Capture live exact controller heads
    runs-on: ubuntu-latest
    outputs:
      acceptance: ${{ steps.live.outputs.acceptance }}
      product: ${{ steps.live.outputs.product }}
      parent: ${{ steps.live.outputs.parent }}
      monitor: ${{ steps.live.outputs.monitor }}
      main: ${{ steps.live.outputs.main }}
    steps:
      - name: Read live PR and main authority
        id: live
        uses: actions/github-script@v7
        with:
          script: |
            const [acceptance, product, parent, monitor, main] = await Promise.all([
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 26}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 27}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 16}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 28}),
              github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'}),
            ]);
            const expected = [
              [acceptance.data, 'controller/wos01a-clean-runtime-acceptance-v2', 'main'],
              [product.data, 'codex/wos01a-acceptance-closure', 'codex/wos-01-authorized-source-bootstrap-v2'],
              [parent.data, 'codex/wos-01-authorized-source-bootstrap-v2', 'main'],
              [monitor.data, 'controller/workos-continuous-controller-v2', 'main'],
            ];
            for (const [pr, head, base] of expected) {
              if (pr.state !== 'open' || !pr.draft || pr.head.ref !== head || pr.base.ref !== base) {
                core.setFailed(`PR #${pr.number} authority changed: state=${pr.state} draft=${pr.draft} head=${pr.head.ref} base=${pr.base.ref}`);
              }
            }
            core.setOutput('acceptance', acceptance.data.head.sha);
            core.setOutput('product', product.data.head.sha);
            core.setOutput('parent', parent.data.head.sha);
            core.setOutput('monitor', monitor.data.head.sha);
            core.setOutput('main', main.data.commit.sha);

  acceptance-proof:
    name: Reprove live PR 26 against live PR 27
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CONTROLLER_PR: '26'
      CONTROLLER_BRANCH: controller/wos01a-clean-runtime-acceptance-v2
      CONTROLLER_HEAD: ${{ needs.authority.outputs.acceptance }}
      TARGET_PR: '27'
      TARGET_BRANCH: codex/wos01a-acceptance-closure
      TARGET_HEAD: ${{ needs.authority.outputs.product }}
      PARENT_PR: '16'
      PARENT_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
      PARENT_HEAD: ${{ needs.authority.outputs.parent }}
      EXPECTED_MAIN_HEAD: ${{ needs.authority.outputs.main }}
      ACCEPTED_WOS00_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: workos
      PGPASSWORD: workos
    steps:
      - name: Checkout exact live acceptance controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_HEAD }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact live product closure
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact live main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_HEAD }}
          path: current-main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json
      - name: Assert token isolation and final controller-ref lease
        run: |
          set -euo pipefail
          ! grep -R -n 'GH_TOKEN' controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh controller/.github/workflows/wos01a-clean-runtime-acceptance-v2.yml
          grep -q 'id: final_authority' controller/.github/workflows/wos01a-clean-runtime-acceptance-v2.yml
          grep -q 'controller.head.ref !== process.env.CONTROLLER_BRANCH' controller/.github/workflows/wos01a-clean-runtime-acceptance-v2.yml
          grep -q 'steps.final_authority.outcome' controller/.github/workflows/wos01a-clean-runtime-acceptance-v2.yml
          node controller/.github/scripts/verify-wos01a-controller-v2.mjs
      - name: Execute complete token-free product matrix
        id: matrix
        continue-on-error: true
        run: |
          chmod +x controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh
          bash controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh \
            "$GITHUB_WORKSPACE/controller" \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/current-main"
      - name: Final live authority with token isolated from target processes
        id: final_authority
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const failures = [];
            const [c, t, p, m] = await Promise.all([
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 26}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 27}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 16}),
              github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'}),
            ]);
            const controller = c.data;
            const target = t.data;
            const parent = p.data;
            const main = m.data;
            if (controller.state !== 'open' || !controller.draft || controller.head.ref !== process.env.CONTROLLER_BRANCH || controller.head.sha !== process.env.CONTROLLER_HEAD || controller.base.ref !== 'main' || controller.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push('controller lease changed');
            if (target.state !== 'open' || !target.draft || target.head.ref !== process.env.TARGET_BRANCH || target.head.sha !== process.env.TARGET_HEAD || target.base.ref !== process.env.PARENT_BRANCH || target.base.sha !== process.env.PARENT_HEAD) failures.push('target lease changed');
            if (parent.state !== 'open' || !parent.draft || parent.head.ref !== process.env.PARENT_BRANCH || parent.head.sha !== process.env.PARENT_HEAD || parent.base.ref !== 'main' || parent.base.sha !== process.env.ACCEPTED_WOS00_BASE) failures.push('parent lease changed');
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push('main changed');
            const dir = path.join(process.env.GITHUB_WORKSPACE, 'target', '.acceptance-evidence');
            fs.mkdirSync(dir, {recursive: true});
            fs.writeFileSync(path.join(dir, 'verification-reporter-final-authority.json'), `${JSON.stringify({status: failures.length ? 'failed' : 'passed', failures, controller, target, parent, main}, null, 2)}\n`);
            if (failures.length) core.setFailed(failures.join(', '));
      - name: Upload verification reporter evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workos-live-controller-proof-${{ env.CONTROLLER_HEAD }}-${{ env.TARGET_HEAD }}
          path: target/.acceptance-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Aggregate live acceptance proof
        if: always()
        run: |
          set -euo pipefail
          test '${{ steps.matrix.outcome }}' = success
          test '${{ steps.final_authority.outcome }}' = success
          test '${{ steps.upload.outcome }}' = success

  monitor-proof:
    name: Reprove live PR 28 controller policy
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONITOR_HEAD: ${{ needs.authority.outputs.monitor }}
      MAIN_HEAD: ${{ needs.authority.outputs.main }}
    steps:
      - name: Checkout exact live monitor
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MONITOR_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove standalone review marker and aggregate status gates
        run: |
          set -euo pipefail
          node .github/scripts/test-workos-continuous-controller.cjs
          node --check .github/scripts/workos-continuous-controller.cjs
          grep -q "combinedState !== 'success'" .github/scripts/workos-continuous-controller.cjs
          grep -q 'combined.data.state' .github/scripts/workos-continuous-controller.cjs
          grep -q 'REVIEW_RESULT_PATTERN = /\^' .github/scripts/workos-continuous-controller.cjs
          grep -q 'unquoted standalone line' docs/tasks/WOS-CONTINUOUS-CONTROLLER.md
          git diff --check "$MAIN_HEAD..HEAD"
          test -z "$(git status --porcelain)"

  report:
    name: Publish exact live verification checkpoint
    needs: [authority, acceptance-proof, monitor-proof]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report verified heads and resolve superseded findings
        uses: actions/github-script@v7
        with:
          script: |
            const acceptanceHead = '${{ needs.authority.outputs.acceptance }}';
            const productHead = '${{ needs.authority.outputs.product }}';
            const monitorHead = '${{ needs.authority.outputs.monitor }}';
            const acceptanceOutcome = '${{ needs.acceptance-proof.result }}';
            const monitorOutcome = '${{ needs.monitor-proof.result }}';
            const run = context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 26,
              body: `### Live exact-head verification reporter\n\n- Controller head: \`${acceptanceHead}\`\n- Product head: \`${productHead}\`\n- Acceptance proof: **${acceptanceOutcome}**\n- Workflow run: \`${run}\`\n\nThe proof keeps the GitHub token out of all target-controlled processes and revalidates the controller head ref plus every head/base/main lease in the isolated final authority action.`,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 28,
              body: `### Live exact-head verification reporter\n\n- Continuous-controller head: \`${monitorHead}\`\n- Policy proof: **${monitorOutcome}**\n- Workflow run: \`${run}\`\n\nThe proof requires an unquoted standalone structured review result and a successful GitHub combined commit status in addition to all individual check/status gates.`,
            });
            if (acceptanceOutcome === 'success') {
              for (const threadId of ['PRRT_kwDOUAv8Lc6dISNf', 'PRRT_kwDOUAv8Lc6dISNn']) {
                try {
                  await github.graphql(`mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { id isResolved } } }`, {id: threadId});
                } catch (error) {
                  core.warning(`Could not resolve ${threadId}: ${error.message}`);
                }
              }
            }
            if (acceptanceOutcome !== 'success' || monitorOutcome !== 'success') {
              core.setFailed(`verification outcomes: acceptance=${acceptanceOutcome}, monitor=${monitorOutcome}`);
            }
