name: WOS-02 Calendar Recovery Publisher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wos02-calendar-recovery-publisher.yml'

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: wos02-calendar-recovery-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Guarded exact calendar recovery publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: APReddy-AutoBotz/WorkOS
      EXPECTED_MAIN: 3070c80a71640fa4275477d0d2f1538cc8d2a819
      PRODUCT_PR: '37'
      PRODUCT_BRANCH: codex/wos-02-organization-setup-foundation
      EXPECTED_BASE: e3c31aec8789de460ab56c9038d0b5a01de71a79
      EXPECTED_TREE: 22b027d0bc4cd5124cab7f2ca56e61b03f23af87
      RESULT_MESSAGE: 'feat: complete working calendar authority'
      HANDOFF_COMMENT: '5548833915'
      EXPECTED_B64_BYTES: '10548'
      EXPECTED_GZIP_BYTES: '7910'
      EXPECTED_GZIP_SHA256: 403dd02b2f309502b476d6db547bde0f4bcedefed8731bdde7443fbdf11bc0ca
      EXPECTED_RAW_BYTES: '37268'
      EXPECTED_RAW_SHA256: 9d79cd945fb73fec621f10c5c750bc0d3c66e5deb013b7dba6358847e1278856
    steps:
      - name: Verify live authority lease
        uses: actions/github-script@v7
        with:
          script: |
            const failures=[];
            const {data: main}=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            const {data: pr}=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:Number(process.env.PRODUCT_PR)});
            if(main.commit.sha!==process.env.EXPECTED_MAIN) failures.push(`main=${main.commit.sha}`);
            if(pr.state!=='open'||!pr.draft) failures.push(`product lifecycle=${pr.state}/draft:${pr.draft}`);
            if(pr.head.ref!==process.env.PRODUCT_BRANCH) failures.push(`product branch=${pr.head.ref}`);
            if(pr.head.sha!==process.env.EXPECTED_BASE) failures.push(`product head=${pr.head.sha}`);
            if(pr.base.sha!==process.env.EXPECTED_MAIN) failures.push(`product base=${pr.base.sha}`);
            if(failures.length) core.setFailed(`lease failed: ${failures.join('; ')}`);

      - name: Checkout exact product lease
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BASE }}
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch complete Codex handoff and verify payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          gh api "repos/$REPO/issues/comments/$HANDOFF_COMMENT" --jq .body > "$RUNNER_TEMP/handoff.md"
          python - <<'PY'
          import os,re,pathlib
          body=pathlib.Path(os.environ['RUNNER_TEMP']+'/handoff.md').read_text()
          m=re.search(r"Complete `base64\(gzip -9 -n\(git diff --binary e3c31aec…f6d40c1…\)\)`:.*?```text\s*([A-Za-z0-9+/=\r\n]+?)\s*```",body,re.S)
          if not m:
              raise SystemExit('complete recovery payload not found')
          payload=''.join(m.group(1).split())
          pathlib.Path(os.environ['RUNNER_TEMP']+'/payload.b64').write_text(payload)
          print('payload chars',len(payload))
          PY
          test "$(wc -c < "$RUNNER_TEMP/payload.b64")" = "$EXPECTED_B64_BYTES"
          base64 -d "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/calendar.diff.gz"
          test "$(wc -c < "$RUNNER_TEMP/calendar.diff.gz")" = "$EXPECTED_GZIP_BYTES"
          echo "$EXPECTED_GZIP_SHA256  $RUNNER_TEMP/calendar.diff.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/calendar.diff.gz" > "$RUNNER_TEMP/calendar.diff"
          test "$(wc -c < "$RUNNER_TEMP/calendar.diff")" = "$EXPECTED_RAW_BYTES"
          echo "$EXPECTED_RAW_SHA256  $RUNNER_TEMP/calendar.diff" | sha256sum -c -
          git apply --check --binary "$RUNNER_TEMP/calendar.diff"

      - name: Apply exact recovery and verify tree inventory
        shell: bash
        run: |
          set -euo pipefail
          git apply --binary "$RUNNER_TEMP/calendar.diff"
          cat > "$RUNNER_TEMP/expected-files" <<'EOF'
          docs/00-control/REQUIREMENTS_TRACEABILITY.md
          server/migrations/029_wos02_working_calendar_authority.sql
          server/organization-setup.mjs
          server/working-calendars.mjs
          tests/organization-setup-smoke.mjs
          EOF
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          git diff --check
          git add -A
          test "$(git diff --cached --numstat | awk '{a+=$1;d+=$2} END{print a+0" "d+0}')" = "260 11"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git status --short

      - name: Revalidate lease commit and publish non-force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/branches/main" --jq .commit.sha)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$REPO/pulls/$PRODUCT_PR" --jq .head.sha)" = "$EXPECTED_BASE"
          test "$(gh api "repos/$REPO/pulls/$PRODUCT_PR" --jq .draft)" = "true"
          git config user.name 'WorkOS Controller'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "$RESULT_MESSAGE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          sleep 2
          test "$(gh api "repos/$REPO/pulls/$PRODUCT_PR" --jq .head.sha)" = "$(git rev-parse HEAD)"
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final publication evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPO/pulls/$PRODUCT_PR" --jq .head.sha)"
          tree="$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)"
          test "$tree" = "$EXPECTED_TREE"
          printf 'published product head=%s tree=%s\n' "$head" "$tree"
