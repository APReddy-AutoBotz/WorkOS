name: WOS-01A Final Integrated PR Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wos01a-final-integration-acceptance.yml'
      - '.github/scripts/wos01a-clean-runtime-matrix-v2.sh'
      - '.github/scripts/wos01a-browser-acceptance-v2.mjs'
      - '.github/scripts/wos01a-browser-lifecycle-v2.mjs'
      - '.github/scripts/test-wos01a-browser-lifecycle-v2.mjs'
      - '.github/scripts/verify-wos01a-controller-v2.mjs'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wos01a-final-integration-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    name: Exact-head integrated PR #16 matrix
    permissions:
      contents: read
      pull-requests: read
    env:
      CONTROLLER_BRANCH: controller/wos01a-final-integration-acceptance
      TARGET_PR: '16'
      TARGET_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
      TARGET_HEAD: 60a6a8da861f505c17f043c7439bdd40df992b50
      PARENT_PR: '0'
      PARENT_BRANCH: accepted/wos00-base
      PARENT_HEAD: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
      EXPECTED_MAIN_HEAD: 44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42
      ACCEPTED_WOS00_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: workos
      PGPASSWORD: workos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Verify exact controller, integrated target and main authority
        id: authority
        uses: actions/github-script@v7
        with:
          script: |
            const controller = context.payload.pull_request;
            const failures = [];
            const accepted = process.env.ACCEPTED_WOS00_BASE;
            const targetHead = process.env.TARGET_HEAD;

            if (!controller) failures.push('missing pull_request payload');
            if (controller?.state !== 'open') failures.push(`controller.state=${controller?.state}`);
            if (!controller?.draft) failures.push('controller is not Draft');
            if (controller?.head?.ref !== process.env.CONTROLLER_BRANCH) failures.push(`controller.head.ref=${controller?.head?.ref}`);
            if (controller?.head?.sha !== context.payload.pull_request.head.sha) failures.push(`controller.head.sha=${controller?.head?.sha}`);
            if (controller?.base?.ref !== 'main') failures.push(`controller.base.ref=${controller?.base?.ref}`);
            if (controller?.base?.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`controller.base.sha=${controller?.base?.sha}`);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: controller.number,
              per_page: 100,
            });
            const actual = files.map(file => file.filename).sort();
            const expected = [
              '.github/scripts/test-wos01a-browser-lifecycle-v2.mjs',
              '.github/scripts/verify-wos01a-controller-v2.mjs',
              '.github/scripts/wos01a-browser-acceptance-v2.mjs',
              '.github/scripts/wos01a-browser-lifecycle-v2.mjs',
              '.github/scripts/wos01a-clean-runtime-matrix-v2.sh',
              '.github/workflows/wos01a-final-integration-acceptance.yml',
            ].sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) failures.push(`controller.paths=${JSON.stringify(actual)}`);

            const {data: target} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR),
            });
            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target is not Draft');
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha !== targetHead) failures.push(`target.head.sha=${target.head.sha}`);
            if (target.base.ref !== 'main') failures.push(`target.base.ref=${target.base.ref}`);
            if (![accepted, process.env.EXPECTED_MAIN_HEAD].includes(target.base.sha)) {
              failures.push(`target.base.sha=${target.base.sha}`);
            }

            const {data: main} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);

            const {data: targetComparison} = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: accepted,
              head: targetHead,
            });
            if (targetComparison.merge_base_commit.sha !== accepted) {
              failures.push(`target.merge_base=${targetComparison.merge_base_commit.sha}`);
            }
            if (targetComparison.status !== 'ahead') failures.push(`target.compare.status=${targetComparison.status}`);
            if (targetComparison.behind_by !== 0) failures.push(`target.behind_by=${targetComparison.behind_by}`);
            if (targetComparison.ahead_by < 1) failures.push(`target.ahead_by=${targetComparison.ahead_by}`);

            if (failures.length) core.setFailed(`WOS-01A final integration authority failed: ${failures.join(', ')}`);

      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact integrated PR #16 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_HEAD }}
          path: current-main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Run complete fail-closed integrated matrix
        id: matrix
        continue-on-error: true
        shell: bash
        env:
          CONTROLLER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh
          bash controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh \
            "$GITHUB_WORKSPACE/controller" \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/current-main"

      - name: Upload integrated matrix evidence
        id: matrix_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01a-final-matrix-${{ env.TARGET_HEAD }}
          path: target/.acceptance-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Verify integrated matrix evidence publication
        id: matrix_evidence
        if: always()
        shell: bash
        env:
          ARTIFACT_CONCLUSION: ${{ steps.matrix_artifact.conclusion }}
          ARTIFACT_ID: ${{ steps.matrix_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.matrix_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$ARTIFACT_CONCLUSION" = success
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_DIGEST" =~ ^([0-9A-Fa-f]{64}|sha256:[0-9A-Fa-f]{64})$ ]]

      - name: Aggregate integrated matrix result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.authority.outcome }}' = success
          test '${{ steps.matrix.outcome }}' = success
          test '${{ steps.matrix_evidence.outcome }}' = success

  browser_bundle:
    name: Pristine integrated browser bundle producer
    needs: acceptance
    if: always()
    permissions:
      contents: read
    env:
      ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
      CONTROLLER_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_HEAD: 60a6a8da861f505c17f043c7439bdd40df992b50
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require integrated matrix success
        shell: bash
        run: test "$ACCEPTANCE_RESULT" = success

      - name: Checkout immutable controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: false

      - name: Checkout fresh exact integrated product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: producer
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: producer/package-lock.json

      - name: Install locked producer dependencies without lifecycle scripts
        working-directory: producer
        shell: bash
        run: npm ci --ignore-scripts

      - name: Restore and prove pristine exact-head build inputs
        working-directory: producer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          git reset --hard "$TARGET_HEAD"
          git clean -ffdx -e node_modules/
          test "$(git write-tree)" = "$(git rev-parse "$TARGET_HEAD^{tree}")"
          unexpected="$(git status --porcelain=v1 --untracked-files=all --ignored=no | grep -vE '^\?\? node_modules/' || true)"
          test -z "$unexpected"
          printf 'target=%s\ntree=%s\nstatus=pristine\n' \
            "$TARGET_HEAD" "$(git rev-parse "$TARGET_HEAD^{tree}")" > "$RUNNER_TEMP/producer-authority.txt"

      - name: Build digest-bound browser bundle from pristine integrated product
        working-directory: producer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$(git rev-parse "$TARGET_HEAD^{tree}")"
          rm -rf dist "$RUNNER_TEMP/browser-bundle"
          VITE_APP_MODE=test \
          VITE_ALLOW_TEST_FALLBACK=true \
          VITE_PRODUCT_NAME=WorkOS \
          VITE_ORGANIZATION_NAME='Acceptance Organization' \
          VITE_PRODUCT_LOGO_URL=/workos-mark.svg \
          VITE_SUPPORT_EMAIL=support@example.test \
            npm run build
          mkdir -p "$RUNNER_TEMP/browser-bundle/dist"
          cp -a dist/. "$RUNNER_TEMP/browser-bundle/dist/"
          (cd "$RUNNER_TEMP/browser-bundle/dist" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) \
            > "$RUNNER_TEMP/browser-bundle/files.sha256"
          cat "$RUNNER_TEMP/producer-authority.txt" > "$RUNNER_TEMP/browser-bundle/authority.txt"
          printf 'controller=%s\n' "$CONTROLLER_HEAD" >> "$RUNNER_TEMP/browser-bundle/authority.txt"
          (cd "$RUNNER_TEMP/browser-bundle" && sha256sum files.sha256 authority.txt > bundle.sha256)

      - name: Upload pristine integrated browser bundle
        id: bundle_artifact
        uses: actions/upload-artifact@v4
        with:
          name: wos01a-final-browser-bundle-${{ env.TARGET_HEAD }}
          path: ${{ runner.temp }}/browser-bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Aggregate pristine integrated producer result
        if: always()
        shell: bash
        env:
          BUNDLE_ID: ${{ steps.bundle_artifact.outputs.artifact-id }}
          BUNDLE_DIGEST: ${{ steps.bundle_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$ACCEPTANCE_RESULT" = success
          test '${{ steps.bundle_artifact.outcome }}' = success
          test -n "$BUNDLE_ID"
          [[ "$BUNDLE_DIGEST" =~ ^([0-9A-Fa-f]{64}|sha256:[0-9A-Fa-f]{64})$ ]]

  browser_acceptance:
    name: Isolated integrated browser authority
    needs: [acceptance, browser_bundle]
    if: always()
    permissions:
      contents: read
    env:
      ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
      BUNDLE_RESULT: ${{ needs.browser_bundle.result }}
      CONTROLLER_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_HEAD: 60a6a8da861f505c17f043c7439bdd40df992b50
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require matrix and bundle success
        shell: bash
        run: test "$ACCEPTANCE_RESULT" = success && test "$BUNDLE_RESULT" = success

      - name: Checkout immutable controller browser authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: false

      - name: Download exact integrated browser bundle
        uses: actions/download-artifact@v4
        with:
          name: wos01a-final-browser-bundle-${{ env.TARGET_HEAD }}
          path: browser-bundle

      - name: Verify integrated bundle authority and integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "$CONTROLLER_HEAD"
          grep -Fx "controller=$CONTROLLER_HEAD" browser-bundle/authority.txt
          grep -Fx "target=$TARGET_HEAD" browser-bundle/authority.txt
          grep -Fx "status=pristine" browser-bundle/authority.txt
          grep -Eq '^tree=[0-9a-f]{40}$' browser-bundle/authority.txt
          (cd browser-bundle/dist && sha256sum -c ../files.sha256)
          (cd browser-bundle && sha256sum -c bundle.sha256)

      - name: Run real Chrome against isolated integrated target
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wos01a-final-browser-evidence"
          mkdir -p "$evidence"
          config="$RUNNER_TEMP/wos01a-final-nginx.conf"
          cat > "$config" <<'NGINX'
          events {}
          pid /var/run/nginx.pid;
          error_log /dev/stderr notice;
          http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
            access_log off;
            client_body_temp_path /var/cache/nginx/client_temp;
            proxy_temp_path /var/cache/nginx/proxy_temp;
            fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
            uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
            scgi_temp_path /var/cache/nginx/scgi_temp;
            server {
              listen 8080;
              root /srv/workos;
              location / { try_files $uri $uri/ /index.html; }
            }
          }
          NGINX
          cleanup() {
            local rc=0
            timeout 20s docker rm -f wos01a-final-static-target >/dev/null 2>&1 || rc=$?
            if [[ "$rc" -ne 0 ]]; then echo "target container cleanup failed rc=$rc" >&2; return "$rc"; fi
          }
          trap cleanup EXIT
          docker run --detach --name wos01a-final-static-target \
            --user 101:101 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 128m --network bridge \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=700 \
            --tmpfs /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=700 \
            --tmpfs /tmp:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=700 \
            --publish 127.0.0.1:4173:8080 \
            --mount "type=bind,src=$PWD/browser-bundle/dist,dst=/srv/workos,readonly" \
            --mount "type=bind,src=$config,dst=/etc/nginx/nginx.conf,readonly" \
            nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 \
            > "$evidence/container-id.txt"
          docker inspect wos01a-final-static-target > "$evidence/container-inspect.json"
          docker logs wos01a-final-static-target > "$evidence/container-startup.log" 2>&1 || true
          inspect="$(cat "$evidence/container-inspect.json")"
          jq -e '.[0].State.Running == true
            and .[0].Config.User == "101:101"
            and .[0].HostConfig.Privileged == false
            and .[0].HostConfig.PidMode == ""
            and .[0].HostConfig.ReadonlyRootfs == true
            and .[0].HostConfig.Binds == null
            and .[0].HostConfig.SecurityOpt == ["no-new-privileges"]
            and .[0].HostConfig.CapDrop == ["ALL"]
            and .[0].HostConfig.Memory == 134217728
            and .[0].HostConfig.PidsLimit == 64
            and .[0].HostConfig.NetworkMode == "bridge"
            and ([.[0].Mounts[] | select(.Type == "bind")] | length == 2)
            and ([.[0].Mounts[] | select(.Type == "bind") | .RW] | all(. == false))' <<<"$inspect" >/dev/null
          for _ in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:4173/login >/dev/null && break
            docker inspect -f '{{.State.Running}}' wos01a-final-static-target | grep -Fx true
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/login >/dev/null
          mapfile -t main_assets < <(
            grep -oE 'src="/assets/main-[^"]+\.js"' browser-bundle/dist/index.html \
              | cut -d'"' -f2
          )
          test "${#main_assets[@]}" -eq 1
          main_asset="${main_assets[0]}"
          curl --fail --silent --show-error --head "http://127.0.0.1:4173$main_asset" \
            | tee "$evidence/main-asset-headers.txt" \
            | grep -Eiq '^content-type:[[:space:]]*(application|text)/(javascript|ecmascript)'
          WOS_BROWSER_ORIGIN=http://127.0.0.1:4173 \
          WOS_CHROME_HANDSHAKE_EVIDENCE="$evidence/chrome-handshake.json" \
            timeout 8m node controller/.github/scripts/wos01a-browser-acceptance-v2.mjs \
            2>&1 | tee "$evidence/browser-journeys.log"
          grep -q 'WOS-01A bounded browser acceptance passed.' "$evidence/browser-journeys.log"
          cp browser-bundle/authority.txt browser-bundle/bundle.sha256 "$evidence/"
          docker inspect wos01a-final-static-target > "$evidence/container-inspect.json"
          cleanup
          trap - EXIT

      - name: Upload integrated browser evidence
        id: browser_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01a-final-browser-authority-${{ env.TARGET_HEAD }}
          path: ${{ runner.temp }}/wos01a-final-browser-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Aggregate integrated browser result
        if: always()
        shell: bash
        env:
          BROWSER_ARTIFACT_ID: ${{ steps.browser_artifact.outputs.artifact-id }}
          BROWSER_ARTIFACT_DIGEST: ${{ steps.browser_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$ACCEPTANCE_RESULT" = success
          test "$BUNDLE_RESULT" = success
          test '${{ steps.browser.outcome }}' = success
          test '${{ steps.browser_artifact.outcome }}' = success
          test -n "$BROWSER_ARTIFACT_ID"
          [[ "$BROWSER_ARTIFACT_DIGEST" =~ ^([0-9A-Fa-f]{64}|sha256:[0-9A-Fa-f]{64})$ ]]

  final_authority:
    name: Fresh-runner integrated final authority
    needs: [acceptance, browser_bundle, browser_acceptance]
    if: always()
    permissions:
      contents: read
      pull-requests: read
    env:
      ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
      BUNDLE_RESULT: ${{ needs.browser_bundle.result }}
      BROWSER_RESULT: ${{ needs.browser_acceptance.result }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: controller/wos01a-final-integration-acceptance
      CONTROLLER_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_PR: '16'
      TARGET_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
      TARGET_HEAD: 60a6a8da861f505c17f043c7439bdd40df992b50
      EXPECTED_MAIN_HEAD: 44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42
      ACCEPTED_WOS00_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify final integrated live authority
        id: final_authority
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const evidence = path.join(process.env.RUNNER_TEMP, 'wos01a-final-integration-authority');
            fs.mkdirSync(evidence, {recursive: true});
            const failures = [];
            if (process.env.ACCEPTANCE_RESULT !== 'success') failures.push(`acceptance.result=${process.env.ACCEPTANCE_RESULT}`);
            if (process.env.BUNDLE_RESULT !== 'success') failures.push(`bundle.result=${process.env.BUNDLE_RESULT}`);
            if (process.env.BROWSER_RESULT !== 'success') failures.push(`browser.result=${process.env.BROWSER_RESULT}`);

            const {data: controller} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.CONTROLLER_PR),
            });
            const {data: target} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR),
            });
            const {data: main} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const {data: targetComparison} = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: process.env.ACCEPTED_WOS00_BASE,
              head: process.env.TARGET_HEAD,
            });

            if (controller.state !== 'open') failures.push(`controller.state=${controller.state}`);
            if (!controller.draft) failures.push('controller is not Draft');
            if (controller.head.ref !== process.env.CONTROLLER_BRANCH) failures.push(`controller.head.ref=${controller.head.ref}`);
            if (controller.head.sha !== process.env.CONTROLLER_HEAD) failures.push(`controller.head.sha=${controller.head.sha}`);
            if (controller.base.ref !== 'main') failures.push(`controller.base.ref=${controller.base.ref}`);
            if (controller.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`controller.base.sha=${controller.base.sha}`);

            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target is not Draft');
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`target.head.sha=${target.head.sha}`);
            if (target.base.ref !== 'main') failures.push(`target.base.ref=${target.base.ref}`);

            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);
            if (targetComparison.merge_base_commit.sha !== process.env.ACCEPTED_WOS00_BASE) {
              failures.push(`target.merge_base=${targetComparison.merge_base_commit.sha}`);
            }
            if (targetComparison.status !== 'ahead') failures.push(`target.compare.status=${targetComparison.status}`);
            if (targetComparison.behind_by !== 0) failures.push(`target.behind_by=${targetComparison.behind_by}`);

            fs.writeFileSync(path.join(evidence, 'controller-pr.json'), `${JSON.stringify(controller, null, 2)}\n`);
            fs.writeFileSync(path.join(evidence, 'integrated-pr16.json'), `${JSON.stringify(target, null, 2)}\n`);
            fs.writeFileSync(path.join(evidence, 'main.json'), `${JSON.stringify(main, null, 2)}\n`);
            fs.writeFileSync(path.join(evidence, 'accepted-base-comparison.json'), `${JSON.stringify(targetComparison, null, 2)}\n`);
            fs.writeFileSync(
              path.join(evidence, 'result.json'),
              `${JSON.stringify({
                status: failures.length ? 'failed' : 'passed',
                acceptanceResult: process.env.ACCEPTANCE_RESULT,
                bundleResult: process.env.BUNDLE_RESULT,
                browserResult: process.env.BROWSER_RESULT,
                controllerHead: process.env.CONTROLLER_HEAD,
                targetHead: process.env.TARGET_HEAD,
                mainHead: process.env.EXPECTED_MAIN_HEAD,
                acceptedBase: process.env.ACCEPTED_WOS00_BASE,
                failures,
              }, null, 2)}\n`,
            );
            if (failures.length) core.setFailed(`WOS-01A integrated final authority failed: ${failures.join(', ')}`);

      - name: Upload integrated final-authority evidence
        id: final_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01a-final-integration-authority-${{ env.TARGET_HEAD }}
          path: ${{ runner.temp }}/wos01a-final-integration-authority
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Verify integrated final-authority evidence publication
        id: final_evidence
        if: always()
        shell: bash
        env:
          ARTIFACT_CONCLUSION: ${{ steps.final_artifact.conclusion }}
          ARTIFACT_ID: ${{ steps.final_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.final_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$ARTIFACT_CONCLUSION" = success
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_DIGEST" =~ ^([0-9A-Fa-f]{64}|sha256:[0-9A-Fa-f]{64})$ ]]

      - name: Aggregate integrated final-authority result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$ACCEPTANCE_RESULT" = success
          test "$BUNDLE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test '${{ steps.final_authority.outcome }}' = success
          test '${{ steps.final_evidence.outcome }}' = success

  aggregate:
    name: Aggregate final integrated WOS-01A acceptance
    needs: [acceptance, browser_bundle, browser_acceptance, final_authority]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless every integrated job passed
        shell: bash
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          BUNDLE_RESULT: ${{ needs.browser_bundle.result }}
          BROWSER_RESULT: ${{ needs.browser_acceptance.result }}
          FINAL_AUTHORITY_RESULT: ${{ needs.final_authority.result }}
        run: |
          set -euo pipefail
          test "$ACCEPTANCE_RESULT" = success
          test "$BUNDLE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$FINAL_AUTHORITY_RESULT" = success
