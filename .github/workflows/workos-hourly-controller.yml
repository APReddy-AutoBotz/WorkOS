name: WorkOS Continuous Implementation Controller

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workos-hourly-controller.yml'
      - '.github/scripts/workos-continuous-controller.cjs'
      - '.github/scripts/test-workos-continuous-controller.cjs'
      - 'docs/tasks/WOS-CONTINUOUS-CONTROLLER.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workos-hourly-controller.yml'
      - '.github/scripts/workos-continuous-controller.cjs'
      - '.github/scripts/test-workos-continuous-controller.cjs'
      - 'docs/tasks/WOS-CONTINUOUS-CONTROLLER.md'

concurrency:
  group: workos-continuous-controller-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate controller policy
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact proposed controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run retained controller policy tests
        run: |
          set -euo pipefail
          node .github/scripts/test-workos-continuous-controller.cjs
          git diff --check
          test -z "$(git status --porcelain)"

  controller:
    name: Inspect, continue and exact-head merge WorkOS
    if: github.event_name != 'pull_request'
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Revalidate retained controller policy
        run: |
          set -euo pipefail
          node .github/scripts/test-workos-continuous-controller.cjs
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Run guarded continuous controller
        uses: actions/github-script@v7
        with:
          script: |
            const controller = require('./.github/scripts/workos-continuous-controller.cjs');
            await controller.run({github, context, core});
