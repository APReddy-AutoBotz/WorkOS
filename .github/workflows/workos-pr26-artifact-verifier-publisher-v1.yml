name: WorkOS PR26 Artifact Verifier Publisher v1

on:
  push:
    branches:
      - controller/workos-root-publisher-v1
    paths:
      - '.github/workflows/workos-pr26-artifact-verifier-publisher-v1.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: workos-pr26-artifact-verifier-publisher-v1
  cancel-in-progress: false

env:
  CONTROLLER_PR: '26'
  CONTROLLER_BRANCH: controller/wos01a-clean-runtime-acceptance-v2
  CONTROLLER_OLD_HEAD: 669eda6ebe92862a40a69aedb301185e2fc7cd54
  TARGET_PR: '27'
  TARGET_BRANCH: codex/wos01a-acceptance-closure
  TARGET_HEAD: ac1e4692f50f9c034352cb06c43b6d9f73808e33
  PARENT_PR: '16'
  PARENT_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
  PARENT_HEAD: 590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60
  EXPECTED_MAIN_HEAD: 44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42
  ACCEPTED_WOS00_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: workos
  PGPASSWORD: workos

jobs:
  publish:
    name: Publish exact artifact-verifier correction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      controller_head: ${{ steps.publish.outputs.controller_head }}

    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_OLD_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch, statically validate and publish
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$CONTROLLER_OLD_HEAD"
          test "$(git rev-parse refs/remotes/origin/$CONTROLLER_BRANCH)" = "$CONTROLLER_OLD_HEAD"
          test -z "$(git status --porcelain)"

          python3 - <<'PY'
          from pathlib import Path

          def gha(expression: str) -> str:
              return '$' + '{' + '{ ' + expression + ' }}'

          path = Path('.github/workflows/wos01a-clean-runtime-acceptance-v2.yml')
          text = path.read_text()
          upload = '''      - name: Upload exact-head acceptance evidence
            id: evidence_upload
            if: always()
            uses: actions/upload-artifact@v4
          '''
          replacement = '''      - name: Upload exact-head acceptance evidence
            id: artifact_upload
            if: always()
            uses: actions/upload-artifact@v4
          '''
          if text.count(upload) != 1:
              raise SystemExit('unexpected evidence upload step shape')
          text = text.replace(upload, replacement, 1)

          marker = '      - name: Aggregate fail-closed result\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected aggregate marker count')
          verification = '\n'.join([
              '      - name: Verify retained evidence artifact publication',
              '        id: evidence_upload',
              '        if: always()',
              '        shell: bash',
              '        env:',
              '          ARTIFACT_CONCLUSION: ' + gha('steps.artifact_upload.conclusion'),
              '          ARTIFACT_ID: ' + gha('steps.artifact_upload.outputs.artifact-id'),
              '          ARTIFACT_DIGEST: ' + gha('steps.artifact_upload.outputs.artifact-digest'),
              '        run: |',
              '          set -euo pipefail',
              '          test "$ARTIFACT_CONCLUSION" = success',
              '          test -n "$ARTIFACT_ID"',
              '          test -n "$ARTIFACT_DIGEST"',
              '          case "$ARTIFACT_DIGEST" in',
              "            sha256:*) ;;",
              "            *) echo 'Artifact digest is not SHA-256 evidence' >&2; exit 1 ;;;",
              '          esac',
              '',
          ])
          path.write_text(text.replace(marker, verification + marker, 1))
          PY

          node .github/scripts/verify-wos01a-controller-v2.mjs
          git diff --check
          git add .github/workflows/wos01a-clean-runtime-acceptance-v2.yml
          test -n "$(git status --porcelain)"
          git commit -m 'ci: verify retained artifact identity after upload'
          NEW_HEAD="$(git rev-parse HEAD)"
          git push origin \
            HEAD:"refs/heads/$CONTROLLER_BRANCH" \
            --force-with-lease="refs/heads/$CONTROLLER_BRANCH:$CONTROLLER_OLD_HEAD"
          echo "controller_head=$NEW_HEAD" >> "$GITHUB_OUTPUT"
          echo "Published PR #26 controller head $NEW_HEAD" >> "$GITHUB_STEP_SUMMARY"

  proof:
    name: Prove exact artifact-verifier controller
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Verify initial live exact authority
        id: authority
        uses: actions/github-script@v7
        env:
          CONTROLLER_HEAD: ${{ needs.publish.outputs.controller_head }}
        with:
          script: |
            const failures = [];
            const {data: controller} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.CONTROLLER_PR)});
            const {data: target} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR)});
            const {data: parent} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PARENT_PR)});
            const {data: main} = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'});
            if (controller.state !== 'open' || !controller.draft || controller.head.ref !== process.env.CONTROLLER_BRANCH || controller.head.sha !== process.env.CONTROLLER_HEAD || controller.base.ref !== 'main' || controller.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push('controller authority');
            if (target.state !== 'open' || !target.draft || target.head.ref !== process.env.TARGET_BRANCH || target.head.sha !== process.env.TARGET_HEAD || target.base.ref !== process.env.PARENT_BRANCH || target.base.sha !== process.env.PARENT_HEAD) failures.push('target authority');
            if (parent.state !== 'open' || !parent.draft || parent.head.ref !== process.env.PARENT_BRANCH || parent.head.sha !== process.env.PARENT_HEAD || parent.base.ref !== 'main' || parent.base.sha !== process.env.ACCEPTED_WOS00_BASE) failures.push('parent authority');
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push('main authority');
            if (failures.length) core.setFailed(failures.join(', '));

      - name: Checkout exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.controller_head }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact product closure
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_HEAD }}
          path: current-main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Execute complete token-free target matrix
        id: matrix
        continue-on-error: true
        shell: bash
        env:
          CONTROLLER_HEAD: ${{ needs.publish.outputs.controller_head }}
        run: |
          chmod +x controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh
          bash controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh \
            "$GITHUB_WORKSPACE/controller" \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/current-main"

      - name: Verify final live authority and retain evidence
        id: final_authority
        if: always()
        uses: actions/github-script@v7
        env:
          CONTROLLER_HEAD: ${{ needs.publish.outputs.controller_head }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const evidence = path.join(process.env.GITHUB_WORKSPACE, 'target', '.acceptance-evidence');
            fs.mkdirSync(evidence, {recursive: true});
            const failures = [];
            const {data: controller} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.CONTROLLER_PR)});
            const {data: target} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR)});
            const {data: parent} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PARENT_PR)});
            const {data: main} = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'});
            if (controller.state !== 'open' || !controller.draft || controller.head.ref !== process.env.CONTROLLER_BRANCH || controller.head.sha !== process.env.CONTROLLER_HEAD || controller.base.ref !== 'main' || controller.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push('controller authority');
            if (target.state !== 'open' || !target.draft || target.head.ref !== process.env.TARGET_BRANCH || target.head.sha !== process.env.TARGET_HEAD || target.base.ref !== process.env.PARENT_BRANCH || target.base.sha !== process.env.PARENT_HEAD) failures.push('target authority');
            if (parent.state !== 'open' || !parent.draft || parent.head.ref !== process.env.PARENT_BRANCH || parent.head.sha !== process.env.PARENT_HEAD || parent.base.ref !== 'main' || parent.base.sha !== process.env.ACCEPTED_WOS00_BASE) failures.push('parent authority');
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push('main authority');
            fs.writeFileSync(path.join(evidence, 'final-controller-pr.json'), `${JSON.stringify(controller, null, 2)}\n`);
            fs.writeFileSync(path.join(evidence, 'final-target-pr.json'), `${JSON.stringify(target, null, 2)}\n`);
            fs.writeFileSync(path.join(evidence, 'final-parent-pr.json'), `${JSON.stringify(parent, null, 2)}\n`);
            fs.writeFileSync(path.join(evidence, 'final-main.json'), `${JSON.stringify(main, null, 2)}\n`);
            fs.appendFileSync(path.join(evidence, 'gate-outcomes.txt'), `final_authority=${failures.length ? 'FAIL' : 'PASS'}\n`);
            if (failures.length) core.setFailed(failures.join(', '));

      - name: Upload exact proof evidence
        id: artifact_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workos-pr26-artifact-verified-${{ needs.publish.outputs.controller_head }}-${{ env.TARGET_HEAD }}
          path: target/.acceptance-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Verify retained evidence artifact publication
        id: evidence_upload
        if: always()
        shell: bash
        env:
          ARTIFACT_CONCLUSION: ${{ steps.artifact_upload.conclusion }}
          ARTIFACT_ID: ${{ steps.artifact_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$ARTIFACT_CONCLUSION" = success
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          case "$ARTIFACT_DIGEST" in
            sha256:*) ;;
            *) echo 'Artifact digest is not SHA-256 evidence' >&2; exit 1 ;;
          esac
          {
            echo '## Retained exact-head evidence'
            echo
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Digest: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Aggregate exact proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.authority.outcome }}' = success
          test '${{ steps.matrix.outcome }}' = success
          test '${{ steps.final_authority.outcome }}' = success
          test '${{ steps.evidence_upload.outcome }}' = success
