name: WorkOS CI

on:
  pull_request:
    branches: [main, codex/wos-03-modular-api-foundation, codex/utilization-overview-read-recovery, codex/planned-utilization-read-recovery, codex/actual-utilization-read-recovery, codex/forecast-utilization-read-recovery, codex/organization-profile-editor, codex/terminology-configuration-editor, codex/working-calendar-inspector, codex/import-audit-acceptance-journey, codex/wos-04-commercial-drafting-foundation, codex/wos-04-governed-lifecycle, codex/wos-04-scoped-client-profiles, codex/wos-04-governed-amendments, codex/wos-04-flexible-work-capture, codex/wos-04-work-capture-policy, codex/wos-04-daily-weekly-work-capture, codex/wos-04-work-entry-evidence, codex/wos-04-work-entry-reference, codex/wos-04-required-evidence-policy, codex/wos-04-identical-entry-flags, codex/wos-04-work-submission-history, codex/wos-04-capture-role-acceptance, codex/wos-04-overtime-capture-policy, codex/wos-04-submission-deadline-policy, codex/wos-04-work-source-identity, codex/wos-04-workforce-capabilities, codex/wos-04-resource-demand, codex/wos-04-effective-worker-capacity, codex/wos-04-assignment-version-authority, codex/wos-04-own-work-planning, codex/wos-04-assignment-overlap-policy, codex/wos-04-work-category-context, codex/wos-04-actual-work-reconciliation, codex/wos-04-calendar-leave-intake, codex/wos-04-native-percentage-forecast, codex/wos-05-work-approval-routing, codex/wos-04-deadline-inapp-notices, codex/wos-05-assignment-material-approval-local, codex/wos-04-e2-version-state-proof, codex/wos-05-assignment-creation-approval-local, codex/wos-05-reviewed-bulk-decisions-local]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application, migrations, and container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: workos-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKOS_TEST_DATABASE_URL: postgresql://postgres:workos-ci-only@127.0.0.1:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint and syntax check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run unit and contract tests
        env:
          NODE_ENV: test
          APP_MODE: test
          VITE_APP_MODE: test
          ALLOW_TEST_FALLBACK: "true"
          VITE_ALLOW_TEST_FALLBACK: "true"
          DATABASE_URL: postgresql://postgres:workos-ci-only@127.0.0.1:5432/postgres
        run: npm test

      - name: Verify calendar backed leave PostgreSQL migration and API acceptance
        run: npm run test:calendar-leave-postgres

      - name: Verify material assignment staged approval PostgreSQL acceptance
        run: npm run test:assignment-approval-postgres

      - name: Verify UTC deadline canonical in-app PostgreSQL acceptance
        run: npm run test:work-period-notices-postgres

      - name: Verify staged work approval PostgreSQL acceptance
        run: npm run test:work-approval-postgres
      - name: Native percentage forecast PostgreSQL acceptance
        run: npm run test:native-forecast-postgres

      - name: Verify approved actual work PostgreSQL migration and API acceptance
        run: npm run test:actual-work-postgres

      - name: Verify governed work category PostgreSQL migration and API acceptance
        run: npm run test:work-category-postgres

      - name: Verify assignment overlap policy PostgreSQL migration and API acceptance
        run: npm run test:assignment-overlap-postgres

      - name: Verify own-worker period PostgreSQL API acceptance
        run: npm run test:own-work-planning-postgres

      - name: Verify assignment version PostgreSQL migration and API acceptance
        run: npm run test:assignment-versions-postgres

      - name: Verify effective worker capacity PostgreSQL migration and API acceptance
        run: npm run test:worker-capacity-postgres

      - name: Verify work source identity PostgreSQL migration and API acceptance
        run: npm run test:work-source-identity-postgres

      - name: Verify submission deadline PostgreSQL migration and API acceptance
        run: npm run test:submission-deadline-postgres

      - name: Verify overtime capture policy PostgreSQL migration and API acceptance
        run: npm run test:overtime-capture-policy-postgres

      - name: Verify retained work history PostgreSQL API acceptance
        run: npm run test:work-submission-history-postgres

      - name: Verify identical-entry diagnostic PostgreSQL migration and API acceptance
        run: npm run test:duplicate-entry-check-postgres

      - name: Verify required evidence policy PostgreSQL migration and API acceptance
        run: npm run test:required-evidence-policy-postgres

      - name: Verify work reference PostgreSQL migration and API acceptance
        run: npm run test:work-reference-postgres

      - name: Verify work evidence PostgreSQL migration and API acceptance
        run: npm run test:work-evidence-postgres

      - name: Verify work capture modes PostgreSQL migration and API acceptance
        run: npm run test:work-capture-modes-postgres

      - name: Verify work capture policy PostgreSQL migration and API acceptance
        run: npm run test:work-capture-postgres

      - name: Verify work assignment PostgreSQL migration and API acceptance
        run: npm run test:work-assignment-postgres

      - name: Verify governed amendments PostgreSQL migration and API acceptance
        run: npm run test:commercial-amendments-postgres

      - name: Verify scoped client profiles PostgreSQL migration and API acceptance
        run: npm run test:client-profiles-postgres

      - name: Verify structured workforce capabilities PostgreSQL/API acceptance
        run: npm run test:workforce-capabilities-postgres

      - name: Verify resource demand PostgreSQL/API acceptance
        run: npm run test:resource-demand-postgres

      - name: Install Chromium for synthetic browser checks
        run: npx playwright install --with-deps chromium

      - name: Verify work source identity React/API/PostgreSQL journey
        run: npm run test:work-source-identity-journey

      - name: Verify submission deadline React/API/PostgreSQL journey
        run: npm run test:submission-deadline-journey

      - name: Verify overtime capture policy React/API/PostgreSQL journey
        run: npm run test:overtime-capture-policy-journey

      - name: Verify named Employee and approver work capture cycle
        run: npm run test:work-capture-role-journey

      - name: Verify retained work history React/API/PostgreSQL journey
        run: npm run test:work-submission-history-journey

      - name: Verify identical-entry diagnostic React/API/PostgreSQL journey
        run: npm run test:duplicate-entry-check-journey

      - name: Verify required evidence policy React/API/PostgreSQL journey
        run: npm run test:required-evidence-policy-journey

      - name: Verify work reference React/API/PostgreSQL journey
        run: npm run test:work-reference-journey

      - name: Verify work evidence React/API/PostgreSQL journey
        run: npm run test:work-evidence-journey

      - name: Verify real work capture modes PostgreSQL browser journey
        run: npm run test:work-capture-modes-journey

      - name: Verify real work capture policy PostgreSQL browser journey
        run: npm run test:work-capture-journey

      - name: Verify real work assignment PostgreSQL browser journey
        run: npm run test:work-assignment-journey

      - name: Verify real governed amendments PostgreSQL browser journey
        run: npm run test:commercial-amendments-journey

      - name: Verify workforce capabilities React/API/PostgreSQL journey
        run: npm run test:workforce-capabilities-journey

      - name: Verify demand-to-assignment React/API/PostgreSQL journey
        run: npm run test:resource-demand-journey

      - name: Verify effective capacity real React API PostgreSQL journey
        run: npm run test:worker-capacity-journey

      - name: Verify explicit overlap policy Allocation Control React API PostgreSQL journey
        run: npm run test:assignment-overlap-journey

      - name: Verify calendar backed leave Employee approver R6 React API PostgreSQL journey
        run: npm run test:calendar-leave-journey

      - name: Verify material assignment staged approval React acceptance
        run: npm run test:assignment-approval-journey

      - name: Verify UTC deadline canonical inbox React acceptance
        run: npm run test:work-period-notices-journey

      - name: Verify staged work approval React acceptance
        run: npm run test:work-approval-journey
      - name: Native percentage forecast planner browser acceptance
        run: npm run test:native-forecast-journey

      - name: Verify actual work own report export React API PostgreSQL journey
        run: npm run test:actual-work-journey

      - name: Verify governed work category real React API PostgreSQL journey
        run: npm run test:work-category-journey

      - name: Verify own-worker Employee Workspace React API PostgreSQL journey
        run: npm run test:own-work-planning-journey

      - name: Verify assignment version real React API PostgreSQL journey
        run: npm run test:assignment-versions-journey

      - name: Verify import and audit history browser interactions
        env:
          WORKOS_BROWSER_BASE_URL: http://127.0.0.1:4177
          VITE_TERM_EMPLOYEE: employee
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4177 > /tmp/workos-browser-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4177/tests/fixtures/import-history-panel.html > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:import-history-browser
          npm run test:project-import-ui-browser
          npm run test:scoped-audit-browser
          npm run test:organization-audit-browser
          npm run test:deployment-audit-browser
          npm run test:utilization-overview-browser
          npm run test:planned-utilization-browser
          npm run test:actual-utilization-browser
          npm run test:forecast-utilization-browser
          npm run test:organization-profile-browser
          npm run test:terminology-configuration-browser
          npm run test:working-calendar-browser
          npm run test:commercial-drafting-browser
          npm run test:client-profiles-browser

      - name: Verify real import-to-audit PostgreSQL browser acceptance
        run: npm run test:import-audit-journey

      - name: Verify commercial drafting PostgreSQL migration and API acceptance
        run: npm run test:commercial-drafting-postgres

      - name: Verify real commercial drafting PostgreSQL browser journey
        run: npm run test:commercial-drafting-journey

      - name: Verify governed lifecycle PostgreSQL migration and API acceptance
        run: npm run test:commercial-lifecycle-postgres

      - name: Verify real governed lifecycle PostgreSQL browser journey
        run: npm run test:commercial-lifecycle-journey

      - name: Verify real scoped client profiles PostgreSQL browser journey
        run: npm run test:client-profiles-journey

      - name: Prepare disposable schema for production identity tests
        env:
          DATABASE_URL: postgresql://postgres:workos-ci-only@127.0.0.1:5432/postgres
          PGSSLMODE: disable
        run: npm run api:migrate

      - name: Rebuild frontend after artifact hygiene tests
        run: npm run build

      - name: Run production identity and fail-closed startup tests
        env:
          DATABASE_URL: postgresql://postgres:workos-ci-only@127.0.0.1:5432/postgres
          PGSSLMODE: disable
        run: npm run test:production-identity

      - name: Run fresh-install, upgrade, and concurrent migration tests
        run: npm run test:migrations

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - name: Validate production Compose configuration
        env:
          POSTGRES_DB: workos
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: synthetic-ci-password
          DATABASE_URL: postgresql://workos:synthetic-ci-password@db:5432/workos
          API_SESSION_SECRET: synthetic-ci-session-secret-with-more-than-32-characters
          APP_URL: https://workos.example.test
          IDENTITY_PROVIDER: entra
          ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000001
          ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000002
          ENTRA_CLIENT_SECRET: synthetic-client-secret
          ENTRA_REDIRECT_URI: https://workos.example.test/api/auth/entra/callback
        run: docker compose config --quiet

      - name: Build production container
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" --build-arg APP_VERSION="$APP_VERSION" -t workos-ci:"$GITHUB_SHA" .

      - name: Verify container refuses incomplete production configuration
        run: |
          set -euo pipefail
          if docker run --rm workos-ci:"$GITHUB_SHA" > /tmp/workos-startup.log 2>&1; then
            echo "Production startup unexpectedly accepted an incomplete environment."
            exit 1
          fi
          if ! grep -q 'DATABASE_URL' /tmp/workos-startup.log; then
            echo "Production startup failed without identifying the missing database setting."
            exit 1
          fi

  secret-scan:
    name: Scan full history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
