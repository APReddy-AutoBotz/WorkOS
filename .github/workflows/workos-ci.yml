name: WorkOS CI

on:
  pull_request:
    branches: [main, 'codex/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Check documentation scope
    runs-on: ubuntu-24.04
    outputs:
      prose: ${{ steps.scope.outputs.prose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: scope
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        run: |
          set -euo pipefail
          # Compare the tested merge tree to its actual base parent.
          changes=$(git diff --no-renames --name-status HEAD^1 HEAD)
          [[ -n "$changes" ]] || exit 0
          while IFS= read -r change; do
            case "$change" in
              $'M\tCHANGELOG.md'|$'M\tdocs/00-control/IMPLEMENTATION_STATUS.md'|$'M\tdocs/05-delivery/ENTERPRISE_DELIVERY_ROADMAP.md') ;;
              *) exit 0 ;;
            esac
          done <<< "$changes"
          summary=$(git diff --summary HEAD^1 HEAD)
          [[ -z "$summary" ]] || exit 0
          git diff --check HEAD^1 HEAD
          echo "prose=true" >> "$GITHUB_OUTPUT"

  application:
    name: Run application and deployment checks
    needs: scope
    if: needs.scope.outputs.prose != 'true'
    # The locked Playwright browser registry supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: workos-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKOS_TEST_DATABASE_URL: postgresql://postgres:workos-ci-only@127.0.0.1:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify bootstrap hygiene and adversarial scanner fixtures
        run: node scripts/scan-bootstrap.mjs --self-test

      - name: Type check
        run: npm run typecheck

      - name: Lint and syntax check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run unit and contract tests
        env:
          NODE_ENV: test
          APP_MODE: test
          VITE_APP_MODE: test
          ALLOW_TEST_FALLBACK: "true"
          VITE_ALLOW_TEST_FALLBACK: "true"
          DATABASE_URL: postgresql://postgres:workos-ci-only@127.0.0.1:5432/postgres
        run: npm test

      - name: Verify legacy approval ownership and delegation scope
        run: npm run test:legacy-approval-scope

      - name: Verify delegated timesheet source authority
        run: npm run test:legacy-timesheet-delegation

      - name: Verify calendar leave intake and decisions in PostgreSQL
        run: |
          npm run test:calendar-leave-postgres
          npm run test:named-delegation
          npm run test:named-delegation-postgres
          npm run test:leave-approval-postgres

      - name: Native percentage forecast PostgreSQL acceptance
        run: npm run test:native-forecast-postgres

      - name: Verify staged work approval PostgreSQL acceptance
        run: npm run test:work-approval-postgres

      - name: Verify UTC deadline notices in PostgreSQL
        run: npm run test:work-period-notices-postgres

      - name: Verify material assignment approvals in PostgreSQL
        run: |
          npm run test:assignment-approval-postgres
          npm run test:assignment-creation-postgres

      - name: Verify scoped workforce directory postgres
        run: npm run test:workforce-directory-postgres

      - name: Verify billing and cost candidates postgres
        run: npm run test:rate-candidate-postgres

      - name: Verify approved actual work reconciliation in PostgreSQL
        run: npm run test:actual-work-postgres

      - name: Verify work category API and migration
        run: npm run test:work-category-postgres

      - name: Verify assignment overlap policy in PostgreSQL
        run: npm run test:assignment-overlap-postgres

      - name: Verify persistent authentication budgets across replica and restart
        run: npm run test:persistent-auth-throttle

      - name: Verify scoped and sanitized notification diagnostics
        run: npm run test:notification-delivery-scope

      - name: Verify independent leave decisions and Teams boundary
        run: npm run test:leave-decision-independence
      - name: Current workforce identity bindings
        run: npm run test:live-workforce-bindings

      - name: Verify durable session revocation and absolute expiry
        run: npm run test:session-revocation-postgres

      - name: Verify setup read permissions and error containment
        run: npm run test:setup-read-boundaries

      - name: Verify database TLS trust and hostname enforcement
        run: npm run test:database-tls

      - name: Verify own-worker period PostgreSQL API acceptance
        run: npm run test:own-work-planning-postgres

      - name: Verify current selected-role PostgreSQL authority
        run: npm run test:current-role-postgres

      - name: Verify protected identity administration
        run: npm run test:protected-identity-postgres

      - name: Verify assignment version PostgreSQL migration and API acceptance
        run: npm run test:assignment-versions-postgres

      - name: Verify effective worker capacity PostgreSQL migration and API acceptance
        run: npm run test:worker-capacity-postgres

      - name: Verify work source identity PostgreSQL migration and API acceptance
        run: npm run test:work-source-identity-postgres

      - name: Verify submission deadline PostgreSQL migration and API acceptance
        run: npm run test:submission-deadline-postgres

      - name: Verify overtime capture policy PostgreSQL migration and API acceptance
        run: npm run test:overtime-capture-policy-postgres

      - name: Verify retained work history PostgreSQL API acceptance
        run: npm run test:work-submission-history-postgres

      - name: Verify identical-entry diagnostic PostgreSQL migration and API acceptance
        run: npm run test:duplicate-entry-check-postgres

      - name: Verify required evidence policy PostgreSQL migration and API acceptance
        run: npm run test:required-evidence-policy-postgres

      - name: Verify work reference PostgreSQL migration and API acceptance
        run: npm run test:work-reference-postgres

      - name: Verify work evidence PostgreSQL migration and API acceptance
        run: npm run test:work-evidence-postgres

      - name: Verify work capture modes PostgreSQL migration and API acceptance
        run: npm run test:work-capture-modes-postgres

      - name: Verify work capture policy PostgreSQL migration and API acceptance
        run: npm run test:work-capture-postgres

      - name: Verify work assignment PostgreSQL migration and API acceptance
        run: npm run test:work-assignment-postgres

      - name: Verify patched dependency security behavior
        run: npm run test:dependency-security

      - name: Verify governed amendments PostgreSQL migration and API acceptance
        run: npm run test:commercial-amendments-postgres

      - name: Verify scoped client profiles PostgreSQL migration and API acceptance
        run: npm run test:client-profiles-postgres

      - name: Verify structured workforce capabilities PostgreSQL/API acceptance
        run: npm run test:workforce-capabilities-postgres

      - name: Verify resource demand PostgreSQL/API acceptance
        run: npm run test:resource-demand-postgres

      - name: Install Chromium for synthetic browser checks
        run: |
          npx --no-install playwright install chromium
          if ! node --input-type=module -e "import {chromium} from 'playwright'; const browser = await chromium.launch(); await browser.close()"; then
            npx --no-install playwright install-deps chromium
          fi

      - name: Verify concurrent deployment settings audit and rollback
        run: node tests/settings-audit-postgres-smoke.mjs

      - name: Verify acknowledged settings save and load recovery
        run: npm run test:settings-save-outcomes-browser

      - name: Verify legacy approval delegation browser journey
        run: npm run test:legacy-approval-browser

      - name: Verify calendar leave browser journey
        run: |
          npm run test:calendar-leave-journey
          node tests/reviewed-approval-batch-journey-browser-smoke.mjs
          npm run test:named-delegation-journey
          npm run test:leave-approval-journey

      - name: Native percentage forecast planner browser acceptance
        run: npm run test:native-forecast-journey

      - name: Verify staged work approval React acceptance
        run: npm run test:work-approval-journey

      - name: Verify UTC deadline notices in browser
        run: npm run test:work-period-notices-journey

      - name: Verify material assignment approvals in browser
        run: |
          npm run test:assignment-approval-journey
          npm run test:assignment-creation-journey

      - name: Verify scoped workforce directory journey
        run: npm run test:workforce-directory-journey

      - name: Verify billing and cost candidates journey
        run: npm run test:rate-candidate-journey

      - name: Verify actual utilization and evidence download in Chromium
        run: npm run test:actual-work-journey

      - name: Verify governed work category browser journey
        run: npm run test:work-category-journey

      - name: Verify assignment overlap browser journey
        run: npm run test:assignment-overlap-journey

      - name: Verify the compiled production login page
        run: node tests/production-frontend-browser.mjs

      - name: Verify the development login page and state-preserving refresh
        run: node tests/development-frontend-browser.mjs

      - name: Verify real notification diagnostics browser journey
        run: npm run test:notification-diagnostics-browser

      - name: Verify operational timesheet CSV safety
        run: npm run test:timesheet-export-browser

      - name: Verify independent leave decision browser journey
        run: npm run test:leave-decision-browser

      - name: Verify actual sign-in and durable logout browser journey
        run: npm run test:session-logout-browser

      - name: Verify work source identity React/API/PostgreSQL journey
        run: npm run test:work-source-identity-journey

      - name: Verify submission deadline React/API/PostgreSQL journey
        run: npm run test:submission-deadline-journey

      - name: Verify overtime capture policy React/API/PostgreSQL journey
        run: npm run test:overtime-capture-policy-journey

      - name: Verify named Employee and approver work capture cycle
        run: npm run test:work-capture-role-journey

      - name: Verify retained work history React/API/PostgreSQL journey
        run: npm run test:work-submission-history-journey

      - name: Verify identical-entry diagnostic React/API/PostgreSQL journey
        run: npm run test:duplicate-entry-check-journey

      - name: Verify required evidence policy React/API/PostgreSQL journey
        run: npm run test:required-evidence-policy-journey

      - name: Verify work reference React/API/PostgreSQL journey
        run: npm run test:work-reference-journey

      - name: Verify work evidence React/API/PostgreSQL journey
        run: npm run test:work-evidence-journey

      - name: Verify real work capture modes PostgreSQL browser journey
        run: npm run test:work-capture-modes-journey

      - name: Verify real work capture policy PostgreSQL browser journey
        run: npm run test:work-capture-journey

      - name: Verify real work assignment PostgreSQL browser journey
        run: npm run test:work-assignment-journey

      - name: Verify timesheet view ownership under delayed responses
        run: npm run test:timesheet-ownership-browser

      - name: Verify real governed amendments PostgreSQL browser journey
        run: npm run test:commercial-amendments-journey

      - name: Verify workforce capabilities React/API/PostgreSQL journey
        run: npm run test:workforce-capabilities-journey

      - name: Verify demand-to-assignment React/API/PostgreSQL journey
        run: npm run test:resource-demand-journey

      - name: Verify effective capacity real React API PostgreSQL journey
        run: npm run test:worker-capacity-journey

      - name: Verify own-worker Employee Workspace React API PostgreSQL journey
        run: npm run test:own-work-planning-journey

      - name: Verify assignment version real React API PostgreSQL journey
        run: npm run test:assignment-versions-journey

      - name: Verify import and audit history browser interactions
        env:
          WORKOS_BROWSER_BASE_URL: http://127.0.0.1:4177
          VITE_TERM_EMPLOYEE: employee
        run: |
          set -euo pipefail
          node tests/support/serve-browser-fixtures.mjs &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4177/tests/fixtures/import-history-panel.html > /dev/null; then
              break
            fi
            sleep 1
          done
          # Each browser owns its session. The shared fixture server serves static test pages.
          xargs -n 1 -P 2 npm run <<'BROWSER_JOURNEYS'
          test:import-history-browser
          test:project-import-ui-browser
          test:scoped-audit-browser
          test:organization-audit-browser
          test:deployment-audit-browser
          test:utilization-overview-browser
          test:planned-utilization-browser
          test:planning-signals-browser
          test:actual-utilization-browser
          test:forecast-utilization-browser
          test:organization-profile-browser
          test:terminology-configuration-browser
          test:working-calendar-browser
          test:commercial-drafting-browser
          test:client-profiles-browser
          BROWSER_JOURNEYS

      - name: Verify commercial ownership, approvals, adopted rates, valuation and eligibility in PostgreSQL
        run: |
          node tests/commercial-approval-postgres-smoke.mjs
          node tests/commercial-approval-sql-smoke.mjs
          node tests/commercial-approval-upgrade-postgres-smoke.mjs
          node tests/commercial-owner-loss-postgres-smoke.mjs
          node tests/commercial-owner-postgres-smoke.mjs
          node tests/commercial-owner-upgrade-postgres-smoke.mjs
          node tests/governed-tm-postgres-smoke.mjs
          node tests/governed-tm-sql-smoke.mjs
          node tests/governed-tm-upgrade-postgres-smoke.mjs
          node tests/rate-adoption-postgres-smoke.mjs
          node tests/rate-adoption-upgrade-postgres-smoke.mjs
          node tests/tm-billing-eligibility-postgres-smoke.mjs
          node tests/tm-billing-eligibility-upgrade-postgres-smoke.mjs

      - name: Verify scoped T&M reconciliation, control totals and CSV export
        run: |
          node tests/billing-reconciliation-boundaries-smoke.mjs
          node tests/billing-reconciliation-postgres-smoke.mjs
          node tests/billing-reconciliation-journey-browser-smoke.mjs
          node tests/billing-reconciliation-journey-browser-smoke.mjs --reject-reversal

      - name: Verify milestone invoice lifecycle, mixed decisions and populated upgrade
        run: |
          node tests/milestone-invoice-postgres-smoke.mjs
          node tests/milestone-mixed-bulk-postgres-smoke.mjs
          node tests/milestone-populated-upgrade-postgres-smoke.mjs

      - name: Verify milestone acceptance, staged eligibility and register journey
        run: node tests/milestone-billing-postgres-smoke.mjs

      - name: Verify invoice action notices, authorization, upgrade and recipient journey
        run: |
          node tests/invoice-action-postgres-smoke.mjs
          node tests/invoice-action-upgrade-postgres-smoke.mjs
          node tests/invoice-action-journey-browser-smoke.mjs

      - name: Verify manual billing confirmation, recovery, upgrade and browser journey
        run: |
          node tests/invoice-billing-confirmation-journey-browser-smoke.mjs
          node tests/invoice-billing-confirmation-postgres-smoke.mjs
          node tests/invoice-billing-confirmation-recovery-postgres-smoke.mjs
          node tests/invoice-billing-confirmation-schema-smoke.mjs
          node tests/invoice-billing-confirmation-upgrade-postgres-smoke.mjs

      - name: Verify approved invoice export, receipt recovery and notifications
        run: |
          node tests/invoice-csv-upgrade-postgres-smoke.mjs
          node tests/invoice-export-event-recovery-postgres-smoke.mjs
          node tests/invoice-export-notification-config-api-smoke.mjs
          node tests/invoice-export-notification-journey-browser-smoke.mjs
          node tests/invoice-export-notification-journey-postgres-smoke.mjs
          node tests/invoice-export-notification-journey-postgres-smoke.mjs --provider
          node tests/invoice-export-notification-journey-postgres-smoke.mjs --provider-rejected
          node tests/invoice-export-notification-postgres-smoke.mjs
          node tests/invoice-export-notification-ui-browser-smoke.mjs
          node tests/invoice-export-notification-upgrade-postgres-smoke.mjs
          node tests/invoice-export-operational-failure-postgres-smoke.mjs
          node tests/invoice-export-recipient-recovery-postgres-smoke.mjs

      - name: Verify invoice batch approval, upgrades and browser decisions
        run: |
          node tests/invoice-batch-approval-postgres-smoke.mjs
          node tests/invoice-batch-approval-upgrade-postgres-smoke.mjs
          node tests/invoice-batch-approval-journey-browser-smoke.mjs

      - name: Verify invoice draft reservations, cancellation, upgrades and browser journeys
        run: |
          node tests/invoice-draft-postgres-smoke.mjs
          node tests/invoice-draft-upgrade-postgres-smoke.mjs
          node tests/invoice-draft-journey-browser-smoke.mjs

      - name: Verify commercial reviewer, finance and billing browser journeys
        run: |
          node tests/commercial-approval-journey-browser-smoke.mjs
          node tests/commercial-owner-journey-browser-smoke.mjs
          node tests/governed-tm-journey-browser-smoke.mjs
          node tests/rate-adoption-journey-browser-smoke.mjs
          node tests/tm-billing-eligibility-journey-browser-smoke.mjs

      - name: Verify real import-to-audit browser and PostgreSQL journey
        env:
          WORKOS_TEST_DATABASE_URL: postgresql://postgres:workos-ci-only@127.0.0.1:5432/postgres
        run: npm run test:import-audit-journey

      - name: Verify commercial drafting PostgreSQL migration and API acceptance
        run: npm run test:commercial-drafting-postgres

      - name: Verify real commercial drafting PostgreSQL browser journey
        run: PATH="/usr/lib/postgresql/16/bin:$PATH" npm run test:commercial-drafting-journey -- --restore-credit

      - name: Verify governed lifecycle PostgreSQL migration and API acceptance
        run: npm run test:commercial-lifecycle-postgres

      - name: Verify real governed lifecycle PostgreSQL browser journey
        run: npm run test:commercial-lifecycle-journey

      - name: Verify real scoped client profiles PostgreSQL browser journey
        run: npm run test:client-profiles-journey

      - name: Prepare disposable schema for production identity tests
        env:
          DATABASE_URL: postgresql://postgres:workos-ci-only@127.0.0.1:5432/postgres
          PGSSLMODE: disable
        run: npm run api:migrate

      - name: Rebuild frontend after artifact hygiene tests
        run: npm run build

      - name: Build production container
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" --build-arg APP_VERSION="$APP_VERSION" -t workos-ci:"$GITHUB_SHA" .

      - name: Verify packaged production identity, readiness and fail-closed startup
        env:
          WORKOS_TEST_PRODUCTION_IMAGE: workos-ci:${{ github.sha }}
          DATABASE_URL: postgresql://postgres:workos-ci-only@127.0.0.1:5432/postgres
          PGSSLMODE: disable
        run: npm run test:production-identity

      - name: Run fresh-install, upgrade, and concurrent migration tests
        run: npm run test:migrations

      - name: Verify audited deployment session lifetime and database permissions
        run: npm run test:session-policy

      - name: Verify delivery monitoring with PostgreSQL
        run: npm run test:delivery-health

      - name: Measure Standard-profile authenticated API performance
        run: npm run test:standard-profile

      - name: Rehearse PostgreSQL archive recovery and verify restored application access
        run: PATH="/usr/lib/postgresql/16/bin:$PATH" npm run test:restore

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - name: Validate production Compose configuration
        env:
          POSTGRES_DB: workos
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: synthetic-ci-password
          DATABASE_URL: postgresql://workos:synthetic-ci-password@db:5432/workos
          API_SESSION_SECRET: synthetic-ci-session-secret-with-more-than-32-characters
          APP_URL: https://workos.example.test
          IDENTITY_PROVIDER: entra
          ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000001
          ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000002
          ENTRA_CLIENT_SECRET: synthetic-client-secret
          ENTRA_REDIRECT_URI: https://workos.example.test/api/auth/entra/callback
        run: |
          docker compose config --quiet
          API_SESSION_TTL_HOURS=0.25 docker compose config --format json |
            node -e "const config = JSON.parse(require('node:fs').readFileSync(0, 'utf8')); require('node:assert/strict').equal(config.services.app.environment.API_SESSION_TTL_HOURS, '0.25')"

      - name: Verify pinned deployment inputs
        run: node tests/container-inputs-smoke.mjs

      - name: Verify container refuses incomplete production configuration
        run: |
          set -euo pipefail
          if docker run --rm workos-ci:"$GITHUB_SHA" > /tmp/workos-startup.log 2>&1; then
            echo "Production startup unexpectedly accepted an incomplete environment."
            exit 1
          fi
          if ! grep -q 'DATABASE_URL' /tmp/workos-startup.log; then
            echo "Production startup failed without identifying the missing database setting."
            exit 1
          fi

      - name: Package tested container and runtime inventories
        run: bash scripts/package-tested-image.sh "workos-ci:$GITHUB_SHA" "$GITHUB_SHA" "$RUNNER_TEMP/workos-image"

      - name: Retain checksummed container evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workos-image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate application, migrations, and container
    needs: [scope, application]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected checks
        env:
          SCOPE: ${{ needs.scope.result }}
          PROSE: ${{ needs.scope.outputs.prose }}
          APPLICATION: ${{ needs.application.result }}
        run: |
          [[ "$SCOPE" == success ]] && {
            [[ "$PROSE" == true && "$APPLICATION" == skipped ]] ||
            [[ "$PROSE" != true && "$APPLICATION" == success ]]
          }

  secret-scan:
    name: Scan full history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.24.3_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$archive"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          test "$(git rev-parse --is-shallow-repository)" = false
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all --diff-merges=first-parent" --redact=100 --exit-code=2 --no-banner .
