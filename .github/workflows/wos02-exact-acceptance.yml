name: WOS-02 Exact-Head Organization Setup Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wos02-exact-acceptance.yml'
      - '.github/scripts/wos02-live-acceptance.mjs'

permissions:
  contents: read
  pull-requests: read

env:
  TARGET_PR: '37'
  TARGET_BRANCH: codex/wos-02-organization-setup-foundation
  TARGET_HEAD: 5fdb5ef950e20382dad02874f6bad97161a350ee
  TARGET_TREE: 799fb8711d7d770ac3a6ee67f7267100d3aa184d
  EXPECTED_MAIN_HEAD: 3070c80a71640fa4275477d0d2f1538cc8d2a819
  CONTROLLER_BRANCH: controller/wos02-exact-acceptance
  RETAINED_WOS01_CONTROLLER: b48f40b61d26c21920b00f658a720c02b1f01c08
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: workos
  PGPASSWORD: workos

concurrency:
  group: wos02-exact-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    name: Exact-head WOS-02 engineering acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Verify exact controller, target, main and changed-file authority
        id: authority
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const controller = context.payload.pull_request;
            if (!controller) failures.push('missing controller pull_request payload');
            if (controller?.state !== 'open') failures.push(`controller.state=${controller?.state}`);
            if (!controller?.draft) failures.push('controller is not Draft');
            if (controller?.head?.ref !== process.env.CONTROLLER_BRANCH) failures.push(`controller.head.ref=${controller?.head?.ref}`);
            if (controller?.base?.ref !== 'main') failures.push(`controller.base.ref=${controller?.base?.ref}`);
            if (controller?.base?.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`controller.base.sha=${controller?.base?.sha}`);

            const controllerFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: controller.number, per_page: 100,
            });
            const actualController = controllerFiles.map(f => f.filename).sort();
            const expectedController = [
              '.github/scripts/wos02-live-acceptance.mjs',
              '.github/workflows/wos02-exact-acceptance.yml',
            ].sort();
            if (JSON.stringify(actualController) !== JSON.stringify(expectedController)) failures.push(`controller.paths=${JSON.stringify(actualController)}`);

            const {data: target} = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR),
            });
            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target is not Draft');
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`target.head.sha=${target.head.sha}`);
            if (target.base.ref !== 'main') failures.push(`target.base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`target.base.sha=${target.base.sha}`);

            const targetFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR), per_page: 100,
            });
            const actualTarget = targetFiles.map(f => f.filename).sort();
            const expectedTarget = [
              'docs/00-control/REQUIREMENTS_TRACEABILITY.md',
              'docs/tasks/WOS-02-ORGANIZATION-SETUP-FOUNDATION.md',
              'package.json',
              'server/index.mjs',
              'server/migrations/022_organization_setup_foundation.sql',
              'server/organization-setup.mjs',
              'src/pages/AdminSettings.tsx',
              'src/services/api.ts',
              'src/types.ts',
              'tests/organization-setup-smoke.mjs',
            ].sort();
            if (JSON.stringify(actualTarget) !== JSON.stringify(expectedTarget)) failures.push(`target.paths=${JSON.stringify(actualTarget)}`);

            const {data: main} = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'});
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);
            const {data: compare} = await github.rest.repos.compareCommits({
              owner: context.repo.owner, repo: context.repo.repo,
              base: process.env.EXPECTED_MAIN_HEAD, head: process.env.TARGET_HEAD,
            });
            if (compare.merge_base_commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`merge_base=${compare.merge_base_commit.sha}`);
            if (compare.status !== 'ahead') failures.push(`compare.status=${compare.status}`);
            if (compare.behind_by !== 0) failures.push(`behind_by=${compare.behind_by}`);
            if (failures.length) core.setFailed(`WOS-02 authority failed: ${failures.join(', ')}`);

      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact WOS-02 product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact accepted WOS-01A main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_HEAD }}
          path: accepted-main
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout retained WOS-01A browser authority
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RETAINED_WOS01_CONTROLLER }}
          path: retained-wos01-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            target/package-lock.json
            accepted-main/package-lock.json

      - name: Verify immutable target tree and pristine inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git -C target rev-parse "$TARGET_HEAD^{tree}")" = "$TARGET_TREE"
          test "$(git -C target write-tree)" = "$TARGET_TREE"
          test -z "$(git -C target status --porcelain)"
          test "$(git -C accepted-main rev-parse HEAD)" = "$EXPECTED_MAIN_HEAD"
          test -z "$(git -C accepted-main status --porcelain)"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix target
          npm ci --prefix accepted-main

      - name: Run WOS-02 and retained engineering regressions
        shell: bash
        working-directory: target
        env:
          APP_MODE: test
          VITE_APP_MODE: test
          ALLOW_TEST_FALLBACK: 'true'
          VITE_ALLOW_TEST_FALLBACK: 'true'
        run: |
          set -euo pipefail
          npm run test:organization-setup
          npm test
          npm run test:backend
          npm run test:authorization-convergence
          npm run typecheck
          npm run lint
          npm run test:bootstrap-scan
          npm run test:wos00-baseline
          npm audit --omit=dev --audit-level=high
          git diff --check "$EXPECTED_MAIN_HEAD..$TARGET_HEAD"

      - name: Verify production startup remains fail closed without required configuration
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          set +e
          env -u DATABASE_URL -u API_SESSION_SECRET NODE_ENV=production timeout 10s node server/start-production.mjs > "$RUNNER_TEMP/prod-fail-closed.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/prod-fail-closed.log"
          test "$rc" -ne 0
          grep -Eq 'DATABASE_URL|API_SESSION_SECRET|required' "$RUNNER_TEMP/prod-fail-closed.log"

      - name: Wait for PostgreSQL and create acceptance databases
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres && break; sleep 1; done
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres
          for db in wos02_fresh wos02_upgrade wos02_live wos02_prod; do
            dropdb --if-exists -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$db"
            createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$db"
          done

      - name: Prove fresh-install and replay migration ledger
        shell: bash
        working-directory: target
        env:
          DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_fresh
        run: |
          set -euo pipefail
          node server/migrate.mjs | tee "$RUNNER_TEMP/wos02-fresh-first.log"
          first="$(psql "$DATABASE_URL" -Atc "select count(*) from schema_migrations where id='022_organization_setup_foundation'")"
          test "$first" = 1
          node server/migrate.mjs | tee "$RUNNER_TEMP/wos02-fresh-replay.log"
          replay="$(psql "$DATABASE_URL" -Atc "select count(*) from schema_migrations where id='022_organization_setup_foundation'")"
          test "$replay" = 1

      - name: Prove WOS-01A upgrade, deterministic backfill and replay
        shell: bash
        env:
          UPGRADE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_upgrade
        run: |
          set -euo pipefail
          (cd accepted-main && DATABASE_URL="$UPGRADE_URL" node server/migrate.mjs)
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into country_directors(id,name,region) values('cd-upgrade','Upgrade Director','Test') on conflict (id) do nothing;
          insert into users(id,username,email,status) values('00000000-0000-0000-0000-000000000101','upgrade-user','upgrade-user@example.test','Active');
          insert into employees(id,employee_id,name,email,designation,department,country,primary_country_director_id,status)
            values('e-upgrade','E-UPGRADE','Upgrade Employee','upgrade-employee@example.test','Engineer','Delivery','Test','cd-upgrade','Active');
          insert into clients(id,name) values('client-upgrade','Upgrade Client');
          insert into projects(id,project_code,name,client_id,client,manager_name,start_date,end_date,status)
            values('p-upgrade','P-UPGRADE','Upgrade Project','client-upgrade','Upgrade Client','Upgrade Manager','2026-01-01','2026-12-31','Active');
          insert into project_allocations(id,employee_id,project_id,percentage,start_date,end_date,status)
            values('a-upgrade','e-upgrade','p-upgrade',100,'2026-01-01','2026-12-31','Active');
          insert into timesheets(id,employee_id,week_ending,status,total_hours,billable_hours)
            values('00000000-0000-0000-0000-000000000102','e-upgrade','2026-01-04','Draft',0,0);
          SQL
          before="$(psql "$UPGRADE_URL" -Atc "select (select count(*) from employees)||'|'||(select count(*) from clients)||'|'||(select count(*) from projects)||'|'||(select count(*) from project_allocations)||'|'||(select count(*) from timesheets)")"
          (cd target && DATABASE_URL="$UPGRADE_URL" node server/migrate.mjs)
          after="$(psql "$UPGRADE_URL" -Atc "select (select count(*) from employees)||'|'||(select count(*) from clients)||'|'||(select count(*) from projects)||'|'||(select count(*) from project_allocations)||'|'||(select count(*) from timesheets)")"
          test "$before" = "$after"
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id||'|'||legal_entity_id from employees where id='e-upgrade'")" = 'org-default|legal-default'
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id||'|'||legal_entity_id from clients where id='client-upgrade'")" = 'org-default|legal-default'
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id||'|'||legal_entity_id from projects where id='p-upgrade'")" = 'org-default|legal-default'
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id from project_allocations where id='a-upgrade'")" = 'org-default'
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id from timesheets where id='00000000-0000-0000-0000-000000000102'")" = 'org-default'
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from user_organization_scopes where user_id='00000000-0000-0000-0000-000000000101' and organization_id='org-default' and legal_entity_id='legal-default'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from worker_profiles where employee_id='e-upgrade' and organization_id='org-default' and legal_entity_id='legal-default'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from worker_history where employee_id='e-upgrade'")" = 1
          (cd target && DATABASE_URL="$UPGRADE_URL" node server/migrate.mjs)
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from schema_migrations where id='022_organization_setup_foundation'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from worker_history where employee_id='e-upgrade'")" = 1

      - name: Run live organization/scope/lifecycle adversarial acceptance
        shell: bash
        working-directory: controller
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
          DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_live
        run: |
          set -euo pipefail
          (cd "$TARGET_ROOT" && DATABASE_URL="$DATABASE_URL" node server/migrate.mjs)
          node .github/scripts/wos02-live-acceptance.mjs

      - name: Run retained production identity acceptance on migrated WOS-02 schema
        shell: bash
        working-directory: target
        env:
          DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_prod
          WOS_PRODUCTION_IDENTITY_PORT: '4010'
          WOS_IDENTITY_DISCOVERY_PORT: '4011'
        run: |
          set -euo pipefail
          node server/migrate.mjs
          npm run test:production-identity

      - name: Build exact WOS-02 browser bundle
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          rm -rf dist
          VITE_APP_MODE=test \
          VITE_ALLOW_TEST_FALLBACK=true \
          VITE_PRODUCT_NAME=WorkOS \
          VITE_ORGANIZATION_NAME='Acceptance Organization' \
          VITE_PRODUCT_LOGO_URL=/workos-mark.svg \
          VITE_SUPPORT_EMAIL=support@example.test \
            npm run build
          test "$(git write-tree)" = "$TARGET_TREE"

      - name: Run retained real-Chrome role and denial journeys
        shell: bash
        env:
          WOS_BROWSER_ORIGIN: http://127.0.0.1:4173
          WOS_APP_READY_TIMEOUT_MS: '120000'
          WOS_CHROME_HANDSHAKE_EVIDENCE: ${{ runner.temp }}/wos02-browser-evidence.json
        run: |
          set -euo pipefail
          (cd target && npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vite-preview.log" 2>&1) &
          preview_pid=$!
          cleanup() { kill "$preview_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          timeout 8m node retained-wos01-controller/.github/scripts/wos01a-browser-acceptance-v2.mjs
          test -s "$WOS_CHROME_HANDSHAKE_EVIDENCE"

      - name: Re-verify final live authority
        id: final_authority
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const {data: target} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR)});
            const {data: main} = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'});
            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target is not Draft');
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`target.head.sha=${target.head.sha}`);
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);
            if (failures.length) core.setFailed(`WOS-02 final authority failed: ${failures.join(', ')}`);

      - name: Upload exact-head WOS-02 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos02-exact-acceptance-${{ env.TARGET_HEAD }}
          path: |
            ${{ runner.temp }}/prod-fail-closed.log
            ${{ runner.temp }}/wos02-fresh-first.log
            ${{ runner.temp }}/wos02-fresh-replay.log
            ${{ runner.temp }}/wos02-browser-evidence.json
            ${{ runner.temp }}/vite-preview.log
          if-no-files-found: warn
          retention-days: 14

      - name: Aggregate exact-head authority result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.authority.outcome }}' = success
          test '${{ steps.final_authority.outcome }}' = success
