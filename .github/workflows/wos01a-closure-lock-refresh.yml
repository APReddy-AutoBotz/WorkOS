name: WOS-01A Closure Lock Refresh

on:
  push:
    branches:
      - codex/wos01a-acceptance-closure
    paths:
      - package.json
      - tests/document-metadata-smoke.mjs
      - .github/workflows/wos01a-closure-lock-refresh.yml

concurrency:
  group: wos01a-closure-lock-refresh
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/wos01a-acceptance-closure
  TARGET_PR_NUMBER: '27'
  PARENT_PR_NUMBER: '16'
  EXPECTED_PARENT_HEAD: 590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60
  EXPECTED_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  WORKFLOW_PATH: .github/workflows/wos01a-closure-lock-refresh.yml

jobs:
  prepare:
    name: Generate and verify exact lockfile
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      lock_sha256: ${{ steps.digest.outputs.lock_sha256 }}
    steps:
      - name: Verify exact Draft stack authority
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const {data: target} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR_NUMBER),
            });
            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target is not Draft');
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha !== context.sha) failures.push(`target.head.sha=${target.head.sha}`);
            if (target.base.ref !== 'codex/wos-01-authorized-source-bootstrap-v2') failures.push(`target.base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.EXPECTED_PARENT_HEAD) failures.push(`target.base.sha=${target.base.sha}`);

            const {data: parent} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PARENT_PR_NUMBER),
            });
            if (parent.state !== 'open') failures.push(`parent.state=${parent.state}`);
            if (!parent.draft) failures.push('parent is not Draft');
            if (parent.head.sha !== process.env.EXPECTED_PARENT_HEAD) failures.push(`parent.head.sha=${parent.head.sha}`);
            if (parent.base.sha !== process.env.EXPECTED_BASE) failures.push(`parent.base.sha=${parent.base.sha}`);
            if (failures.length) core.setFailed(`WOS-01A closure authority failed: ${failures.join(', ')}`);

      - name: Checkout exact product-closure head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate package-manager lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "$(git config --local --get-regexp 'http\..*\.extraheader|credential\..*|credential.helper' || true)"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dependency disposition
        id: audits
        shell: bash
        run: |
          set -euo pipefail
          runtime_rc=0
          full_rc=0
          npm audit --omit=dev --json > /tmp/npm-audit-runtime.json || runtime_rc=$?
          npm audit --json > /tmp/npm-audit-full.json || full_rc=$?
          RUNTIME_RC="$runtime_rc" FULL_RC="$full_rc" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';

          const parse = (path, exitCode) => {
            const report = JSON.parse(readFileSync(path, 'utf8'));
            const counts = report.metadata?.vulnerabilities || {};
            return {
              exitCode,
              counts: {
                info: Number(counts.info || 0),
                low: Number(counts.low || 0),
                moderate: Number(counts.moderate || 0),
                high: Number(counts.high || 0),
                critical: Number(counts.critical || 0),
                total: Number(counts.total || 0),
              },
              packages: Object.entries(report.vulnerabilities || {})
                .map(([name, value]) => ({
                  name,
                  severity: value.severity,
                  direct: Boolean(value.isDirect),
                  range: value.range,
                  fixAvailable: value.fixAvailable,
                }))
                .sort((a, b) => a.name.localeCompare(b.name)),
            };
          };

          const runtime = parse('/tmp/npm-audit-runtime.json', Number(process.env.RUNTIME_RC));
          const full = parse('/tmp/npm-audit-full.json', Number(process.env.FULL_RC));
          console.log(JSON.stringify({runtime, full}, null, 2));
          if (runtime.counts.high > 0 || runtime.counts.critical > 0) process.exit(1);
          if (runtime.exitCode !== 0 && runtime.counts.total === 0) process.exit(1);
          if (full.exitCode !== 0 && full.counts.total === 0) process.exit(1);
          NODE

      - name: Run retained engineering and security gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run test:wos00-baseline
          node scripts/scan-bootstrap.mjs --self-test
          npm run test:bootstrap-scan
          env NODE_ENV=test APP_MODE=test VITE_APP_MODE=test ALLOW_TEST_FALLBACK=true VITE_ALLOW_TEST_FALLBACK=true npm test
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M package-lock.json$' || true)"

      - name: Record exact generated evidence
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          lock_sha256="$(sha256sum package-lock.json | cut -d' ' -f1)"
          echo "lock_sha256=$lock_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "source_sha=$GITHUB_SHA"
            echo "lock_sha256=$lock_sha256"
            echo "react_router_dom=$(node -p \"require('./package-lock.json').packages['node_modules/react-router-dom'].version\")"
            echo "react_router=$(node -p \"require('./package-lock.json').packages['node_modules/react-router'].version\")"
          } > /tmp/lock-authority.txt

      - name: Upload verified lockfile and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: wos01a-lock-refresh-${{ github.sha }}
          path: |
            package-lock.json
            /tmp/lock-authority.txt
            /tmp/npm-audit-runtime.json
            /tmp/npm-audit-full.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified lockfile under exact-old-head lease
    needs: prepare
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified lockfile
        uses: actions/download-artifact@v4
        with:
          name: wos01a-lock-refresh-${{ github.sha }}
          path: /tmp/wos01a-lock-refresh

      - name: Verify artifact and construct exact publish commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp /tmp/wos01a-lock-refresh/package-lock.json package-lock.json
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "${{ needs.prepare.outputs.lock_sha256 }}"
          rm "$WORKFLOW_PATH"
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$WORKFLOW_PATH"
          test "${changed[1]}" = "package-lock.json"
          git diff --check

      - name: Commit and push exact generated result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_origin="https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$trusted_origin"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          git config --local core.hooksPath /dev/null
          git config user.name "WorkOS Implementation Controller"
          git config user.email "actions@users.noreply.github.com"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.https://github.com/.extraheader="$auth_header" ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git checkout -B "$TARGET_BRANCH" "$GITHUB_SHA"
          git add package-lock.json "$WORKFLOW_PATH"
          git diff --cached --check
          git commit --no-verify -m "fix: close WOS-01A runtime advisory and metadata gates"
          new_head="$(git rev-parse HEAD)"
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="$auth_header" push --no-verify \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$GITHUB_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Published exact closure head: $new_head"
