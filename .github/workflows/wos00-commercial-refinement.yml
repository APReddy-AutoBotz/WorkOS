name: WOS-00 Commercial Blueprint Refinement

on:
  push:
    branches:
      - controller/wos-00-blueprint
    paths:
      - scripts/materialize-wos00-commercial-refinement.py
      - .github/workflows/wos00-commercial-refinement.yml

permissions:
  contents: write

concurrency:
  group: wos00-commercial-refinement
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[skip wos00-refinement]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact WorkOS branch
        uses: actions/checkout@v4
        with:
          ref: controller/wos-00-blueprint
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize corrected blueprint
        run: python scripts/materialize-wos00-commercial-refinement.py

      - name: Documentation-safe validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          product = (root / 'docs/00-control/PRODUCT_REQUIREMENTS.md').read_text(encoding='utf-8')
          nfr = (root / 'docs/04-quality/NON_FUNCTIONAL_REQUIREMENTS.md').read_text(encoding='utf-8')
          product_ids = re.findall(r'^### (WOS-[A-Z]+-\d{3})\b', product, flags=re.M)
          nfr_ids = re.findall(r'^### (WOS-NFR-[A-Z]+-\d{3})\b', nfr, flags=re.M)
          assert len(product_ids) == len(set(product_ids)) == 126, (len(product_ids), len(set(product_ids)))
          assert len(nfr_ids) == len(set(nfr_ids)) == 81, (len(nfr_ids), len(set(nfr_ids)))

          required = {
              'T&M': ['PRODUCT_REQUIREMENTS.md', 'DOMAIN_MODEL.md', 'DATA_ARCHITECTURE.md', 'COMMERCIALS_REVENUE_MARGIN_SPEC.md', 'IMPLEMENTATION_BACKLOG.md', 'TEST_STRATEGY.md'],
              'fixed-fee': ['PRODUCT_REQUIREMENTS.md', 'DOMAIN_MODEL.md', 'DATA_ARCHITECTURE.md', 'COMMERCIALS_REVENUE_MARGIN_SPEC.md', 'IMPLEMENTATION_BACKLOG.md', 'TEST_STRATEGY.md'],
              'milestone': ['PRODUCT_REQUIREMENTS.md', 'DOMAIN_MODEL.md', 'DATA_ARCHITECTURE.md', 'COMMERCIALS_REVENUE_MARGIN_SPEC.md', 'IMPLEMENTATION_BACKLOG.md', 'TEST_STRATEGY.md'],
              'retainer': ['PRODUCT_REQUIREMENTS.md', 'DOMAIN_MODEL.md', 'DATA_ARCHITECTURE.md', 'COMMERCIALS_REVENUE_MARGIN_SPEC.md', 'IMPLEMENTATION_BACKLOG.md', 'TEST_STRATEGY.md'],
              'managed-service': ['PRODUCT_REQUIREMENTS.md', 'DOMAIN_MODEL.md', 'DATA_ARCHITECTURE.md', 'COMMERCIALS_REVENUE_MARGIN_SPEC.md', 'IMPLEMENTATION_BACKLOG.md', 'TEST_STRATEGY.md'],
              'adjustment': ['PRODUCT_REQUIREMENTS.md', 'DOMAIN_MODEL.md', 'DATA_ARCHITECTURE.md', 'COMMERCIALS_REVENUE_MARGIN_SPEC.md', 'IMPLEMENTATION_BACKLOG.md', 'TEST_STRATEGY.md'],
          }
          file_map = {
              'PRODUCT_REQUIREMENTS.md': root / 'docs/00-control/PRODUCT_REQUIREMENTS.md',
              'DOMAIN_MODEL.md': root / 'docs/02-architecture/DOMAIN_MODEL.md',
              'DATA_ARCHITECTURE.md': root / 'docs/02-architecture/DATA_ARCHITECTURE.md',
              'COMMERCIALS_REVENUE_MARGIN_SPEC.md': root / 'docs/03-specifications/COMMERCIALS_REVENUE_MARGIN_SPEC.md',
              'IMPLEMENTATION_BACKLOG.md': root / 'docs/05-delivery/IMPLEMENTATION_BACKLOG.md',
              'TEST_STRATEGY.md': root / 'docs/04-quality/TEST_STRATEGY.md',
          }
          for term, names in required.items():
              for name in names:
                  text = file_map[name].read_text(encoding='utf-8').lower()
                  assert term.lower() in text, (term, name)

          for path in [root / 'docs/02-architecture/DOMAIN_MODEL.md', root / 'docs/02-architecture/DATA_ARCHITECTURE.md', root / 'docs/02-architecture/API_ARCHITECTURE.md']:
              assert 'CommercialEligibilityEvent' in path.read_text(encoding='utf-8'), path

          assert not (root / 'scripts/materialize-wos00-review.mjs').exists()
          assert not (root / '.github/workflows/wos00-materialize.yml').exists()
          print('ID, source-family, aggregate and hygiene checks passed')
          PY

          ! rg -n -i 'recognized/earned|recognized revenue|recognised revenue' --glob '*.md' .
          ! rg -n -i 'price exclusivity|pricing floor|negotiation floor|retain reusable core|exclusive IP sale|perpetual non-exclusive' --glob '*.md' .
          ! rg -n --hidden -i '(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+%-]{12,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' --glob '!/.git/**' .

      - name: Commit refinement to PR branch
        env:
          BRANCH: controller/wos-00-blueprint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "workos-controller[bot]"
          git config user.email "workos-controller[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: refine WOS-00 commercial blueprint controls"
          git push origin "HEAD:${BRANCH}"
