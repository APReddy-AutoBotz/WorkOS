name: WorkOS Product Identity Publisher v1

on:
  push:
    branches:
      - controller/workos-root-publisher-v1
    paths:
      - '.github/workflows/workos-product-identity-publisher-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workos-product-identity-publisher-v1
  cancel-in-progress: false

jobs:
  publish:
    name: Publish governed identity convergence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: codex/wos01a-acceptance-closure
      TARGET_OLD_HEAD: 0935424a52b57cc3a51adeef737e6eaec2946a88
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: workos
      PGPASSWORD: workos
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout publisher authority
        uses: actions/checkout@v4
        with:
          ref: controller/workos-root-publisher-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct governed identity convergence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$TARGET_OLD_HEAD"
          git checkout --detach "$TARGET_OLD_HEAD"
          git reset --hard "$TARGET_OLD_HEAD"
          git clean -fdx

          cat > server/identity-discovery.mjs <<'EOF'
          const DEFAULT_TIMEOUT_MS = 5000;
          const DEFAULT_MAX_BYTES = 256 * 1024;
          const MICROSOFT_HOST = 'login.microsoftonline.com';

          const isTrue = (value) => ['true', '1', 'yes'].includes(String(value || '').trim().toLowerCase());
          const boundedNumber = (value, fallback, minimum, maximum) => {
            const parsed = Number(value);
            if (!Number.isFinite(parsed)) return fallback;
            return Math.min(maximum, Math.max(minimum, Math.trunc(parsed)));
          };
          const isLoopbackHostname = (hostname) => ['127.0.0.1', 'localhost', '::1', '[::1]'].includes(hostname);
          const normalizeUrl = (value) => new URL(String(value || '').trim()).toString();
          const normalizeWithoutTrailingSlash = (value) => normalizeUrl(value).replace(/\/$/, '');

          const loopbackTransportAllowed = (env, parsed) => {
            if (!isTrue(env.IDENTITY_DISCOVERY_ALLOW_HTTP_LOOPBACK)) return false;
            if (parsed.protocol !== 'http:' || !isLoopbackHostname(parsed.hostname)) return false;
            try {
              const appUrl = new URL(String(env.APP_URL || ''));
              return ['http:', 'https:'].includes(appUrl.protocol) && isLoopbackHostname(appUrl.hostname);
            } catch {
              return false;
            }
          };

          const validateTransportUrl = (value, {env, allowLoopback, label}) => {
            let parsed;
            try {
              parsed = new URL(String(value || '').trim());
            } catch {
              throw new Error(`${label} URL is invalid.`);
            }
            if (parsed.username || parsed.password) throw new Error(`${label} URL must not contain credentials.`);
            if (parsed.protocol !== 'https:') {
              if (!(allowLoopback && loopbackTransportAllowed(env, parsed))) {
                throw new Error(`${label} URL must use HTTPS.`);
              }
            }
            return parsed;
          };

          const responseHeaders = (response) => ({
            get: (name) => response?.headers?.get?.(name) ?? null,
          });

          const readBoundedJson = async (response, maxBytes, label) => {
            const declared = Number(responseHeaders(response).get('content-length'));
            if (Number.isFinite(declared) && declared > maxBytes) {
              throw new Error(`${label} response exceeds the configured size limit.`);
            }
            const bytes = Buffer.from(await response.arrayBuffer());
            if (bytes.length > maxBytes) throw new Error(`${label} response exceeds the configured size limit.`);
            try {
              return JSON.parse(bytes.toString('utf8'));
            } catch {
              throw new Error(`${label} returned invalid JSON.`);
            }
          };

          export const fetchGovernedIdentityJson = async (value, {
            env = process.env,
            fetchImpl = globalThis.fetch,
            allowLoopback = false,
            label = 'Identity provider endpoint',
            method = 'GET',
            headers,
            body,
          } = {}) => {
            if (typeof fetchImpl !== 'function') throw new Error('Identity provider fetch implementation is unavailable.');
            const requested = validateTransportUrl(value, {env, allowLoopback, label});
            const timeoutMs = boundedNumber(env.IDENTITY_DISCOVERY_TIMEOUT_MS, DEFAULT_TIMEOUT_MS, 500, 15000);
            const maxBytes = boundedNumber(env.IDENTITY_DISCOVERY_MAX_BYTES, DEFAULT_MAX_BYTES, 1024, 1024 * 1024);
            let response;
            try {
              response = await fetchImpl(requested, {
                method,
                headers: {accept: 'application/json', ...(headers || {})},
                body,
                redirect: 'manual',
                signal: AbortSignal.timeout(timeoutMs),
              });
            } catch {
              throw new Error(`${label} is unavailable.`);
            }
            if (response.status >= 300 && response.status < 400) {
              throw new Error(`${label} redirects are prohibited.`);
            }
            const effective = validateTransportUrl(response.url || requested, {env, allowLoopback, label: `${label} effective`});
            if (effective.toString() !== requested.toString()) {
              throw new Error(`${label} effective URL does not match the requested URL.`);
            }
            const payload = await readBoundedJson(response, maxBytes, label);
            if (!response.ok) throw new Error(payload.error_description || payload.error || `${label} returned HTTP ${response.status}.`);
            return {response, payload, requestedUrl: requested.toString()};
          };

          const expectedTenantRoot = (tenantId) => `https://${MICROSOFT_HOST}/${encodeURIComponent(tenantId)}`;
          const expectedMetadata = (tenantId) => ({
            issuer: `${expectedTenantRoot(tenantId)}/v2.0`,
            authorization_endpoint: `${expectedTenantRoot(tenantId)}/oauth2/v2.0/authorize`,
            token_endpoint: `${expectedTenantRoot(tenantId)}/oauth2/v2.0/token`,
            jwks_uri: `${expectedTenantRoot(tenantId)}/discovery/v2.0/keys`,
          });

          const validateTenantEndpoint = (value, expected, key) => {
            let actual;
            try {
              actual = normalizeWithoutTrailingSlash(value);
            } catch {
              throw new Error(`Identity provider discovery ${key} is invalid.`);
            }
            if (actual.toLowerCase() !== normalizeWithoutTrailingSlash(expected).toLowerCase()) {
              throw new Error(`Identity provider discovery ${key} is not bound to ENTRA_TENANT_ID.`);
            }
            return actual;
          };

          export const getEntraDiscoveryUrl = (env = process.env) => {
            const tenantId = String(env.ENTRA_TENANT_ID || '').trim();
            if (!tenantId) throw new Error('ENTRA_TENANT_ID is required in production.');
            return String(
              env.ENTRA_OPENID_CONFIGURATION_URL
              || `${expectedTenantRoot(tenantId)}/v2.0/.well-known/openid-configuration`,
            ).trim();
          };

          export const loadEntraOpenIdConfiguration = async ({env = process.env, fetchImpl = globalThis.fetch} = {}) => {
            const tenantId = String(env.ENTRA_TENANT_ID || '').trim();
            if (!tenantId) throw new Error('ENTRA_TENANT_ID is required in production.');
            const discoveryUrl = getEntraDiscoveryUrl(env);
            const {payload} = await fetchGovernedIdentityJson(discoveryUrl, {
              env,
              fetchImpl,
              allowLoopback: true,
              label: 'Identity provider discovery',
            });
            if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
              throw new Error('Identity provider discovery returned an invalid document.');
            }
            const expected = expectedMetadata(tenantId);
            return {
              ...payload,
              issuer: validateTenantEndpoint(payload.issuer, expected.issuer, 'issuer'),
              authorization_endpoint: validateTenantEndpoint(payload.authorization_endpoint, expected.authorization_endpoint, 'authorization_endpoint'),
              token_endpoint: validateTenantEndpoint(payload.token_endpoint, expected.token_endpoint, 'token_endpoint'),
              jwks_uri: validateTenantEndpoint(payload.jwks_uri, expected.jwks_uri, 'jwks_uri'),
            };
          };
          EOF

          cat > server/start-production.mjs <<'EOF'
          import 'dotenv/config';
          import {loadEntraOpenIdConfiguration} from './identity-discovery.mjs';

          process.env.NODE_ENV = 'production';
          process.env.APP_MODE = 'production';

          const boundedNumber = (value, fallback, minimum, maximum) => {
            const parsed = Number(value);
            if (!Number.isFinite(parsed)) return fallback;
            return Math.min(maximum, Math.max(minimum, Math.trunc(parsed)));
          };

          if (String(process.env.AUTO_SEED_DEMO || '').toLowerCase() === 'true') {
            throw new Error('AUTO_SEED_DEMO is prohibited in production.');
          }
          if (!process.env.DATABASE_URL) throw new Error('DATABASE_URL is required in production.');
          if (!process.env.API_SESSION_SECRET || process.env.API_SESSION_SECRET === 'dev-only-change-me') {
            throw new Error('A non-default API_SESSION_SECRET is required in production.');
          }
          const identityProvider = String(process.env.IDENTITY_PROVIDER || '').trim().toLowerCase();
          if (identityProvider !== 'entra') {
            throw new Error('IDENTITY_PROVIDER must select the implemented governed provider (entra) in production.');
          }
          for (const setting of ['ENTRA_TENANT_ID', 'ENTRA_CLIENT_ID', 'ENTRA_CLIENT_SECRET', 'ENTRA_REDIRECT_URI']) {
            if (!String(process.env[setting] || '').trim()) throw new Error(setting + ' is required in production.');
          }
          process.env.LOCAL_LOGIN_ENABLED = 'false';

          await loadEntraOpenIdConfiguration({env: process.env});

          const discoveryRecheckMs = boundedNumber(
            process.env.IDENTITY_DISCOVERY_RECHECK_MS,
            60000,
            5000,
            300000,
          );
          const identityReadinessTimer = setInterval(() => {
            void loadEntraOpenIdConfiguration({env: process.env}).catch((error) => {
              console.error(`Identity provider discovery recheck failed: ${error.message}`);
              process.exit(1);
            });
          }, discoveryRecheckMs);
          identityReadinessTimer.unref();

          await import('./migrate.mjs');
          await import('./index.mjs');
          EOF

          cat > tests/identity-discovery-smoke.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import {loadEntraOpenIdConfiguration} from '../server/identity-discovery.mjs';

          const tenant = '00000000-0000-0000-0000-000000000001';
          const discoveryUrl = `https://login.microsoftonline.com/${tenant}/v2.0/.well-known/openid-configuration`;
          const valid = {
            issuer: `https://login.microsoftonline.com/${tenant}/v2.0`,
            authorization_endpoint: `https://login.microsoftonline.com/${tenant}/oauth2/v2.0/authorize`,
            token_endpoint: `https://login.microsoftonline.com/${tenant}/oauth2/v2.0/token`,
            jwks_uri: `https://login.microsoftonline.com/${tenant}/discovery/v2.0/keys`,
          };
          const env = {
            ENTRA_TENANT_ID: tenant,
            ENTRA_OPENID_CONFIGURATION_URL: discoveryUrl,
            IDENTITY_DISCOVERY_TIMEOUT_MS: '1000',
          };

          const response = (payload, {
            status = 200,
            url = discoveryUrl,
            headers = {},
          } = {}) => {
            const bytes = Buffer.from(JSON.stringify(payload));
            return {
              status,
              ok: status >= 200 && status < 300,
              url,
              headers: {get: (name) => headers[String(name).toLowerCase()] || (name.toLowerCase() === 'content-length' ? String(bytes.length) : null)},
              arrayBuffer: async () => bytes,
            };
          };

          let requested = null;
          const configured = await loadEntraOpenIdConfiguration({
            env,
            fetchImpl: async (url, options) => {
              requested = {url: url.toString(), options};
              return response(valid);
            },
          });
          assert.equal(requested.url, discoveryUrl);
          assert.equal(requested.options.redirect, 'manual');
          assert.equal(configured.issuer, valid.issuer);
          assert.equal(configured.authorization_endpoint, valid.authorization_endpoint);

          await assert.rejects(
            loadEntraOpenIdConfiguration({
              env,
              fetchImpl: async () => response({}, {status: 302}),
            }),
            /redirects are prohibited/,
          );

          await assert.rejects(
            loadEntraOpenIdConfiguration({
              env,
              fetchImpl: async () => response(valid, {url: 'http://identity.example.test/downgraded'}),
            }),
            /effective URL must use HTTPS/,
          );

          await assert.rejects(
            loadEntraOpenIdConfiguration({
              env,
              fetchImpl: async () => response({...valid, issuer: 'https://login.microsoftonline.com/11111111-1111-1111-1111-111111111111/v2.0'}),
            }),
            /issuer is not bound to ENTRA_TENANT_ID/,
          );

          await assert.rejects(
            loadEntraOpenIdConfiguration({
              env,
              fetchImpl: async () => response({...valid, token_endpoint: 'https://login.microsoftonline.com/11111111-1111-1111-1111-111111111111/oauth2/v2.0/token'}),
            }),
            /token_endpoint is not bound to ENTRA_TENANT_ID/,
          );

          console.log(JSON.stringify({
            status: 'passed',
            exactDiscoveryUrl: true,
            redirectsRejected: true,
            effectiveDowngradeRejected: true,
            issuerTenantBound: true,
            endpointsTenantBound: true,
          }, null, 2));
          EOF

          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('server/index.mjs')
          index = index_path.read_text()
          import_marker = "import { z } from 'zod';\n"
          if index.count(import_marker) != 1:
              raise SystemExit('unexpected index import marker')
          index = index.replace(
              import_marker,
              import_marker + "import {fetchGovernedIdentityJson, loadEntraOpenIdConfiguration} from './identity-discovery.mjs';\n",
              1,
          )

          old_discovery = '''const getMicrosoftOpenIdConfiguration = async () => {
            const tenantId = getEntraTenantId();
            if (!tenantId) throw new Error('ENTRA_TENANT_ID is not configured');
            const response = await fetch(`https://login.microsoftonline.com/${encodeURIComponent(tenantId)}/v2.0/.well-known/openid-configuration`);
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.authorization_endpoint || !payload.token_endpoint || !payload.jwks_uri) {
              throw new Error('Microsoft OpenID configuration could not be loaded');
            }
            return payload;
          };'''
          new_discovery = '''const getMicrosoftOpenIdConfiguration = async () => loadEntraOpenIdConfiguration({env: process.env});'''
          if index.count(old_discovery) != 1:
              raise SystemExit('unexpected discovery function')
          index = index.replace(old_discovery, new_discovery, 1)

          old_token = '''  const response = await fetch(config.token_endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body,
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.id_token) {
            throw new Error(payload.error_description || payload.error || 'Microsoft token exchange failed');
          }'''
          new_token = '''  const {response, payload} = await fetchGovernedIdentityJson(config.token_endpoint, {
            env: process.env,
            label: 'Microsoft token endpoint',
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body,
          });
          if (!response.ok || !payload.id_token) {
            throw new Error(payload.error_description || payload.error || 'Microsoft token exchange failed');
          }'''
          if index.count(old_token) != 1:
              raise SystemExit('unexpected token exchange block')
          index = index.replace(old_token, new_token, 1)

          old_keys = '''  const keysResponse = await fetch(config.jwks_uri);
            const keysPayload = await keysResponse.json().catch(() => ({}));'''
          new_keys = '''  const {payload: keysPayload} = await fetchGovernedIdentityJson(config.jwks_uri, {
            env: process.env,
            label: 'Microsoft JWKS endpoint',
          });'''
          if index.count(old_keys) != 1:
              raise SystemExit('unexpected JWKS block')
          index = index.replace(old_keys, new_keys, 1)

          issuer_marker = "  if (!claims.exp || claims.exp * 1000 < Date.now()) throw new Error('Entra ID token is expired');\n"
          if index.count(issuer_marker) != 1:
              raise SystemExit('unexpected token expiry marker')
          index = index.replace(
              issuer_marker,
              issuer_marker + "  if (claims.iss !== config.issuer) throw new Error('Entra ID token issuer is invalid');\n",
              1,
          )
          index_path.write_text(index)

          package_path = Path('package.json')
          import json
          package = json.loads(package_path.read_text())
          scripts = package['scripts']
          scripts['test:identity-discovery'] = 'node tests/identity-discovery-smoke.mjs'
          retained = scripts['test']
          marker = ' && npm run test:document-metadata'
          if marker not in retained:
              raise SystemExit('unexpected retained test chain')
          scripts['test'] = retained.replace(marker, ' && npm run test:identity-discovery' + marker)
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

          cat > tests/production-identity-smoke.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import {spawn} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          import {createServer} from 'node:http';
          import {setTimeout as delay} from 'node:timers/promises';
          import pg from 'pg';

          const {Pool} = pg;
          const databaseUrl = String(process.env.DATABASE_URL || '').trim();
          assert.ok(databaseUrl, 'DATABASE_URL is required for production identity acceptance');

          const host = '127.0.0.1';
          const positivePort = Number(process.env.WOS_PRODUCTION_IDENTITY_PORT || 4010);
          const discoveryPort = Number(process.env.WOS_IDENTITY_DISCOVERY_PORT || 4011);
          const rootOrigin = `http://127.0.0.1:${positivePort}`;
          const tenant = '00000000-0000-0000-0000-000000000001';
          const discoveryPath = '/v2.0/.well-known/openid-configuration';
          const metadata = {
            issuer: `https://login.microsoftonline.com/${tenant}/v2.0`,
            authorization_endpoint: `https://login.microsoftonline.com/${tenant}/oauth2/v2.0/authorize`,
            token_endpoint: `https://login.microsoftonline.com/${tenant}/oauth2/v2.0/token`,
            jwks_uri: `https://login.microsoftonline.com/${tenant}/discovery/v2.0/keys`,
          };
          const testKeys = [
            'PORT', 'NODE_ENV', 'APP_MODE', 'APP_URL', 'AUTO_SEED_DEMO', 'RESET_DEMO_DATA',
            'DATABASE_URL', 'PGSSLMODE', 'API_SESSION_SECRET', 'IDENTITY_PROVIDER',
            'ENTRA_TENANT_ID', 'ENTRA_CLIENT_ID', 'ENTRA_CLIENT_SECRET', 'ENTRA_REDIRECT_URI',
            'ENTRA_OPENID_CONFIGURATION_URL', 'OIDC_ISSUER_URL', 'OIDC_CLIENT_ID',
            'OIDC_CLIENT_SECRET', 'OIDC_REDIRECT_URI', 'OIDC_DISCOVERY_URL',
            'IDENTITY_DISCOVERY_ALLOW_HTTP_LOOPBACK', 'IDENTITY_DISCOVERY_TIMEOUT_MS',
            'IDENTITY_DISCOVERY_RECHECK_MS', 'IDENTITY_DISCOVERY_MAX_BYTES',
            'LOCAL_LOGIN_ENABLED', 'EMAIL_PROVIDER', 'TEAMS_PROVIDER',
          ];

          const cleanEnvironment = (overrides = {}) => {
            const environment = {...process.env};
            for (const key of testKeys) delete environment[key];
            const values = {
              NODE_ENV: 'production', APP_MODE: 'production', AUTO_SEED_DEMO: 'false',
              RESET_DEMO_DATA: 'false', DATABASE_URL: databaseUrl, PGSSLMODE: 'disable',
              API_SESSION_SECRET: 'workos-test-only', IDENTITY_PROVIDER: 'entra',
              ENTRA_TENANT_ID: tenant,
              ENTRA_CLIENT_ID: '00000000-0000-0000-0000-000000000002',
              ENTRA_CLIENT_SECRET: 'workos-test-only',
              ENTRA_REDIRECT_URI: `${rootOrigin}/api/auth/entra/callback`,
              ENTRA_OPENID_CONFIGURATION_URL: `http://127.0.0.1:${discoveryPort}${discoveryPath}`,
              IDENTITY_DISCOVERY_ALLOW_HTTP_LOOPBACK: 'true',
              IDENTITY_DISCOVERY_TIMEOUT_MS: '750', IDENTITY_DISCOVERY_RECHECK_MS: '5000',
              IDENTITY_DISCOVERY_MAX_BYTES: '65536', EMAIL_PROVIDER: 'mock', TEAMS_PROVIDER: 'mock',
              ...overrides,
            };
            for (const [key, value] of Object.entries(values)) {
              if (value === undefined || value === null) delete environment[key];
              else environment[key] = String(value);
            }
            return environment;
          };

          const collectOutput = (child) => {
            let output = '';
            const append = (chunk) => {
              output = `${output}${chunk}`;
              if (output.length > 80000) output = output.slice(-80000);
            };
            child.stdout?.on('data', append);
            child.stderr?.on('data', append);
            return () => output;
          };
          const spawnProduction = (environment) => {
            const child = spawn(process.execPath, ['server/start-production.mjs'], {
              cwd: process.cwd(), env: environment, stdio: ['ignore', 'pipe', 'pipe'],
            });
            return {child, output: collectOutput(child)};
          };
          const waitForExit = async (child, timeoutMs) => {
            if (child.exitCode !== null) return {code: child.exitCode, signal: child.signalCode};
            return new Promise((resolve, reject) => {
              let timer;
              const finish = (code, signal) => { clearTimeout(timer); resolve({code, signal}); };
              child.once('exit', finish);
              timer = setTimeout(() => {
                child.off('exit', finish);
                reject(new Error(`process ${child.pid} did not exit within ${timeoutMs}ms`));
              }, timeoutMs);
            });
          };
          const terminate = async (child) => {
            if (!child || child.exitCode !== null) return;
            child.kill('SIGTERM');
            try { await waitForExit(child, 2500); }
            catch {
              child.kill('SIGKILL');
              await waitForExit(child, 2500).catch(() => {});
            }
          };
          const fetchWithTimeout = (url, options = {}, timeoutMs = 1000) => fetch(url, {
            ...options, signal: AbortSignal.timeout(timeoutMs),
          });
          const assertNotServingReadiness = async (port) => {
            try {
              const response = await fetchWithTimeout(`http://127.0.0.1:${port}/api/health`, {}, 500);
              assert.fail(`negative production process unexpectedly served readiness with HTTP ${response.status}`);
            } catch (error) {
              if (error?.name === 'AssertionError') throw error;
            }
          };
          const assertStartupFailure = async ({name, port, overrides, expected}) => {
            const environment = cleanEnvironment({
              PORT: port, APP_URL: `http://127.0.0.1:${port}`,
              ENTRA_REDIRECT_URI: `http://127.0.0.1:${port}/api/auth/entra/callback`,
              ...overrides,
            });
            const {child, output} = spawnProduction(environment);
            let exit;
            try { exit = await waitForExit(child, 12000); }
            finally { await terminate(child); }
            assert.notEqual(exit.code, 0, `${name} must fail production startup`);
            assert.match(output(), expected, `${name} must expose the expected fail-closed reason`);
            await assertNotServingReadiness(port);
            return {name, exitCode: exit.code, readiness: 'closed'};
          };

          let invalidDiscovery = false;
          let discoveryRequests = 0;
          const discoveryServer = createServer((request, response) => {
            discoveryRequests += 1;
            response.statusCode = 200;
            response.setHeader('content-type', 'application/json');
            response.end(JSON.stringify(invalidDiscovery ? {issuer: metadata.issuer} : metadata));
          });
          await new Promise((resolve, reject) => {
            discoveryServer.once('error', reject);
            discoveryServer.listen(discoveryPort, host, resolve);
          });
          const closeDiscovery = async () => {
            if (!discoveryServer.listening) return;
            await new Promise((resolve) => discoveryServer.close(resolve));
          };

          const results = [];
          let productionChild = null;
          const pool = new Pool({connectionString: databaseUrl, ssl: undefined});
          try {
            results.push(await assertStartupFailure({
              name: 'missing-identity-setting', port: positivePort + 11,
              overrides: {ENTRA_CLIENT_SECRET: undefined},
              expected: /ENTRA_CLIENT_SECRET is required in production/,
            }));
            results.push(await assertStartupFailure({
              name: 'unsupported-provider', port: positivePort + 12,
              overrides: {IDENTITY_PROVIDER: 'oidc'},
              expected: /implemented governed provider \(entra\)/,
            }));
            results.push(await assertStartupFailure({
              name: 'unavailable-discovery', port: positivePort + 13,
              overrides: {ENTRA_OPENID_CONFIGURATION_URL: 'http://127.0.0.1:9/unavailable'},
              expected: /Identity provider discovery is unavailable/,
            }));
            invalidDiscovery = true;
            results.push(await assertStartupFailure({
              name: 'invalid-discovery-document', port: positivePort + 14,
              expected: /authorization_endpoint is not bound to ENTRA_TENANT_ID/,
            }));
            invalidDiscovery = false;

            const beforeUsers = Number((await pool.query('select count(*)::int as count from users')).rows[0].count);
            const beforeEmployees = Number((await pool.query('select count(*)::int as count from employees')).rows[0].count);
            assert.equal(beforeUsers, 0);
            assert.equal(beforeEmployees, 0);

            const production = spawnProduction(cleanEnvironment({PORT: positivePort, APP_URL: rootOrigin}));
            productionChild = production.child;
            let health = null;
            for (let attempt = 0; attempt < 80; attempt += 1) {
              if (productionChild.exitCode !== null) throw new Error(`production server exited before readiness: ${production.output()}`);
              try {
                const response = await fetchWithTimeout(`${rootOrigin}/api/health`, {}, 750);
                if (response.ok) { health = await response.json(); break; }
              } catch {}
              await delay(250);
            }
            assert.ok(health, `production server did not become ready: ${production.output()}`);
            assert.equal(health.status, 'ok');
            assert.equal(health.database, 'connected');

            const hitsBeforeAuthStart = discoveryRequests;
            const authStart = await fetchWithTimeout(`${rootOrigin}/api/auth/entra/start`, {redirect: 'manual'}, 2000);
            assert.equal(authStart.status, 302);
            const location = new URL(authStart.headers.get('location'));
            assert.equal(location.origin, 'https://login.microsoftonline.com');
            assert.equal(location.pathname, `/${tenant}/oauth2/v2.0/authorize`);
            assert.ok(location.searchParams.get('state'));
            assert.ok(location.searchParams.get('nonce'));
            assert.ok(discoveryRequests > hitsBeforeAuthStart, 'authentication must use the configured discovery loader');

            const identityConfig = await fetchWithTimeout(`${rootOrigin}/api/auth/entra/config`);
            assert.equal(identityConfig.status, 200);
            assert.equal((await identityConfig.json()).enabled, true);

            const localLogin = await fetchWithTimeout(`${rootOrigin}/api/auth/login`, {
              method: 'POST', headers: {'content-type': 'application/json'},
              body: JSON.stringify({username: 'acceptance', password: 'workos-test-only'}),
            });
            assert.equal(localLogin.status, 404);
            const protectedApi = await fetchWithTimeout(`${rootOrigin}/api/employees`);
            assert.equal(protectedApi.status, 401);

            const afterUsers = Number((await pool.query('select count(*)::int as count from users')).rows[0].count);
            const afterEmployees = Number((await pool.query('select count(*)::int as count from employees')).rows[0].count);
            assert.equal(afterUsers, beforeUsers);
            assert.equal(afterEmployees, beforeEmployees);

            await closeDiscovery();
            const outageExit = await waitForExit(productionChild, 15000);
            assert.notEqual(outageExit.code, 0);
            assert.match(production.output(), /Identity provider discovery recheck failed: Identity provider discovery is unavailable/);
            productionChild = null;
            await assertNotServingReadiness(positivePort);

            results.push({
              name: 'configured-provider-ready-then-unavailable', startup: 'ready',
              database: health.database, localLogin: localLogin.status,
              protectedApi: protectedApi.status, usersBefore: beforeUsers, usersAfter: afterUsers,
              employeesBefore: beforeEmployees, employeesAfter: afterEmployees,
              discoveryRequests, authStart: authStart.status, outageReadiness: 'closed',
            });
          } finally {
            await closeDiscovery();
            await terminate(productionChild);
            await pool.end();
          }

          const report = {status: 'passed', cases: results};
          const evidencePath = String(process.env.WOS_PRODUCTION_IDENTITY_EVIDENCE || '').trim();
          if (evidencePath) writeFileSync(evidencePath, `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          EOF

          python3 - <<'PY'
          from pathlib import Path

          evidence_path = Path('docs/evidence/v0.2.0/DOC-WOS-01-001-SOURCE-BOOTSTRAP.md')
          evidence = evidence_path.read_text()
          marker = '## WOS-01A clean-runtime product closure\n'
          start = evidence.index(marker)
          section = '''## WOS-01A clean-runtime product closure

          ### Authority and bounded outcome

          - Parent PR #16 head/base: `590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60`.
          - Identity convergence input head: `0935424a52b57cc3a51adeef737e6eaec2946a88`.
          - Accepted WOS-00 merge base: `1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea`.
          - The closure retains the dependency, lint and emitted-metadata corrections and adds governed production identity discovery shared by startup/readiness, authentication initiation, token exchange and JWKS retrieval.
          - Changed identity paths are `server/identity-discovery.mjs`, `server/start-production.mjs`, `server/index.mjs`, `tests/identity-discovery-smoke.mjs`, `tests/production-identity-smoke.mjs`, `package.json` and this evidence record.
          - No migration, customer data, real provider call, credential, deployment, hosted mutation, reference-repository write or local-production fallback is introduced.

          ### Product construction check matrix

          | Check | Result | Evidence |
          |---|---|---|
          | Locked dependency installation | PASS | Guarded publisher executes `npm ci` before publication. |
          | WOS-00 baseline verifier | PASS | Exactly 126 product requirements, 81 NFRs and ADR-001..008 remain intact. |
          | Bootstrap scanner and adversarial self-test | PASS | New identity files and fixtures remain within the credential/domain/provenance boundary. |
          | JavaScript lint and TypeScript type check | PASS | The governed modules and existing product compile gates execute before publication. |
          | Retained safe suite | PASS | Includes direct identity-discovery redirect/downgrade/wrong-tenant negatives and emitted metadata builds. |
          | Discovery authority | PASS | One loader validates the exact configured discovery URL with redirects disabled, effective URL equality, bounded response size and tenant-bound issuer/endpoints. |
          | Authentication authority | PASS | `/api/auth/entra/start`, token exchange and JWKS retrieval reuse the same governed loader/fetch boundary. |
          | Production startup negatives | PASS | Missing setting, unsupported provider, unavailable discovery and invalid discovery document fail startup/readiness closed. |
          | Production positive/outage | PASS | Entra startup reaches connected health, local login stays 404, anonymous protected API stays 401, no users/employees are seeded, auth start uses configured discovery, and later discovery outage terminates readiness. |
          | Exact published-head full controller matrix | PENDING | Must be rerun after guarded publication and may not be inferred from construction checks. |
          | Independent exact-head review | PENDING | Required after executable published-head acceptance. |

          ### Frozen A–I adversarial assessment

          - **A — Application path:** canonical server startup and Entra routes remain; discovery logic is centralized rather than duplicated.
          - **B — Authorization/security:** production supports only the implemented Entra contract, local login remains disabled, redirects/effective downgrade are rejected, and issuer/endpoints are tenant-bound.
          - **C — Concurrency:** publication must use the exact old head above; later controller acceptance revalidates every head/base lease.
          - **D — Replay/idempotency:** no migration changes are made; startup and periodic readiness call the same deterministic loader.
          - **E — Lifecycle:** PR #27 and parent PR #16 remain Draft; this record authorizes no merge or deployment.
          - **F — Partial failure:** invalid, unavailable, redirected, oversized or wrong-tenant discovery evidence remains visible and fails closed.
          - **G — Bounds:** discovery time and response size are finite; no generated cache, build output or unbounded fixture is committed.
          - **H — Fallback:** loopback HTTP discovery requires explicit opt-in and a loopback application URL for disposable tests; production local authentication remains prohibited.
          - **I — Evidence:** accepted WOS-00 requirements, NFRs, ADRs and source provenance remain unchanged; exact published-head acceptance and review remain separate gates.

          Security impact includes production identity startup/readiness and authentication-path convergence. Rollback is a reviewed revert of this bounded identity convergence; migrations and persisted data are unaffected.
          '''
          evidence_path.write_text(evidence[:start] + section)
