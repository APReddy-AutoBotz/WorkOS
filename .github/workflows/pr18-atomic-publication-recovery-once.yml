name: PR18 Exact-Head Acceptance Verify Once

on:
  push:
    branches:
      - controller/retire-pr18-recovery-runner
    paths:
      - '.github/workflows/pr18-atomic-publication-recovery-once.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr18-exact-head-acceptance-verify-once
  cancel-in-progress: false

env:
  PUBLISHER_PR: '18'
  PUBLISHER_HEAD: 613aec9c70d806d8f45b87d6757b321ef282cf1d
  PUBLISHER_TREE: 3c6c52dc2ed77f185de0760fac07a2efb108c266
  TARGET_PR: '16'
  TARGET_HEAD: 7e4b5fad6e0d0d95ddd6c58015a787fb201d8661
  TARGET_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  REFERENCE_REPOSITORY: APReddy-AutoBotz/Boundaryless-WorkOS
  REFERENCE_COMMIT: f2de1d85126f5d64f0e2e21b085b0303ca1d8417
  REFERENCE_TREE: fdaa5d92854d378dae1c6146a8f09c7f34f8c273

jobs:
  verify:
    name: Verify exact PR18 publisher head without publication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify exact live PR gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PUBLISHER_PR) });
            const { data: target } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR) });
            const failures = [];
            if (publisher.state !== 'open') failures.push(`PR18 state=${publisher.state}`);
            if (!publisher.draft) failures.push('PR18 not Draft');
            if (publisher.head.ref !== 'controller/wos01a-actions-publisher') failures.push(`PR18 head.ref=${publisher.head.ref}`);
            if (publisher.head.sha !== process.env.PUBLISHER_HEAD) failures.push(`PR18 head.sha=${publisher.head.sha}`);
            if (target.state !== 'open') failures.push(`PR16 state=${target.state}`);
            if (!target.draft) failures.push('PR16 not Draft');
            if (target.head.ref !== 'codex/wos-01-authorized-source-bootstrap-v2') failures.push(`PR16 head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`PR16 head.sha=${target.head.sha}`);
            if (target.base.ref !== 'main') failures.push(`PR16 base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.TARGET_BASE) failures.push(`PR16 base.sha=${target.base.sha}`);
            if (failures.length) core.setFailed(`Exact-head verifier start gate failed: ${failures.join(', ')}`);

      - name: Checkout exact publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISHER_HEAD }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact target head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: workos
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned authorized reference read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REFERENCE_REPOSITORY }}
          ref: ${{ env.REFERENCE_COMMIT }}
          path: reference
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reference/package-lock.json

      - name: Verify immutable inputs and credential isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "$PUBLISHER_HEAD"
          test "$(git -C controller rev-parse HEAD^{tree})" = "$PUBLISHER_TREE"
          test "$(git -C workos rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git -C reference rev-parse HEAD)" = "$REFERENCE_COMMIT"
          test "$(git -C reference rev-parse HEAD^{tree})" = "$REFERENCE_TREE"
          test -z "$(git -C reference status --porcelain)"
          test -z "$(git -C controller config --local --get-regexp 'http\..*\.extraheader|credential\..*|credential.helper' || true)"
          test -z "$(git -C workos config --local --get-regexp 'http\..*\.extraheader|credential\..*|credential.helper' || true)"
          test -z "$(git -C reference config --local --get-regexp 'http\..*\.extraheader|credential\..*|credential.helper' || true)"

      - name: Syntax and workflow checks
        shell: bash
        run: |
          set -euo pipefail
          node --check controller/.github/scripts/wos01a-source-bootstrap.mjs
          node --check controller/.github/scripts/wos01a/apply-final-neutralization.mjs
          node --check controller/.github/scripts/wos01a/scan-bootstrap.mjs
          node --check controller/.github/scripts/wos01a/verify-baseline.mjs
          ruby -e "require 'yaml'; YAML.parse_file('controller/.github/workflows/wos01a-source-bootstrap-publisher.yml')"
          git -C controller diff --check
          node controller/.github/scripts/wos01a/scan-bootstrap.mjs --self-test

      - name: Apply bounded final neutralization in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          node controller/.github/scripts/wos01a/apply-final-neutralization.mjs controller/.github/scripts/wos01a-source-bootstrap.mjs

      - name: Materialize and run mandatory WOS-01A checks
        shell: bash
        run: |
          set -euo pipefail
          node controller/.github/scripts/wos01a-source-bootstrap.mjs reference workos controller | tee /tmp/wos01a-result.json

      - name: Verify exact materialized result evidence
        shell: bash
        run: |
          set -euo pipefail
          node controller/.github/scripts/wos01a-source-bootstrap.mjs --verify-result-digest workos
          git -C workos add -A
          git -C workos diff --cached --check
          changed_count="$(git -C workos diff --cached --name-only | wc -l | tr -d ' ')"
          test "$changed_count" -gt 100
          echo "MATERIALIZED_CHANGED_PATHS=$changed_count"
          echo "MATERIALIZED_TREE=$(git -C workos write-tree)"
          test "$(git -C workos rev-parse HEAD)" = "$TARGET_HEAD"

      - name: Re-verify no GitHub branch moved
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PUBLISHER_PR) });
            const { data: target } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR) });
            const failures = [];
            if (publisher.state !== 'open') failures.push(`PR18 state=${publisher.state}`);
            if (!publisher.draft) failures.push('PR18 not Draft');
            if (publisher.head.ref !== 'controller/wos01a-actions-publisher') failures.push(`PR18 head.ref=${publisher.head.ref}`);
            if (publisher.head.sha !== process.env.PUBLISHER_HEAD) failures.push(`PR18 head.sha=${publisher.head.sha}`);
            if (target.state !== 'open') failures.push(`PR16 state=${target.state}`);
            if (!target.draft) failures.push('PR16 not Draft');
            if (target.head.ref !== 'codex/wos-01-authorized-source-bootstrap-v2') failures.push(`PR16 head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`PR16 head.sha=${target.head.sha}`);
            if (target.base.ref !== 'main') failures.push(`PR16 base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.TARGET_BASE) failures.push(`PR16 base.sha=${target.base.sha}`);
            if (failures.length) core.setFailed(`Exact-head verifier final gate failed: ${failures.join(', ')}`);
