name: PR18 Atomic Publication Recovery Once

on:
  push:
    branches:
      - controller/retire-pr18-recovery-runner
    paths:
      - '.github/workflows/pr18-atomic-publication-recovery-once.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr18-atomic-publication-recovery-once
  cancel-in-progress: false

env:
  PUBLISHER_PR: '18'
  PUBLISHER_BRANCH: controller/wos01a-actions-publisher
  PUBLISHER_OLD_HEAD: 01eb16a22f9ef4b203e879a1568f7ee0ff34572d
  PUBLISHER_TARGET_TREE: 42b1c19dd3a88b753c81ad8948b89b998884b01a
  TARGET_PR: '16'
  TARGET_HEAD: 7e4b5fad6e0d0d95ddd6c58015a787fb201d8661
  TARGET_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  PATCH_RAW_SHA256: 36854dbc759e075495b19828d50f59012166b3cdc340f9e76bb3eafdb70b3d4f
  PATCH_XZ_SHA256: 5528d2b4745f60e630535c55fe1d573e695f46a331eca376c63fcf135f1444c9

jobs:
  publish:
    name: Atomically publish approved PR18 correction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact live PR gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PUBLISHER_PR),
            });
            const { data: target } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR),
            });
            const failures = [];
            if (publisher.state !== 'open') failures.push(`PR18 state=${publisher.state}`);
            if (!publisher.draft) failures.push('PR18 not Draft');
            if (publisher.head.ref !== process.env.PUBLISHER_BRANCH) failures.push(`PR18 head.ref=${publisher.head.ref}`);
            if (publisher.head.sha !== process.env.PUBLISHER_OLD_HEAD) failures.push(`PR18 head.sha=${publisher.head.sha}`);
            if (target.state !== 'open') failures.push(`PR16 state=${target.state}`);
            if (!target.draft) failures.push('PR16 not Draft');
            if (target.head.ref !== 'codex/wos-01-authorized-source-bootstrap-v2') failures.push(`PR16 head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`PR16 head.sha=${target.head.sha}`);
            if (target.base.ref !== 'main') failures.push(`PR16 base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.TARGET_BASE) failures.push(`PR16 base.sha=${target.base.sha}`);
            if (failures.length) core.setFailed(`Publication start gate failed: ${failures.join(', ')}`);

      - name: Checkout exact publisher head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISHER_OLD_HEAD }}
          fetch-depth: 0
          persist-credentials: false
          path: publisher

      - name: Reconstruct and verify approved correction
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr18.patch.xz.b64 <<'PATCH_EOF'
          
          PATCH_EOF
          tr -d '[:space:]' < /tmp/pr18.patch.xz.b64 | base64 -d > /tmp/pr18.patch.xz
          test "$(sha256sum /tmp/pr18.patch.xz | awk '{print $1}')" = "$PATCH_XZ_SHA256"
          xz -dc /tmp/pr18.patch.xz > /tmp/pr18.patch
          test "$(sha256sum /tmp/pr18.patch | awk '{print $1}')" = "$PATCH_RAW_SHA256"

          cd publisher
          test "$(git rev-parse HEAD)" = "$PUBLISHER_OLD_HEAD"
          test -z "$(git status --porcelain)"
          git apply --binary --index /tmp/pr18.patch
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/scripts/wos01a-source-bootstrap.mjs' '.github/scripts/wos01a/scan-bootstrap.mjs' | sort)"
          git diff --cached --check
          node --check .github/scripts/wos01a-source-bootstrap.mjs
          node --check .github/scripts/wos01a/scan-bootstrap.mjs
          node --check .github/scripts/wos01a/apply-final-neutralization.mjs
          node --check .github/scripts/wos01a/verify-baseline.mjs
          ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/wos01a-source-bootstrap-publisher.yml')"
          node .github/scripts/wos01a/scan-bootstrap.mjs --self-test
          test "$(git hash-object .github/scripts/wos01a-source-bootstrap.mjs)" = "ae5a85058b05f0b675b0010ec0283df2f178a1df"
          test "$(git hash-object .github/scripts/wos01a/scan-bootstrap.mjs)" = "dfdbb02b4b6706fec3db36c395bf9aa90b73a2cd"
          test "$(git write-tree)" = "$PUBLISHER_TARGET_TREE"
          git config user.name "WorkOS Implementation Controller"
          git config user.email "controller@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git commit -m "ci: converge WOS-01A scanner materialization semantics"
          new_head="$(git rev-parse HEAD)"
          echo "new_head=$new_head" >> "$GITHUB_OUTPUT"

      - name: Re-verify exact live lease immediately before publication
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PUBLISHER_PR),
            });
            const { data: target } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR),
            });
            const failures = [];
            if (publisher.state !== 'open' || !publisher.draft) failures.push('PR18 state/draft changed');
            if (publisher.head.ref !== process.env.PUBLISHER_BRANCH) failures.push(`PR18 head.ref=${publisher.head.ref}`);
            if (publisher.head.sha !== process.env.PUBLISHER_OLD_HEAD) failures.push(`PR18 head.sha=${publisher.head.sha}`);
            if (target.state !== 'open' || !target.draft) failures.push('PR16 state/draft changed');
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`PR16 head.sha=${target.head.sha}`);
            if (target.base.ref !== 'main' || target.base.sha !== process.env.TARGET_BASE) failures.push(`PR16 base=${target.base.ref}@${target.base.sha}`);
            if (failures.length) core.setFailed(`Pre-publication lease failed: ${failures.join(', ')}`);

      - name: Atomic exact-old-head publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd publisher
          test "$(git rev-parse HEAD^)" = "$PUBLISHER_OLD_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$PUBLISHER_TARGET_TREE"
          git config core.hooksPath /dev/null
          git config --unset-all credential.helper || true
          git push --force-with-lease="refs/heads/${PUBLISHER_BRANCH}:${PUBLISHER_OLD_HEAD}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"refs/heads/${PUBLISHER_BRANCH}"

      - name: Verify publication result
        uses: actions/github-script@v7
        env:
          EXPECTED_NEW_HEAD: ${{ steps.build.outputs.new_head }}
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PUBLISHER_PR),
            });
            if (publisher.state !== 'open' || !publisher.draft) core.setFailed('PR18 state/draft changed');
            if (publisher.head.ref !== process.env.PUBLISHER_BRANCH) core.setFailed(`PR18 head.ref=${publisher.head.ref}`);
            if (publisher.head.sha !== process.env.EXPECTED_NEW_HEAD) core.setFailed(`PR18 head.sha=${publisher.head.sha} expected=${process.env.EXPECTED_NEW_HEAD}`);
