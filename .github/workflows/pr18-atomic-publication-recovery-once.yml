name: PR18 Atomic Publication Recovery Once
on:
  push:
    branches:
      - controller/retire-pr18-recovery-runner
    paths:
      - '.github/workflows/pr18-atomic-publication-recovery-once.yml'

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: pr18-atomic-publication-recovery-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact live recovery gate
        uses: actions/github-script@v7
        with:
          script: |
            const {data: publisher} = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: 18
            });
            const {data: target} = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: 16
            });
            const failures = [];
            if (publisher.state !== 'open') failures.push(`PR18 state=${publisher.state}`);
            if (!publisher.draft) failures.push('PR18 not Draft');
            if (publisher.head.ref !== 'controller/wos01a-actions-publisher') failures.push(`PR18 head.ref=${publisher.head.ref}`);
            if (publisher.head.sha !== 'a6ebc2d6867172cd7a8139676fb282b0dcaed9fd') failures.push(`PR18 head.sha=${publisher.head.sha}`);
            if (target.state !== 'open') failures.push(`PR16 state=${target.state}`);
            if (!target.draft) failures.push('PR16 not Draft');
            if (target.head.ref !== 'codex/wos-01-authorized-source-bootstrap-v2') failures.push(`PR16 head.ref=${target.head.ref}`);
            if (target.head.sha !== '7e4b5fad6e0d0d95ddd6c58015a787fb201d8661') failures.push(`PR16 head.sha=${target.head.sha}`);
            if (target.base.ref !== 'main') failures.push(`PR16 base.ref=${target.base.ref}`);
            if (target.base.sha !== '1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea') failures.push(`PR16 base.sha=${target.base.sha}`);
            if (failures.length) core.setFailed(`Recovery gate failed: ${failures.join(', ')}`);

      - name: Checkout exact PR18 branch
        uses: actions/checkout@v4
        with:
          ref: controller/wos01a-actions-publisher
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch verified Codex recovery artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5429923308" --jq '.body' > /tmp/recovery-comment.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('/tmp/recovery-comment.txt').read_text()
          match = re.search(
              r'`PATCH_BASE64_BEGIN`\s*```text\s*([A-Za-z0-9+/=\s]+?)\s*```\s*`PATCH_BASE64_END`',
              text,
              re.S,
          )
          if not match:
              raise SystemExit('canonical recovery payload markers not found')
          payload = ''.join(match.group(1).split())
          if len(payload) != 5696:
              raise SystemExit(f'unexpected recovery Base64 length: {len(payload)}')
          Path('/tmp/pr18.patch.xz.b64').write_text(payload)
          PY
          base64 -d /tmp/pr18.patch.xz.b64 > /tmp/pr18.patch.xz
          test "$(wc -c < /tmp/pr18.patch.xz | tr -d ' ')" = '4272'
          test "$(sha256sum /tmp/pr18.patch.xz | awk '{print $1}')" = '0a24f7e017c6093446137f7e27f76470264fca34907e1e73a67a5852ae6f7995'
          xz -dc /tmp/pr18.patch.xz > /tmp/pr18.patch
          test "$(wc -c < /tmp/pr18.patch | tr -d ' ')" = '13617'
          test "$(sha256sum /tmp/pr18.patch | awk '{print $1}')" = 'ee3e10e2b8c95dd1029d23f9ec733ebe428a4814db2d3717669ebe460b85636e'

      - name: Apply verified convergence and publish atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old='a6ebc2d6867172cd7a8139676fb282b0dcaed9fd'
          target_tree='dea8824878f34b6539ace323fdd479f4deffd439'
          test "$(git rev-parse HEAD)" = "$old"

          git apply --binary --index /tmp/pr18.patch
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          expected=(
            '.github/scripts/wos01a-source-bootstrap.mjs'
            '.github/scripts/wos01a/apply-final-neutralization.mjs'
            '.github/scripts/wos01a/scan-bootstrap.mjs'
            '.github/workflows/wos01a-source-bootstrap-publisher.yml'
          )
          test "${#changed[@]}" = '4'
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed

          test "$(git hash-object .github/scripts/wos01a-source-bootstrap.mjs)" = '7f83f6786e801f18f7cad617f222f97d1edfa19a'
          test "$(git hash-object .github/scripts/wos01a/apply-final-neutralization.mjs)" = '42f5998b19d1fbf07fbacc6e71243dd4b30a6fc6'
          test "$(git hash-object .github/scripts/wos01a/scan-bootstrap.mjs)" = 'cda4ade3fea612bf9ba38dcfe5bc6bd70c18baac'
          test "$(git hash-object .github/workflows/wos01a-source-bootstrap-publisher.yml)" = '0f713c66be56337928ecd585ddc625b4c36a2abf'
          test "$(git write-tree)" = "$target_tree"

          node --check .github/scripts/wos01a-source-bootstrap.mjs
          node --check .github/scripts/wos01a/apply-final-neutralization.mjs
          node --check .github/scripts/wos01a/scan-bootstrap.mjs
          node --check .github/scripts/wos01a/verify-baseline.mjs
          ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/wos01a-source-bootstrap-publisher.yml')"

          rm -rf .git/hooks
          mkdir -p .git/hooks
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          git config --local core.hooksPath /dev/null
          git config user.name 'WorkOS Implementation Controller'
          git config user.email 'actions@users.noreply.github.com'

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.https://github.com/.extraheader="$auth_header" ls-remote origin refs/heads/controller/wos01a-actions-publisher | cut -f1)"
          test "$remote_head" = "$old"

          git commit --no-verify -m 'ci: converge WOS-01A publisher root guards'
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$old"
          test "$(git rev-parse HEAD^{tree})" = "$target_tree"

          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="$auth_header" push \
            --no-verify \
            --force-with-lease=refs/heads/controller/wos01a-actions-publisher:$old \
            origin HEAD:refs/heads/controller/wos01a-actions-publisher

          remote_after="$(git -c http.https://github.com/.extraheader="$auth_header" ls-remote origin refs/heads/controller/wos01a-actions-publisher | cut -f1)"
          test "$remote_after" = "$new_head"
          echo "published_head=$new_head" >> "$GITHUB_STEP_SUMMARY"
