name: WOS-02 Controller Rebind Materializer

on:
  push:
    branches: [controller/wos02-migration-publisher-temp2]
    paths: ['.github/workflows/wos02-controller-rebind-materializer.yml']

permissions:
  contents: write
  pull-requests: read

env:
  OLD_CONTROLLER_HEAD: 62adfe868ba64399cce51b2b78feea57b59884a5
  TARGET_HEAD: 031be9e18b6871594f0cfef25f8b098741dde74c
  TARGET_TREE: 6f8813a9bb0a4821734ae8cd0a60f935fe1e16e1
  EXPECTED_MAIN: 3070c80a71640fa4275477d0d2f1538cc8d2a819

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live leases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$EXPECTED_MAIN"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq .head.sha)" = "$TARGET_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq .draft)" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/$TARGET_HEAD --jq .commit.tree.sha)" = "$TARGET_TREE"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq .head.sha)" = "$OLD_CONTROLLER_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq .draft)" = "true"

      - name: Checkout exact existing acceptance controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OLD_CONTROLLER_HEAD }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout materializer branch
        uses: actions/checkout@v4
        with:
          ref: controller/wos02-migration-publisher-temp2
          path: publisher
          fetch-depth: 1
          persist-credentials: true

      - name: Generate and validate safe rebound payload
        run: |
          set -euo pipefail
          node publisher/.github/scripts/wos02-controller-rebind-materialize.mjs \
            source/.github/workflows/wos02-final-review-acceptance.yml \
            publisher/.controller-payload/wos02-final-review-acceptance.rebound.yml
          ruby -e "require 'yaml'; YAML.load_file('publisher/.controller-payload/wos02-final-review-acceptance.rebound.yml'); puts 'YAML OK'"
          grep -q 'TARGET_HEAD: 031be9e18b6871594f0cfef25f8b098741dde74c' publisher/.controller-payload/wos02-final-review-acceptance.rebound.yml
          grep -q 'TARGET_TREE: 6f8813a9bb0a4821734ae8cd0a60f935fe1e16e1' publisher/.controller-payload/wos02-final-review-acceptance.rebound.yml
          grep -q '21-file authority' publisher/.controller-payload/wos02-final-review-acceptance.rebound.yml
          grep -q '025a_wos02_project_legal_scope_unique_prerequisite' publisher/.controller-payload/wos02-final-review-acceptance.rebound.yml

      - name: Publish safe payload data
        working-directory: publisher
        run: |
          set -euo pipefail
          git config user.name 'WorkOS Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add .controller-payload
          git commit -m 'chore: publish WOS-02 controller rebind payload'
          git push origin HEAD:controller/wos02-migration-publisher-temp2
