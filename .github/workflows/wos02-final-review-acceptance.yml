name: WOS-02 Final-Review Exact-Head Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wos02-final-review-acceptance.yml'
      - '.github/scripts/wos02-final-review-live-acceptance.mjs'
      - '.github/scripts/wos02-scope-write-acceptance.mjs'
      - '.github/scripts/wos02-worker-lifecycle-acceptance.mjs'
      - '.github/scripts/wos02-mutation-lifecycle-acceptance.mjs'
      - '.github/scripts/wos02-reporting-period-acceptance.mjs'
      - '.github/scripts/wos02-reporting-period-u8u9-acceptance.mjs'
      - '.github/scripts/wos02-readiness-acceptance.mjs'
      - '.github/scripts/wos02-org-profile-acceptance.mjs'
      - '.github/scripts/wos02-calendar-acceptance.mjs'
      - '.github/scripts/wos02-demo-seed-acceptance.mjs'
      - '.github/scripts/wos02-terminology-acceptance.mjs'

permissions:
  contents: read
  pull-requests: read

env:
  TARGET_PR: '37'
  TARGET_BRANCH: codex/wos-02-organization-setup-foundation
  TARGET_HEAD: d64de8002da8c2314f733eebe034ff9b93234fd7
  TARGET_TREE: 2df2bd1ade3b57f9afba67a97b0d237ac1aae8ea
  EXPECTED_MAIN_HEAD: 3070c80a71640fa4275477d0d2f1538cc8d2a819
  RETAINED_WOS01_CONTROLLER: b48f40b61d26c21920b00f658a720c02b1f01c08
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: workos
  PGPASSWORD: workos

concurrency:
  group: wos02-final-review-exact-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    name: Final-review exact-head WOS-02 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Verify exact product controller main and 44-file authority
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const controller = context.payload.pull_request;
            if (!controller?.draft) failures.push('controller is not Draft');
            if (controller?.head?.ref !== 'controller/wos02-exact-acceptance') failures.push(`controller head=${controller?.head?.ref}`);
            if (controller?.base?.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`controller base=${controller?.base?.sha}`);
            const {data: main} = await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            const {data: target} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:Number(process.env.TARGET_PR)});
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);
            if (target.state !== 'open' || !target.draft) failures.push(`target lifecycle=${target.state}/draft:${target.draft}`);
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target branch=${target.head.ref}`);
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`target head=${target.head.sha}`);
            if (target.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`target base=${target.base.sha}`);
            const {data: commit} = await github.rest.repos.getCommit({owner:context.repo.owner,repo:context.repo.repo,ref:process.env.TARGET_HEAD});
            if (commit.commit.tree.sha !== process.env.TARGET_TREE) failures.push(`target tree=${commit.commit.tree.sha}`);
            const files = await github.paginate(github.rest.pulls.listFiles,{owner:context.repo.owner,repo:context.repo.repo,pull_number:Number(process.env.TARGET_PR),per_page:100});
            const actual = files.map(f => f.filename).sort();
            const required = [
              'docs/00-control/REQUIREMENTS_TRACEABILITY.md',
              'docs/tasks/WOS-02-ORGANIZATION-SETUP-FOUNDATION.md',
              'package.json',
              'server/index.mjs',
              'server/migrations/022_organization_setup_foundation.sql',
              'server/migrations/023_wos02_scope_lifecycle_integrity.sql',
              'server/migrations/024_wos02_final_review_closure.sql',
              'server/migrations/025_wos02_timesheet_scope_integrity.sql',
              'server/migrations/025a_wos02_project_legal_scope_unique_prerequisite.sql',
              'server/migrations/026_wos02_canonical_legal_scope_integrity.sql',
              'server/migrations/027_wos02_reporting_period_authority.sql',
              'server/migrations/028_wos02_organization_legal_entity_profiles.sql',
              'server/migrations/029_wos02_working_calendar_authority.sql',
              'server/migrations/030_wos02_reporting_period_frequency.sql',
              'server/organization-setup.mjs',
              'server/reporting-periods.mjs',
              'server/seed-demo.mjs',
              'server/setup-readiness.mjs',
              'server/worker-lifecycle.mjs',
              'server/working-calendars.mjs',
              'src/App.tsx',
              'src/components/Layout/Header.tsx',
              'src/components/Layout/Sidebar.tsx',
              'src/components/employee/OrgChartView.tsx',
              'src/components/forms/EmployeeForm.tsx',
              'src/components/forms/ProjectForm.tsx',
              'src/config/RuntimeTerminology.tsx',
              'src/config/productConfig.ts',
              'src/config/terminology.ts',
              'src/lib/reportExport.ts',
              'src/pages/AdminSettings.tsx',
              'src/pages/EmployeeDetail.tsx',
              'src/pages/EmployeeMaster.tsx',
              'src/pages/ImportExport.tsx',
              'src/pages/ProjectDetail.tsx',
              'src/pages/ProjectManagerWorkspace.tsx',
              'src/pages/ProjectMaster.tsx',
              'src/pages/ReportsCenter.tsx',
              'src/services/api.ts',
              'src/services/apiClient.ts',
              'src/types.ts',
              'tests/backend-contract-smoke.mjs',
              'tests/organization-setup-smoke.mjs',
              'tests/terminology-runtime-smoke.mjs',
            ].sort();
            if (JSON.stringify(actual) !== JSON.stringify(required)) failures.push(`target files=${JSON.stringify(actual)}`);
            if (failures.length) core.setFailed(`authority failed: ${failures.join('; ')}`);

      - name: Checkout exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout accepted WOS-01A main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_HEAD }}
          path: accepted-main
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout retained real-Chrome authority
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RETAINED_WOS01_CONTROLLER }}
          path: retained-wos01-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            target/package-lock.json
            accepted-main/package-lock.json

      - name: Verify pristine exact trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(git -C target write-tree)" = "$TARGET_TREE"
          test -z "$(git -C target status --porcelain)"
          test "$(git -C accepted-main rev-parse HEAD)" = "$EXPECTED_MAIN_HEAD"

      - name: Locked install
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix target
          npm ci --prefix accepted-main

      - name: Static retained build security and hygiene gates
        shell: bash
        working-directory: target
        env:
          APP_MODE: test
          VITE_APP_MODE: test
          ALLOW_TEST_FALLBACK: 'true'
          VITE_ALLOW_TEST_FALLBACK: 'true'
        run: |
          set -euo pipefail
          npm run test:organization-setup
          npm test
          npm run test:backend
          npm run test:authorization-convergence
          npm run typecheck
          npm run lint
          npm run build
          npm run test:bootstrap-scan
          npm run test:wos00-baseline
          npm audit --omit=dev --audit-level=high
          git diff --check "$EXPECTED_MAIN_HEAD..$TARGET_HEAD"
          node -e "const p=require('./package.json');if(p.scripts['api:seed:demo']!=='node --import tsx server/seed-demo.mjs')throw new Error('unexpected api:seed:demo command')"
          node --check server/index.mjs
          node --check server/organization-setup.mjs
          node --check server/worker-lifecycle.mjs
          node --check server/reporting-periods.mjs
          node --check server/setup-readiness.mjs
          node --check server/working-calendars.mjs
          node --check server/seed-demo.mjs
          node --check ../controller/.github/scripts/wos02-org-profile-acceptance.mjs
          node --check ../controller/.github/scripts/wos02-calendar-acceptance.mjs
          node --check ../controller/.github/scripts/wos02-demo-seed-acceptance.mjs
          node --check ../controller/.github/scripts/wos02-terminology-acceptance.mjs
          node --check ../controller/.github/scripts/wos02-mutation-lifecycle-acceptance.mjs
          node --check ../controller/.github/scripts/wos02-reporting-period-acceptance.mjs
          node --check ../controller/.github/scripts/wos02-reporting-period-u8u9-acceptance.mjs

      - name: Execute FINAL TERMINOLOGY runtime and stability acceptance
        shell: bash
        working-directory: controller
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          node .github/scripts/wos02-terminology-acceptance.mjs

      - name: Production startup fails closed without required config
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          set +e
          env -u DATABASE_URL -u API_SESSION_SECRET NODE_ENV=production timeout 10s node server/start-production.mjs > "$RUNNER_TEMP/prod-fail-closed.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/prod-fail-closed.log"
          test "$rc" -ne 0
          grep -Eq 'DATABASE_URL|API_SESSION_SECRET|required' "$RUNNER_TEMP/prod-fail-closed.log"

      - name: Prepare PostgreSQL acceptance databases
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres && break; sleep 1; done
          for db in wos02_final_fresh wos02_final_upgrade wos02_final_live wos02_scope_write wos02_worker_lifecycle wos02_mutation_lifecycle wos02_reporting_period wos02_reporting_u8u9 wos02_readiness wos02_org_profile wos02_calendar wos02_demo_seed wos02_final_prod; do
            dropdb --if-exists -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$db"
            createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$db"
          done

      - name: Fresh install and replay migrations 022 through 030
        shell: bash
        working-directory: target
        env:
          DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_final_fresh
        run: |
          set -euo pipefail
          ids="'022_organization_setup_foundation','023_wos02_scope_lifecycle_integrity','024_wos02_final_review_closure','025_wos02_timesheet_scope_integrity','025a_wos02_project_legal_scope_unique_prerequisite','026_wos02_canonical_legal_scope_integrity','027_wos02_reporting_period_authority','028_wos02_organization_legal_entity_profiles','029_wos02_working_calendar_authority','030_wos02_reporting_period_frequency'"
          node server/migrate.mjs | tee "$RUNNER_TEMP/wos02-final-fresh-first.log"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from schema_migrations where id in ($ids)")" = 10
          node -e "const fs=require('fs');const f=fs.readdirSync('server/migrations').filter(x=>x.endsWith('.sql')).sort();const names=['025_wos02_timesheet_scope_integrity.sql','025a_wos02_project_legal_scope_unique_prerequisite.sql','026_wos02_canonical_legal_scope_integrity.sql','027_wos02_reporting_period_authority.sql','028_wos02_organization_legal_entity_profiles.sql','029_wos02_working_calendar_authority.sql','030_wos02_reporting_period_frequency.sql'];const p=names.map(x=>f.indexOf(x));if(p.some(x=>x<0)||p.some((x,i)=>i&&p[i-1]>=x))throw new Error('invalid migration order '+f.join(','));"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_indexes where indexname='uq_projects_org_legal_id'")" = 1
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conname='project_allocations_project_legal_scope_fk'")" = 1
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conname='reporting_period_ranges_no_overlap'")" = 0
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conname='reporting_period_frequency_ranges_no_overlap'")" = 1
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from reporting_periods where frequency is null or frequency not in ('Weekly','Monthly','Fiscal')")" = 0
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.tables where table_name in ('organization_profile_versions','legal_entity_profile_versions')")" = 2
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conname in ('organization_profile_versions_no_overlap','legal_entity_profile_versions_no_overlap')")" = 2
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_indexes where indexname in ('uq_legal_entity_registration_identity','uq_legal_entity_tax_identity')")" = 2
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from organization_profile_versions where organization_id='org-default'")" = 1
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from legal_entity_profile_versions where legal_entity_id='legal-default'")" = 1
          node server/migrate.mjs | tee "$RUNNER_TEMP/wos02-final-fresh-replay.log"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from schema_migrations where id in ($ids)")" = 10
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from schema_migrations where id='028_wos02_organization_legal_entity_profiles'")" = 1
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from schema_migrations where id='029_wos02_working_calendar_authority'")" = 1
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from schema_migrations where id='030_wos02_reporting_period_frequency'")" = 1

      - name: Exact WOS-01A upgrade backfill reconciliation and replay through 030
        shell: bash
        env:
          UPGRADE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_final_upgrade
        run: |
          set -euo pipefail
          (cd accepted-main && DATABASE_URL="$UPGRADE_URL" node server/migrate.mjs)
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into country_directors(id,name,region) values('cd-final-up','Final Upgrade Director','Synthetic') on conflict(id) do nothing;
          insert into users(id,username,email,status) values('00000000-0000-0000-0000-000000000801','final-up-user','final-up-user@example.test','Active');
          insert into employees(id,employee_id,name,email,designation,department,country,primary_country_director_id,status)
            values('e-final-up','E-FINAL-UP','Final Upgrade Employee','final-up-employee@example.test','Engineer','Delivery','Synthetic','cd-final-up','Active');
          insert into clients(id,name) values('client-final-up','Final Upgrade Client');
          insert into projects(id,project_code,name,client_id,client,manager_name,start_date,end_date,status)
            values('p-final-up','P-FINAL-UP','Final Upgrade Project','client-final-up','Final Upgrade Client','Upgrade Manager','2026-01-01','2026-12-31','Active');
          insert into project_allocations(id,employee_id,project_id,percentage,start_date,end_date,status)
            values('a-final-up','e-final-up','p-final-up',100,'2026-01-01','2026-12-31','Active');
          insert into timesheets(id,employee_id,week_ending,status,total_hours,billable_hours)
            values('00000000-0000-0000-0000-000000000802','e-final-up','2026-01-04','Draft',0,0);
          SQL
          before="$(psql "$UPGRADE_URL" -Atc "select (select count(*) from employees)||'|'||(select count(*) from clients)||'|'||(select count(*) from projects)||'|'||(select count(*) from project_allocations)||'|'||(select count(*) from timesheets)")"
          mv target/server/migrations/027_wos02_reporting_period_authority.sql "$RUNNER_TEMP/027_wos02_reporting_period_authority.sql"
          mv target/server/migrations/028_wos02_organization_legal_entity_profiles.sql "$RUNNER_TEMP/028_wos02_organization_legal_entity_profiles.sql"
          mv target/server/migrations/029_wos02_working_calendar_authority.sql "$RUNNER_TEMP/029_wos02_working_calendar_authority.sql"
          mv target/server/migrations/030_wos02_reporting_period_frequency.sql "$RUNNER_TEMP/030_wos02_reporting_period_frequency.sql"
          (cd target && DATABASE_URL="$UPGRADE_URL" node server/migrate.mjs)
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into reporting_periods(organization_id,legal_entity_id,code,name,starts_on,ends_on,status)
            values('org-default','legal-default','RP-LEGACY-LOCKED','Legacy Locked Period','2026-09-01','2026-09-30','Locked');
          insert into working_calendars(id,organization_id,legal_entity_id,code,name,timezone,working_days,hours_per_day,effective_from,active)
            values('calendar-upgrade-retained','org-default','legal-default','CAL-UPGRADE','Upgrade Calendar','UTC',array[1,2,3,4,5],8,'2026-01-01',true);
          update worker_profiles set working_calendar_id='calendar-upgrade-retained' where employee_id='e-final-up';
          SQL
          mv "$RUNNER_TEMP/027_wos02_reporting_period_authority.sql" target/server/migrations/027_wos02_reporting_period_authority.sql
          mv "$RUNNER_TEMP/028_wos02_organization_legal_entity_profiles.sql" target/server/migrations/028_wos02_organization_legal_entity_profiles.sql
          mv "$RUNNER_TEMP/029_wos02_working_calendar_authority.sql" target/server/migrations/029_wos02_working_calendar_authority.sql
          mv "$RUNNER_TEMP/030_wos02_reporting_period_frequency.sql" target/server/migrations/030_wos02_reporting_period_frequency.sql
          (cd target && DATABASE_URL="$UPGRADE_URL" node server/migrate.mjs)
          after="$(psql "$UPGRADE_URL" -Atc "select (select count(*) from employees)||'|'||(select count(*) from clients)||'|'||(select count(*) from projects)||'|'||(select count(*) from project_allocations)||'|'||(select count(*) from timesheets)")"
          test "$before" = "$after"
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id||'|'||legal_entity_id from employees where id='e-final-up'")" = 'org-default|legal-default'
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id||'|'||legal_entity_id from clients where id='client-final-up'")" = 'org-default|legal-default'
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id||'|'||legal_entity_id from projects where id='p-final-up'")" = 'org-default|legal-default'
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id||'|'||legal_entity_id from project_allocations where id='a-final-up'")" = 'org-default|legal-default'
          test "$(psql "$UPGRADE_URL" -Atc "select organization_id||'|'||legal_entity_id from timesheets where id='00000000-0000-0000-0000-000000000802'")" = 'org-default|legal-default'
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from worker_history where employee_id='e-final-up' and legal_entity_id='legal-default'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select status from reporting_periods where code='RP-LEGACY-LOCKED' and organization_id='org-default' and legal_entity_id='legal-default'")" = 'Financially Locked'
          test "$(psql "$UPGRADE_URL" -Atc "select frequency from reporting_periods where code='RP-LEGACY-LOCKED' and organization_id='org-default' and legal_entity_id='legal-default'")" = 'Weekly'
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from schema_migrations where id='027_wos02_reporting_period_authority'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from schema_migrations where id='028_wos02_organization_legal_entity_profiles'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from schema_migrations where id='029_wos02_working_calendar_authority'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from organization_profile_versions where organization_id='org-default'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from legal_entity_profile_versions where organization_id='org-default' and legal_entity_id='legal-default'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select id||'|'||organization_id||'|'||legal_entity_id from working_calendars where id='calendar-upgrade-retained'")" = 'calendar-upgrade-retained|org-default|legal-default'
          test "$(psql "$UPGRADE_URL" -Atc "select working_calendar_id from worker_profiles where employee_id='e-final-up'")" = 'calendar-upgrade-retained'
          (cd target && DATABASE_URL="$UPGRADE_URL" node server/migrate.mjs)
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from schema_migrations where id='028_wos02_organization_legal_entity_profiles'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select count(*) from schema_migrations where id='029_wos02_working_calendar_authority'")" = 1
          test "$(psql "$UPGRADE_URL" -Atc "select status from reporting_periods where code='RP-LEGACY-LOCKED'")" = 'Financially Locked'

      - name: Execute retained corrected 17-check live API and DB closure matrix
        shell: bash
        working-directory: controller
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
          DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_final_live
        run: |
          set -euo pipefail
          (cd "$TARGET_ROOT" && DATABASE_URL="$DATABASE_URL" node server/migrate.mjs)
          node .github/scripts/wos02-final-review-live-acceptance.mjs

      - name: Execute 15-check canonical organization and legal scope write matrix
        shell: bash
        working-directory: controller
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
          DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_scope_write
        run: |
          set -euo pipefail
          (cd "$TARGET_ROOT" && DATABASE_URL="$DATABASE_URL" node server/migrate.mjs)
          node .github/scripts/wos02-scope-write-acceptance.mjs

      - name: Execute worker lifecycle and linked identity acceptance matrix
        shell: bash
        working-directory: controller
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
          DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_worker_lifecycle
        run: |
          set -euo pipefail
          (cd "$TARGET_ROOT" && DATABASE_URL="$DATABASE_URL" node server/migrate.mjs)
          node .github/scripts/wos02-worker-lifecycle-acceptance.mjs

      - name: Execute P1 mutation and lifecycle acceptance matrix
        shell: bash
        working-directory: controller
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
          DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_mutation_lifecycle
        run: |
          set -euo pipefail
          (cd "$TARGET_ROOT" && DATABASE_URL="$DATABASE_URL" node server/migrate.mjs)
          node .github/scripts/wos02-mutation-lifecycle-acceptance.mjs

      - name: Execute reporting-period authority and audit acceptance matrix
        shell: bash
        working-directory: controller
        env:
