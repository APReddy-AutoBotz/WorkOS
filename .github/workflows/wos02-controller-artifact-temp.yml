name: TEMP WOS-02 Controller Artifact Builder

on:
  push:
    branches: [controller/wos02-terminology-controller-publisher-temp]
    paths: ['.github/workflows/wos02-controller-artifact-temp.yml']

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact verified controller files
        shell: bash
        run: |
          set -euo pipefail
          base='4b7e1748e455727dd51ffd3a662bcbd46d8898ad'
          result_tree='c1e162c5378270750c596780eacae7167fa8813b'
          payload=''
          git fetch origin controller/wos02-exact-acceptance
          git checkout -B controller/wos02-exact-acceptance origin/controller/wos02-exact-acceptance
          test "$(git rev-parse HEAD)" = "$base"
          printf '%s' "$payload" | base64 -d | gzip -dc > /tmp/controller.diff
          test "$(wc -c < /tmp/controller.diff)" = 9840
          echo 'e2c9d1d26e15f00aafd634dd9306d4260c1ffbf993c90c05511c70c8ecb61826  /tmp/controller.diff' | sha256sum -c -
          git apply --index --binary /tmp/controller.diff
          test "$(git write-tree)" = "$result_tree"
          node --check .github/scripts/wos02-terminology-acceptance.mjs
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/wos02-final-review-acceptance.yml')"
          git diff --cached --check
          mkdir -p /tmp/wos02-controller-final/.github/scripts /tmp/wos02-controller-final/.github/workflows
          cp .github/scripts/wos02-terminology-acceptance.mjs /tmp/wos02-controller-final/.github/scripts/
          cp .github/workflows/wos02-final-review-acceptance.yml /tmp/wos02-controller-final/.github/workflows/
          cp /tmp/controller.diff /tmp/wos02-controller-final/controller.diff
      - name: Upload exact controller recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: wos02-terminology-controller-exact
          path: /tmp/wos02-controller-final
          if-no-files-found: error
          retention-days: 1
