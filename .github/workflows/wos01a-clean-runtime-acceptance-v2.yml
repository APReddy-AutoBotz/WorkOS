name: WOS-01A Clean Runtime Acceptance v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wos01a-clean-runtime-acceptance-v2.yml'
      - '.github/scripts/wos01a-clean-runtime-matrix-v2.sh'
      - '.github/scripts/wos01a-browser-acceptance-v2.mjs'
      - '.github/scripts/wos01a-browser-lifecycle-v2.mjs'
      - '.github/scripts/test-wos01a-browser-lifecycle-v2.mjs'
      - '.github/scripts/verify-wos01a-controller-v2.mjs'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wos01a-clean-runtime-acceptance-v2
  cancel-in-progress: true

env:
  CONTROLLER_PR: '26'
  CONTROLLER_BRANCH: controller/wos01a-clean-runtime-acceptance-v2
  TARGET_PR: '27'
  TARGET_BRANCH: codex/wos01a-acceptance-closure
  TARGET_HEAD: 53dd7b8d372cae9cd3480d39d549a709a12c4c90
  PARENT_PR: '16'
  PARENT_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
  PARENT_HEAD: 590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60
  EXPECTED_MAIN_HEAD: 44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42
  ACCEPTED_WOS00_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: workos
  PGPASSWORD: workos

jobs:
  acceptance:
    name: Exact-head clean-runtime matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Verify exact controller, target, parent and main authority
        id: authority
        uses: actions/github-script@v7
        with:
          script: |
            const controller = context.payload.pull_request;
            const failures = [];
            if (controller.number !== Number(process.env.CONTROLLER_PR)) failures.push(`controller.number=${controller.number}`);
            if (controller.state !== 'open') failures.push(`controller.state=${controller.state}`);
            if (!controller.draft) failures.push('controller is not Draft');
            if (controller.head.ref !== process.env.CONTROLLER_BRANCH) failures.push(`controller.head.ref=${controller.head.ref}`);
            if (controller.head.sha !== context.payload.pull_request.head.sha) failures.push(`controller.head.sha=${controller.head.sha}`);
            if (controller.base.ref !== 'main') failures.push(`controller.base.ref=${controller.base.ref}`);
            if (controller.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`controller.base.sha=${controller.base.sha}`);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: controller.number,
              per_page: 100,
            });
            const actual = files.map(file => file.filename).sort();
            const expected = [
              '.github/scripts/test-wos01a-browser-lifecycle-v2.mjs',
              '.github/scripts/verify-wos01a-controller-v2.mjs',
              '.github/scripts/wos01a-browser-acceptance-v2.mjs',
              '.github/scripts/wos01a-browser-lifecycle-v2.mjs',
              '.github/scripts/wos01a-clean-runtime-matrix-v2.sh',
              '.github/workflows/wos01a-clean-runtime-acceptance-v2.yml',
            ].sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) failures.push(`controller.paths=${JSON.stringify(actual)}`);

            const {data: target} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR),
            });
            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target is not Draft');
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`target.head.sha=${target.head.sha}`);
            if (target.base.ref !== process.env.PARENT_BRANCH) failures.push(`target.base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.PARENT_HEAD) failures.push(`target.base.sha=${target.base.sha}`);

            const {data: parent} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PARENT_PR),
            });
            if (parent.state !== 'open') failures.push(`parent.state=${parent.state}`);
            if (!parent.draft) failures.push('parent is not Draft');
            if (parent.head.ref !== process.env.PARENT_BRANCH) failures.push(`parent.head.ref=${parent.head.ref}`);
            if (parent.head.sha !== process.env.PARENT_HEAD) failures.push(`parent.head.sha=${parent.head.sha}`);
            if (parent.base.ref !== 'main') failures.push(`parent.base.ref=${parent.base.ref}`);
            if (parent.base.sha !== process.env.ACCEPTED_WOS00_BASE) failures.push(`parent.base.sha=${parent.base.sha}`);

            const {data: main} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);
            if (failures.length) core.setFailed(`WOS-01A exact authority failed: ${failures.join(', ')}`);

      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact corrected product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_HEAD }}
          path: current-main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Run complete fail-closed acceptance matrix
        id: matrix
        continue-on-error: true
        shell: bash
        env:
          CONTROLLER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh
          bash controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh \
            "$GITHUB_WORKSPACE/controller" \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/current-main"

      - name: Verify final live authority and retain evidence
        id: final_authority
        if: always()
        uses: actions/github-script@v7
        env:
          CONTROLLER_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const evidence = path.join(process.env.GITHUB_WORKSPACE, 'target', '.acceptance-evidence');
            fs.mkdirSync(evidence, {recursive: true});
            const failures = [];

            const {data: controller} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.CONTROLLER_PR),
            });
            const {data: target} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR),
            });
            const {data: parent} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PARENT_PR),
            });
            const {data: main} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });

            if (controller.state !== 'open') failures.push(`controller.state=${controller.state}`);
            if (!controller.draft) failures.push('controller is not Draft');
            if (controller.head.ref !== process.env.CONTROLLER_BRANCH) failures.push(`controller.head.ref=${controller.head.ref}`);
            if (controller.head.sha !== process.env.CONTROLLER_HEAD) failures.push(`controller.head.sha=${controller.head.sha}`);
            if (controller.base.ref !== 'main') failures.push(`controller.base.ref=${controller.base.ref}`);
            if (controller.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`controller.base.sha=${controller.base.sha}`);

            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target is not Draft');
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.TARGET_HEAD) failures.push(`target.head.sha=${target.head.sha}`);
            if (target.base.ref !== process.env.PARENT_BRANCH) failures.push(`target.base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.PARENT_HEAD) failures.push(`target.base.sha=${target.base.sha}`);

            if (parent.state !== 'open') failures.push(`parent.state=${parent.state}`);
            if (!parent.draft) failures.push('parent is not Draft');
            if (parent.head.ref !== process.env.PARENT_BRANCH) failures.push(`parent.head.ref=${parent.head.ref}`);
            if (parent.head.sha !== process.env.PARENT_HEAD) failures.push(`parent.head.sha=${parent.head.sha}`);
            if (parent.base.ref !== 'main') failures.push(`parent.base.ref=${parent.base.ref}`);
            if (parent.base.sha !== process.env.ACCEPTED_WOS00_BASE) failures.push(`parent.base.sha=${parent.base.sha}`);

            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);

            fs.writeFileSync(path.join(evidence, 'final-controller-pr.json'), `${JSON.stringify(controller, null, 2)}\n`);
            fs.writeFileSync(path.join(evidence, 'final-target-pr.json'), `${JSON.stringify(target, null, 2)}\n`);
            fs.writeFileSync(path.join(evidence, 'final-parent-pr.json'), `${JSON.stringify(parent, null, 2)}\n`);
            fs.writeFileSync(path.join(evidence, 'final-main.json'), `${JSON.stringify(main, null, 2)}\n`);
            fs.appendFileSync(path.join(evidence, 'gate-outcomes.txt'), `final_authority=${failures.length ? 'FAIL' : 'PASS'}\n`);
            if (failures.length) core.setFailed(`WOS-01A final authority failed: ${failures.join(', ')}`);

      - name: Upload exact-head acceptance evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01a-clean-runtime-${{ env.TARGET_HEAD }}
          path: target/.acceptance-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Aggregate fail-closed result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.authority.outcome }}' = success
          test '${{ steps.matrix.outcome }}' = success
          test '${{ steps.final_authority.outcome }}' = success
          test '${{ steps.evidence_upload.outcome }}' = success
