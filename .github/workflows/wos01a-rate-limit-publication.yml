name: WOS-01A Identity Fixture Publication Recovery

"on":
  push:
    branches:
      - controller/wos01a-rate-limit-publication
    paths:
      - '.github/workflows/wos01a-rate-limit-publication.yml'

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: wos01a-rate-limit-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish exact three-file correction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
      PR_NUMBER: '16'
      EXPECTED_MAIN: 44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42
      EXPECTED_PARENT: ef841d4b716b0ed021381e61433158426eb380dc
      EXPECTED_PARENT_TREE: 196594feef3556c24b9ed50f04140dbae7e265e4
      EXPECTED_FINAL_TREE: 41c4e4fcc672799fc2aead7f854d125d049d9dfd
      EXPECTED_B64_CHARS: '3032'
      EXPECTED_B64_SHA256: 44974fc212b7e5b4945d3b1b39938cb37c4fba5c7ea94836f452cf2b8a0f3d09
      EXPECTED_XZ_BYTES: '2272'
      EXPECTED_XZ_SHA256: 4a158b88ded74fad0734526ce09f7b67226ee8e88b0e4be90bdc0c0719e61ad5
      EXPECTED_PATCH_BYTES: '4919'
      EXPECTED_PATCH_SHA256: 4a0692ae4d6e86269711d7443d286d664bce9f13a2e2a8b916d09e9d8e9bfbb9
      RECOVERY_PATH: .github/workflows/wos01a-rate-limit-publication.yml

    steps:
      - name: Checkout exact controller trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify, apply, validate and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'controller/wos01a-rate-limit-publication'
          trigger_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = '52c4aa58260097864cc6c575c1e2fcbf42b8f531'
          test "$(git diff --name-only HEAD^ HEAD)" = "$RECOVERY_PATH"

          printf '%s' '' > /tmp/recovery.b64
          test "$(wc -c < /tmp/recovery.b64 | tr -d '[:space:]')" = "$EXPECTED_B64_CHARS"
          printf '%s  %s\n' "$EXPECTED_B64_SHA256" /tmp/recovery.b64 | sha256sum -c -
          base64 -d /tmp/recovery.b64 > /tmp/recovery.patch.xz
          test "$(wc -c < /tmp/recovery.patch.xz | tr -d '[:space:]')" = "$EXPECTED_XZ_BYTES"
          printf '%s  %s\n' "$EXPECTED_XZ_SHA256" /tmp/recovery.patch.xz | sha256sum -c -
          xz -dc /tmp/recovery.patch.xz > /tmp/recovery.patch
          test "$(wc -c < /tmp/recovery.patch | tr -d '[:space:]')" = "$EXPECTED_PATCH_BYTES"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" /tmp/recovery.patch | sha256sum -c -

          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)" = 'open'
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .draft)" = 'true'
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.ref)" = "$PRODUCT_BRANCH"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_PARENT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.ref)" = 'main'

          git fetch --no-tags origin "$EXPECTED_PARENT"
          git checkout --detach "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PARENT_TREE"
          git reset --hard "$EXPECTED_PARENT"
          git clean -ffdx
          git apply --check /tmp/recovery.patch
          git apply --index /tmp/recovery.patch

          actual_paths="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' 'docs/evidence/v0.2.0/DOC-WOS-01-001-SOURCE-BOOTSTRAP.md' 'tests/authorization-convergence-smoke.mjs' 'tests/production-identity-smoke.mjs' | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          test "$(git write-tree)" = "$EXPECTED_FINAL_TREE"
          test "$(git hash-object docs/evidence/v0.2.0/DOC-WOS-01-001-SOURCE-BOOTSTRAP.md)" = '3db9a206dcda46980edc6a0bc75ca6c57223e195'
          test "$(git hash-object tests/authorization-convergence-smoke.mjs)" = 'aed1ac45d95d726487dfcc85d67d443b278e0e6c'
          test "$(git hash-object tests/production-identity-smoke.mjs)" = 'dca7f7a20799b2a4ffc9cd2a34e7a8d562fd387a'

          printf '%s  %s\n' 'ee90042010df25d7595d4676fd619860da8521f5d6f239f4ea6c9a86ae4f141e' docs/evidence/v0.2.0/DOC-WOS-01-001-SOURCE-BOOTSTRAP.md | sha256sum -c -
          printf '%s  %s\n' '124db5f97c53e924007e4ccd9fc0061ddfdd29ed093b4cd68755c63ab00fc717' tests/authorization-convergence-smoke.mjs | sha256sum -c -
          printf '%s  %s\n' '1a74580c3e2341b3fcd3f527e1b0fd7a7f814b38e740271d8f12b31ebca6c8cf' tests/production-identity-smoke.mjs | sha256sum -c -
          test "$(wc -c < docs/evidence/v0.2.0/DOC-WOS-01-001-SOURCE-BOOTSTRAP.md | tr -d '[:space:]')" = '31975'
          test "$(wc -c < tests/authorization-convergence-smoke.mjs | tr -d '[:space:]')" = '2020'
          test "$(wc -c < tests/production-identity-smoke.mjs | tr -d '[:space:]')" = '21664'

          node --check tests/production-identity-smoke.mjs
          node --check tests/authorization-convergence-smoke.mjs
          node tests/authorization-convergence-smoke.mjs
          npm run lint
          npm run test:wos00-baseline
          npm run test:bootstrap-scan
          git diff --cached --check

          git config user.name 'WorkOS Identity Fixture Controller'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'test: isolate identity replay from rate limit'
          final_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_FINAL_TREE"
          test -z "$(git status --porcelain)"

          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_PARENT"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$final_head"
          for attempt in 1 2 3 4 5; do
            if test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$final_head"; then
              break
            fi
            test "$attempt" != '5'
            sleep 3
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$final_head"

          comment="$(cat <<EOF
## WOS-01A exact identity-fixture correction published

The verified Codex recovery payload from comment \`5468063739\` was decoded, hash-checked, independently applied to exact parent \`$EXPECTED_PARENT\`, and normal-fast-forward published to the existing PR #16 branch.

- Published head: \`$final_head\`
- Exact tree: \`$EXPECTED_FINAL_TREE\`
- Changed files: exactly three retained test/evidence files
- Production server, schema, migrations, limiter default and OAuth state behavior: unchanged
- Controller run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

PR #16 remains Draft. PR #30 must now be refreshed coherently to this exact product head before authoritative acceptance is rerun.
EOF
)"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST -f body="$comment" >/dev/null
          echo "Published $final_head with tree $EXPECTED_FINAL_TREE"
