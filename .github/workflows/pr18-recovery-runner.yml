name: PR18 Guarded URL-Scanner Publication Recovery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pr18-recovery-runner.yml'

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: pr18-guarded-publication-recovery
  cancel-in-progress: false

env:
  PUBLISHER_PR: '18'
  PUBLISHER_BRANCH: controller/wos01a-actions-publisher
  PUBLISHER_HEAD: fb71559ac301f61af1f4b590e1b8dc9e1b0ce3b1
  TARGET_PR: '16'
  TARGET_HEAD: 7e4b5fad6e0d0d95ddd6c58015a787fb201d8661
  PATCH_XZ_SHA256: ee2f747be4f6ff69aacd11f40cab052100fb71ede36fe06288057ebe0a20e5bd
  PATCH_RAW_SHA256: 90fb6b97802492d633e4f688f39d6a56f3cea8d28c88047cfabb17ebc4b3a2bb
  TARGET_TREE: a3e3025fb0487ae25b8c1467b2ac707321e3f0fd

jobs:
  publish:
    name: Atomically publish approved URL-scanner correction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live Draft PR identities
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PUBLISHER_PR) });
            const { data: target } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR) });
            const failures = [];
            if (publisher.state !== 'open' || !publisher.draft || publisher.head.ref !== process.env.PUBLISHER_BRANCH || publisher.head.sha !== process.env.PUBLISHER_HEAD) failures.push(`publisher=${publisher.state}/${publisher.draft}/${publisher.head.ref}/${publisher.head.sha}`);
            if (target.state !== 'open' || !target.draft || target.head.sha !== process.env.TARGET_HEAD) failures.push(`target=${target.state}/${target.draft}/${target.head.sha}`);
            if (failures.length) core.setFailed(`Publication start gate failed: ${failures.join(', ')}`);

      - name: Checkout exact publisher head without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISHER_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct and verify approved correction
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.b64 <<'EOF'

EOF
          base64 -d /tmp/patch.b64 > /tmp/patch.xz
          test "$(wc -c < /tmp/patch.xz)" = '2304'
          echo "$PATCH_XZ_SHA256  /tmp/patch.xz" | sha256sum -c -
          xz -dc /tmp/patch.xz > /tmp/patch.diff
          test "$(wc -c < /tmp/patch.diff)" = '6477'
          echo "$PATCH_RAW_SHA256  /tmp/patch.diff" | sha256sum -c -
          git apply --check /tmp/patch.diff
          git apply --index /tmp/patch.diff
          test "$(git diff --cached --name-only)" = '.github/scripts/wos01a/scan-bootstrap.mjs'
          test "$(git write-tree)" = "$TARGET_TREE"
          node --check .github/scripts/wos01a/scan-bootstrap.mjs
          node .github/scripts/wos01a/scan-bootstrap.mjs --self-test
          git diff --cached --check
          git config user.name 'WorkOS Implementation Controller'
          git config user.email 'controller@users.noreply.github.com'
          git commit -m 'ci: converge URL scanner tokenization'
          test "$(git rev-parse HEAD^)" = "$PUBLISHER_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"

      - name: Revalidate exact-old-head lease immediately before publication
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PUBLISHER_PR) });
            const { data: target } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR) });
            if (publisher.state !== 'open' || !publisher.draft || publisher.head.ref !== process.env.PUBLISHER_BRANCH || publisher.head.sha !== process.env.PUBLISHER_HEAD) core.setFailed(`PR #18 moved before publication: ${publisher.head.sha}`);
            if (target.state !== 'open' || !target.draft || target.head.sha !== process.env.TARGET_HEAD) core.setFailed(`PR #16 moved before publication: ${target.head.sha}`);

      - name: Publish exact correction to existing PR18 branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push --force-with-lease=refs/heads/${PUBLISHER_BRANCH}:${PUBLISHER_HEAD} "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/${PUBLISHER_BRANCH}

      - name: Verify published target tree and protected PR16
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PUBLISHER_PR) });
            const { data: target } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR) });
            if (publisher.head.sha === process.env.PUBLISHER_HEAD) core.setFailed('PR #18 did not advance');
            const { data: commit } = await github.rest.git.getCommit({ owner: context.repo.owner, repo: context.repo.repo, commit_sha: publisher.head.sha });
            if (commit.tree.sha !== process.env.TARGET_TREE) core.setFailed(`Unexpected published tree: ${commit.tree.sha}`);
            if (target.head.sha !== process.env.TARGET_HEAD) core.setFailed(`PR #16 moved unexpectedly: ${target.head.sha}`);
            core.info(`Published PR #18 head ${publisher.head.sha} tree ${commit.tree.sha}`);
