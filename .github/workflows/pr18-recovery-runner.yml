name: PR18 Publish Credential-Boundary Correction + WOS-01A Acceptance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pr18-recovery-runner.yml'

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: pr18-credential-boundary-publication
  cancel-in-progress: false

env:
  PUBLISHER_PR: '18'
  PUBLISHER_BRANCH: controller/wos01a-actions-publisher
  OLD_PUBLISHER_HEAD: 5a14fd61536cc3f49296dd5fdf1fc1e806c7dfbc
  TARGET_PUBLISHER_TREE: d17865ed4d5279648a76ace5b8c54a7e05dd86e7
  TARGET_PR: '16'
  TARGET_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
  TARGET_HEAD: 7e4b5fad6e0d0d95ddd6c58015a787fb201d8661
  WOS00_ACCEPTED_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  REFERENCE_REPOSITORY: APReddy-AutoBotz/Boundaryless-WorkOS
  REFERENCE_COMMIT: f2de1d85126f5d64f0e2e21b085b0303ca1d8417
  REFERENCE_TREE: fdaa5d92854d378dae1c6146a8f09c7f34f8c273

jobs:
  publish-and-verify:
    name: Publish exact two-file correction and verify WOS-01A acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Verify live Draft PR leases before any write
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PUBLISHER_PR) });
            const { data: target } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR) });
            const failures = [];
            if (publisher.state !== 'open' || !publisher.draft || publisher.head.ref !== process.env.PUBLISHER_BRANCH || publisher.head.sha !== process.env.OLD_PUBLISHER_HEAD) failures.push(`publisher=${publisher.state}/${publisher.draft}/${publisher.head.ref}/${publisher.head.sha}`);
            if (target.state !== 'open' || !target.draft || target.head.ref !== process.env.TARGET_BRANCH || target.head.sha !== process.env.TARGET_HEAD) failures.push(`target=${target.state}/${target.draft}/${target.head.ref}/${target.head.sha}`);
            if (target.base.ref !== 'main' || target.base.sha !== process.env.WOS00_ACCEPTED_BASE) failures.push(`target.base=${target.base.ref}/${target.base.sha}`);
            if (failures.length) core.setFailed(`Publication start gate failed: ${failures.join(', ')}`);

      - name: Checkout exact old publisher head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OLD_PUBLISHER_HEAD }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct and verify exact Codex correction
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.xz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/patch.xz.b64 > /tmp/patch.xz
          test "$(wc -c < /tmp/patch.xz | tr -d ' ')" = "3456"
          echo "a711b8e31623d1c47bd1ded7e32d020067909ca097d18fd8a545ebb9f2e4501d  /tmp/patch.xz" | sha256sum -c -
          xz -dc /tmp/patch.xz > /tmp/patch.diff
          test "$(wc -c < /tmp/patch.diff | tr -d ' ')" = "14012"
          echo "c0010c3e8976086d6cc8fffbe65c48ca768810074917ae7b8f0a1cdac990725d  /tmp/patch.diff" | sha256sum -c -
          git -C controller apply --index --binary /tmp/patch.diff
          git -C controller diff --cached --check
          test "$(git -C controller diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          test "$(git -C controller diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/scripts/wos01a/apply-final-neutralization.mjs' '.github/scripts/wos01a/scan-bootstrap.mjs' | sort)"
          test "$(wc -c < controller/.github/scripts/wos01a/apply-final-neutralization.mjs | tr -d ' ')" = "6294"
          echo "88d5ee852ae525d19e523cdcd02cb6b5f9220b121878b58b01d46b9d373810b0  controller/.github/scripts/wos01a/apply-final-neutralization.mjs" | sha256sum -c -
          test "$(git -C controller hash-object .github/scripts/wos01a/apply-final-neutralization.mjs)" = "67c3735e95aa05eb6cde4c63bb46e909b8336100"
          test "$(wc -c < controller/.github/scripts/wos01a/scan-bootstrap.mjs | tr -d ' ')" = "14668"
          echo "aa5483c814d98e1c203faa2ce59fff36c482de5bbd6fe766066a6c8bcd097419  controller/.github/scripts/wos01a/scan-bootstrap.mjs" | sha256sum -c -
          test "$(git -C controller hash-object .github/scripts/wos01a/scan-bootstrap.mjs)" = "afc6831709399f8af02cd3c0790f08f67de1ed7f"
          test "$(git -C controller write-tree)" = "$TARGET_PUBLISHER_TREE"
          node --check controller/.github/scripts/wos01a/scan-bootstrap.mjs
          node --check controller/.github/scripts/wos01a/apply-final-neutralization.mjs
          node controller/.github/scripts/wos01a/scan-bootstrap.mjs --self-test

      - name: Commit exact corrected tree locally
        id: corrected
        shell: bash
        run: |
          set -euo pipefail
          git -C controller config user.name "WorkOS Build Controller"
          git -C controller config user.email "actions@users.noreply.github.com"
          git -C controller config core.hooksPath /dev/null
          git -C controller commit -m "ci: bound synthetic test credentials"
          test "$(git -C controller rev-parse HEAD^)" = "$OLD_PUBLISHER_HEAD"
          test "$(git -C controller rev-parse HEAD^{tree})" = "$TARGET_PUBLISHER_TREE"
          echo "sha=$(git -C controller rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Revalidate live leases immediately before publication
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PUBLISHER_PR) });
            const { data: target } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR) });
            if (publisher.head.sha !== process.env.OLD_PUBLISHER_HEAD || publisher.state !== 'open' || !publisher.draft || publisher.head.ref !== process.env.PUBLISHER_BRANCH) core.setFailed(`PR #18 lease moved: ${publisher.head.sha}`);
            if (target.head.sha !== process.env.TARGET_HEAD || target.state !== 'open' || !target.draft || target.head.ref !== process.env.TARGET_BRANCH || target.base.sha !== process.env.WOS00_ACCEPTED_BASE) core.setFailed(`PR #16 lease moved: ${target.head.sha}/${target.base.sha}`);

      - name: Publish exact fast-forward to existing PR18 branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C controller -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force-with-lease="refs/heads/$PUBLISHER_BRANCH:$OLD_PUBLISHER_HEAD" \
            origin "HEAD:refs/heads/$PUBLISHER_BRANCH"
          unset auth

      - name: Verify published PR18 head and exact tree
        id: published
        uses: actions/github-script@v7
        env:
          NEW_HEAD: ${{ steps.corrected.outputs.sha }}
        with:
          script: |
            const expected = process.env.NEW_HEAD;
            let publisher;
            for (let i = 0; i < 12; i++) {
              ({ data: publisher } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PUBLISHER_PR) }));
              if (publisher.head.sha === expected) break;
              await new Promise(r => setTimeout(r, 2500));
            }
            if (publisher.head.sha !== expected) core.setFailed(`Published head mismatch after retries: ${publisher.head.sha} expected ${expected}`);
            const { data: commit } = await github.rest.git.getCommit({ owner: context.repo.owner, repo: context.repo.repo, commit_sha: expected });
            if (commit.tree.sha !== process.env.TARGET_PUBLISHER_TREE) core.setFailed(`Published tree mismatch: ${commit.tree.sha}`);
            core.setOutput('head', expected);

      - name: Checkout exact protected WOS-01A Draft branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: workos
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned authorized reference read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REFERENCE_REPOSITORY }}
          ref: ${{ env.REFERENCE_COMMIT }}
          path: reference
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reference/package-lock.json

      - name: Verify immutable identities and credential isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "${{ steps.corrected.outputs.sha }}"
          test "$(git -C controller rev-parse HEAD^{tree})" = "$TARGET_PUBLISHER_TREE"
          test "$(git -C workos rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git -C reference rev-parse HEAD)" = "$REFERENCE_COMMIT"
          test "$(git -C reference rev-parse HEAD^{tree})" = "$REFERENCE_TREE"
          test -z "$(git -C reference status --porcelain)"
          git -C workos merge-base --is-ancestor "$WOS00_ACCEPTED_BASE" HEAD
          for repo in controller workos reference; do
            test -z "$(git -C "$repo" config --local --get-regexp 'http\..*\.extraheader|credential\..*|credential.helper' || true)"
            ! git -C "$repo" remote get-url origin | grep -Eq 'https://[^/@]+@'
          done

      - name: Verify exact corrected publisher syntax and adversarial fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --check controller/.github/scripts/wos01a-source-bootstrap.mjs
          node --check controller/.github/scripts/wos01a/scan-bootstrap.mjs
          node --check controller/.github/scripts/wos01a/apply-final-neutralization.mjs
          node --check controller/.github/scripts/wos01a/verify-baseline.mjs
          node controller/.github/scripts/wos01a-source-bootstrap.mjs --self-test-changed-paths
          node controller/.github/scripts/wos01a/scan-bootstrap.mjs --self-test
          ruby -e "require 'yaml'; YAML.parse_file('controller/.github/workflows/wos01a-source-bootstrap-publisher.yml'); puts 'yaml passed'"

      - name: Apply bounded final neutralization
        shell: bash
        run: |
          set -euo pipefail
          node controller/.github/scripts/wos01a/apply-final-neutralization.mjs \
            controller/.github/scripts/wos01a-source-bootstrap.mjs
          node --check controller/.github/scripts/wos01a-source-bootstrap.mjs

      - name: Run authoritative exact-head WOS-01A acceptance path
        shell: bash
        run: |
          set -euo pipefail
          node controller/.github/scripts/wos01a-source-bootstrap.mjs reference workos controller | tee /tmp/wos01a-result.json
          node controller/.github/scripts/wos01a-source-bootstrap.mjs --verify-result-digest workos

      - name: Final live-head revalidation
        uses: actions/github-script@v7
        env:
          NEW_HEAD: ${{ steps.corrected.outputs.sha }}
        with:
          script: |
            const { data: publisher } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PUBLISHER_PR) });
            const { data: target } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR) });
            if (publisher.head.sha !== process.env.NEW_HEAD || publisher.state !== 'open' || !publisher.draft) core.setFailed(`PR #18 moved during acceptance: ${publisher.head.sha}`);
            if (target.head.sha !== process.env.TARGET_HEAD || target.state !== 'open' || !target.draft) core.setFailed(`PR #16 moved during acceptance: ${target.head.sha}`);
