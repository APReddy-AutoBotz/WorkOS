name: PR26 Exact Browser-Isolation Recovery

on:
  push:
    branches:
      - controller/pr26-isolation-recovery-20260829
    paths:
      - '.github/workflows/pr18-recovery-runner.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: pr26-exact-browser-isolation-recovery
  cancel-in-progress: false

env:
  CONTROLLER_PR: '26'
  CONTROLLER_BRANCH: controller/wos01a-clean-runtime-acceptance-v2
  OLD_HEAD: cdef93344825b23e459cc384e27a67e346e24c0e
  EXPECTED_TREE: da84d44f9fce28faf3fe85acaaaf82038e19b357
  PRODUCT_PR: '27'
  PRODUCT_BRANCH: codex/wos01a-acceptance-closure
  PRODUCT_HEAD: 60a6a8da861f505c17f043c7439bdd40df992b50
  PARENT_PR: '16'
  PARENT_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
  PARENT_HEAD: 590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60
  ACCEPTED_WOS00_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  EXPECTED_MAIN_HEAD: 44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42
  RECOVERY_COMMENT_ID: '5463459529'
  EXPECTED_LOCAL_COMMIT: b6ac73233fce0012fed380d878ee2490507f635f
  EXPECTED_GZIP_BYTES: '6426'
  EXPECTED_GZIP_SHA256: 4afb1b2fcf6d1d02dbf6dd9a7354ea92fa117898b9fc73283e7fe26add18705f
  EXPECTED_PATCH_BYTES: '24120'
  EXPECTED_PATCH_SHA256: 6426e6642e37dc61eb4a2afef8b490f3881e061c06d1b0028946d8dd915aabdd

jobs:
  recover:
    name: Verify and publish exact recovered controller tree
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify live authority and materialize the exact Codex payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const failures = [];

            const {data: controller} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.CONTROLLER_PR),
            });
            const {data: product} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PRODUCT_PR),
            });
            const {data: parent} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PARENT_PR),
            });
            const {data: main} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });

            if (controller.state !== 'open' || !controller.draft) failures.push(`controller.lifecycle=${controller.state}/${controller.draft}`);
            if (controller.head.ref !== process.env.CONTROLLER_BRANCH || controller.head.sha !== process.env.OLD_HEAD) failures.push(`controller.head=${controller.head.ref}/${controller.head.sha}`);
            if (controller.base.ref !== 'main' || controller.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`controller.base=${controller.base.ref}/${controller.base.sha}`);

            if (product.state !== 'open' || !product.draft) failures.push(`product.lifecycle=${product.state}/${product.draft}`);
            if (product.head.ref !== process.env.PRODUCT_BRANCH || product.head.sha !== process.env.PRODUCT_HEAD) failures.push(`product.head=${product.head.ref}/${product.head.sha}`);
            if (product.base.ref !== process.env.PARENT_BRANCH || product.base.sha !== process.env.PARENT_HEAD) failures.push(`product.base=${product.base.ref}/${product.base.sha}`);

            if (parent.state !== 'open' || !parent.draft) failures.push(`parent.lifecycle=${parent.state}/${parent.draft}`);
            if (parent.head.ref !== process.env.PARENT_BRANCH || parent.head.sha !== process.env.PARENT_HEAD) failures.push(`parent.head=${parent.head.ref}/${parent.head.sha}`);
            if (parent.base.ref !== 'main' || parent.base.sha !== process.env.ACCEPTED_WOS00_BASE) failures.push(`parent.base=${parent.base.ref}/${parent.base.sha}`);
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);

            const {data: comment} = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.RECOVERY_COMMENT_ID),
            });
            const body = String(comment.body || '');
            if (!['chatgpt-codex-connector[bot]', 'chatgpt-codex-connector'].includes(comment.user?.login)) {
              failures.push(`comment.author=${comment.user?.login || 'missing'}`);
            }
            if (!String(comment.issue_url || '').endsWith(`/issues/${process.env.CONTROLLER_PR}`)) failures.push(`comment.issue=${comment.issue_url}`);
            for (const required of [process.env.OLD_HEAD, process.env.EXPECTED_LOCAL_COMMIT, process.env.EXPECTED_TREE, process.env.EXPECTED_GZIP_SHA256, process.env.EXPECTED_PATCH_SHA256]) {
              if (!body.includes(required)) failures.push(`comment missing ${required}`);
            }

            const match = body.match(/base64 -d > controller\.patch\.gz <<'BASE64'\r?\n([A-Za-z0-9+/=\r\n]+?)\r?\nBASE64/);
            if (!match) failures.push('exact recovery Base64 block was not found');
            if (failures.length) {
              core.setFailed(`PR26 recovery start gate failed: ${failures.join(', ')}`);
              return;
            }

            const encoded = match[1].replace(/\s+/g, '');
            if (!/^[A-Za-z0-9+/]+={0,2}$/.test(encoded) || encoded.length % 4 !== 0) {
              core.setFailed('Recovery payload is not canonical Base64');
              return;
            }
            const gzip = Buffer.from(encoded, 'base64');
            const digest = crypto.createHash('sha256').update(gzip).digest('hex');
            if (gzip.length !== Number(process.env.EXPECTED_GZIP_BYTES) || digest !== process.env.EXPECTED_GZIP_SHA256) {
              core.setFailed(`Recovery gzip mismatch bytes=${gzip.length} sha256=${digest}`);
              return;
            }
            const output = path.join(process.env.RUNNER_TEMP, 'controller.patch.gz');
            fs.writeFileSync(output, gzip, {mode: 0o600});
            core.setOutput('gzip_path', output);
            core.setOutput('gzip_sha256', digest);

      - name: Checkout exact old controller head with bounded write credential
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OLD_HEAD }}
          path: controller
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and independently verify the exact recovered target tree
        id: apply
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OLD_HEAD"
          test -z "$(git status --porcelain)"

          gzip -dc "$RUNNER_TEMP/controller.patch.gz" > "$RUNNER_TEMP/controller.patch"
          test "$(wc -c < "$RUNNER_TEMP/controller.patch" | tr -d '[:space:]')" = "$EXPECTED_PATCH_BYTES"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$RUNNER_TEMP/controller.patch" | sha256sum -c -

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --committer-date-is-author-date "$RUNNER_TEMP/controller.patch"

          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"

          git diff --name-only "$OLD_HEAD..HEAD" | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths.txt"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'PATHS'
          .github/scripts/verify-wos01a-controller-v2.mjs
          .github/scripts/wos01a-clean-runtime-matrix-v2.sh
          .github/workflows/wos01a-clean-runtime-acceptance-v2.yml
          PATHS
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"

          verify_file() {
            local file="$1" bytes="$2" sha256="$3" blob="$4"
            test "$(wc -c < "$file" | tr -d '[:space:]')" = "$bytes"
            printf '%s  %s\n' "$sha256" "$file" | sha256sum -c -
            test "$(git hash-object "$file")" = "$blob"
          }
          verify_file '.github/scripts/verify-wos01a-controller-v2.mjs' '17613' '765a36718b0884d1b2532612ab043ce2929e1ebd4a6dc53608bbab657c41e4c9' 'ae6b14b5c9a4afe9e35cf70e1dbccd47d4b8da0c'
          verify_file '.github/scripts/wos01a-clean-runtime-matrix-v2.sh' '16296' 'a24b5d8c04290cc808efe184df5528bde3a1cb4f487e746e1e6de56ba82c57c9' '73b0e98a45351432d8eca762e22f6133b0ba2bd7'
          verify_file '.github/workflows/wos01a-clean-runtime-acceptance-v2.yml' '22332' 'ac1c99806ae5913cbbe4c04ca80d8c8ce393ca1683e485efdc060a7d1a054fd2' '3efa09ba52a6b87fc690346f2724ab07db4a4046'

          node --check .github/scripts/verify-wos01a-controller-v2.mjs
          node .github/scripts/verify-wos01a-controller-v2.mjs
          bash -n .github/scripts/wos01a-clean-runtime-matrix-v2.sh
          ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/wos01a-clean-runtime-acceptance-v2.yml'); puts 'YAML syntax passed'"
          git diff --check "$OLD_HEAD..HEAD"

          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Revalidate all live leases immediately before publication
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const {data: controller} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.CONTROLLER_PR)});
            const {data: product} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PRODUCT_PR)});
            const {data: parent} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PARENT_PR)});
            const {data: main} = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'});
            if (controller.state !== 'open' || !controller.draft || controller.head.ref !== process.env.CONTROLLER_BRANCH || controller.head.sha !== process.env.OLD_HEAD || controller.base.ref !== 'main' || controller.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`controller=${controller.state}/${controller.draft}/${controller.head.ref}/${controller.head.sha}/${controller.base.ref}/${controller.base.sha}`);
            if (product.state !== 'open' || !product.draft || product.head.ref !== process.env.PRODUCT_BRANCH || product.head.sha !== process.env.PRODUCT_HEAD || product.base.ref !== process.env.PARENT_BRANCH || product.base.sha !== process.env.PARENT_HEAD) failures.push(`product=${product.state}/${product.draft}/${product.head.ref}/${product.head.sha}/${product.base.ref}/${product.base.sha}`);
            if (parent.state !== 'open' || !parent.draft || parent.head.ref !== process.env.PARENT_BRANCH || parent.head.sha !== process.env.PARENT_HEAD || parent.base.ref !== 'main' || parent.base.sha !== process.env.ACCEPTED_WOS00_BASE) failures.push(`parent=${parent.state}/${parent.draft}/${parent.head.ref}/${parent.head.sha}/${parent.base.ref}/${parent.base.sha}`);
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);
            if (failures.length) core.setFailed(`Final publication lease failed: ${failures.join(', ')}`);

      - name: Fast-forward existing PR26 branch under exact-old-head lease
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/${CONTROLLER_BRANCH}:${OLD_HEAD}" origin "HEAD:refs/heads/${CONTROLLER_BRANCH}"

      - name: Verify published ref and record recovery outcome
        env:
          NEW_HEAD: ${{ steps.apply.outputs.head }}
          NEW_TREE: ${{ steps.apply.outputs.tree }}
        uses: actions/github-script@v7
        with:
          script: |
            const {data: controller} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.CONTROLLER_PR)});
            if (controller.state !== 'open' || !controller.draft || controller.head.ref !== process.env.CONTROLLER_BRANCH || controller.head.sha !== process.env.NEW_HEAD) {
              core.setFailed(`Published PR26 mismatch: ${controller.state}/${controller.draft}/${controller.head.ref}/${controller.head.sha}`);
              return;
            }
            const {data: commit} = await github.rest.git.getCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: process.env.NEW_HEAD});
            if (commit.tree.sha !== process.env.EXPECTED_TREE || process.env.NEW_TREE !== process.env.EXPECTED_TREE) {
              core.setFailed(`Published tree mismatch commit=${commit.tree.sha} local=${process.env.NEW_TREE}`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.CONTROLLER_PR),
              body: `PR26 exact recovery published successfully.\n\n- Old head: \`${process.env.OLD_HEAD}\`\n- New head: \`${process.env.NEW_HEAD}\`\n- Exact tree: \`${process.env.EXPECTED_TREE}\`\n- Codex recovery source: comment ${process.env.RECOVERY_COMMENT_ID}\n- Gzip SHA-256: \`${process.env.EXPECTED_GZIP_SHA256}\`\n- Patch SHA-256: \`${process.env.EXPECTED_PATCH_SHA256}\`\n\nThe existing branch was advanced under an exact-old-head force-with-lease guard. PRs #26, #27 and #16 remain Draft; no product branch, main, deployment, provider, secret, customer data or reference repository was changed.`,
            });
