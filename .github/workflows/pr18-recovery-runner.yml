name: PR18 Guarded Recovery Runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pr18-recovery-runner.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: pr18-guarded-recovery-runner
  cancel-in-progress: false

env:
  TARGET_BRANCH: controller/wos01a-actions-publisher
  EXPECTED_TARGET_HEAD: 5885b294963a91289e1d1241c0a5e0b0cfe41cec
  EXPECTED_TARGET_PARENT: 5932d3135f47612f9b7fa6dbd9c577207009e6b7
  EXPECTED_TARGET_TREE: 8958ebbc66ec4909aa7bec4fddab1363897e93a7
  RAW_PATCH_SHA256: d5822d2575c4bf59f8c4de0c1d8886db1d6b98ce85cdd9ca423a0cfd5b100eca
  XZ_PATCH_SHA256: 198cca7352008f88e357f1229fa102729c609503a3db395327cefebeb7895e8a
  PR_NUMBER: '18'

jobs:
  recover:
    name: Publish exact reviewed PR18 target tree
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify live PR #18 start gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const failures = [];
            if (pr.state !== 'open') failures.push(`state=${pr.state}`);
            if (!pr.draft) failures.push('PR is not Draft');
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`head.ref=${pr.head.ref}`);
            if (pr.head.sha !== process.env.EXPECTED_TARGET_HEAD) failures.push(`head.sha=${pr.head.sha}`);
            if (pr.base.ref !== 'main') failures.push(`base.ref=${pr.base.ref}`);
            if (failures.length) core.setFailed(`PR #18 recovery start gate failed: ${failures.join(', ')}`);

      - name: Checkout exact PR #18 branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact branch ancestry and temporary-helper-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_PARENT"
          test "$(git diff --name-only "$EXPECTED_TARGET_PARENT" HEAD)" = ".github/workflows/wos01a-pr18-patch-recovery.yml"
          test -z "$(git status --porcelain)"
          test -z "$(git config --get credential.helper || true)"
          test -z "$(git config --get-all http.https://github.com/.extraheader || true)"
          ! git remote get-url origin | grep -Eq 'x-access-token|oauth2|github_pat|ghp_'

      - name: Decode, verify and apply canonical three-file correction
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wos01a.patch.xz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/wos01a.patch.xz.b64 > /tmp/wos01a.patch.xz
          test "$(sha256sum /tmp/wos01a.patch.xz | cut -d' ' -f1)" = "$XZ_PATCH_SHA256"
          xz -dc /tmp/wos01a.patch.xz > /tmp/wos01a.patch
          test "$(sha256sum /tmp/wos01a.patch | cut -d' ' -f1)" = "$RAW_PATCH_SHA256"
          git apply --binary --index /tmp/wos01a.patch
          git rm .github/workflows/wos01a-pr18-patch-recovery.yml
          git diff --cached --check
          cat > /tmp/expected-paths <<'PATHS'
          .github/scripts/wos01a-source-bootstrap.mjs
          .github/scripts/wos01a/scan-bootstrap.mjs
          .github/workflows/wos01a-pr18-patch-recovery.yml
          .github/workflows/wos01a-source-bootstrap-publisher.yml
          PATHS
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          test "$(git write-tree)" = "$EXPECTED_TARGET_TREE"

      - name: Commit exact target tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WorkOS Implementation Controller"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci: secure WOS-01A publisher execution gates"
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TARGET_TREE"
          echo "new_head=$new_head" >> "$GITHUB_OUTPUT"

      - name: Re-verify Draft PR immediately before publication
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const failures = [];
            if (pr.state !== 'open') failures.push(`state=${pr.state}`);
            if (!pr.draft) failures.push('PR is not Draft');
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`head.ref=${pr.head.ref}`);
            if (pr.head.sha !== process.env.EXPECTED_TARGET_HEAD) failures.push(`head.sha=${pr.head.sha}`);
            if (pr.base.ref !== 'main') failures.push(`base.ref=${pr.base.ref}`);
            if (failures.length) core.setFailed(`PR #18 moved before recovery publication: ${failures.join(', ')}`);

      - name: Publish with exact-old-head lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_HEAD: ${{ steps.commit.outputs.new_head }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.https://github.com/.extraheader="$auth_header" ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_TARGET_HEAD"
          git -c http.https://github.com/.extraheader="$auth_header" push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          published="$(git -c http.https://github.com/.extraheader="$auth_header" ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$published" = "$NEW_HEAD"

      - name: Record verified PR #18 publication
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### PR #18 guarded correction published

            - Exact old head: \`${process.env.EXPECTED_TARGET_HEAD}\`
            - Exact published head: \`${{ steps.commit.outputs.new_head }}\`
            - Exact published tree: \`${process.env.EXPECTED_TARGET_TREE}\`
            - Canonical patch SHA-256: \`${process.env.RAW_PATCH_SHA256}\`
            - Temporary branch helper removed; PR #16 was not mutated or executed.

            PR #18 remains Draft. Fresh exact-head CI/check evidence and independent review remain mandatory.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });
