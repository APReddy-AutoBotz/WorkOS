name: PR18 Guarded Recovery Runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pr18-recovery-runner.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: pr18-guarded-recovery-runner
  cancel-in-progress: false

env:
  TARGET_BRANCH: controller/wos01a-actions-publisher
  EXPECTED_TARGET_HEAD: b5d1febf6b043d182c1f9002e162a9a7bbf80465
  EXPECTED_TARGET_TREE: 3c6c52dc2ed77f185de0760fac07a2efb108c266
  TARGET_FILE_1: .github/scripts/wos01a-source-bootstrap.mjs
  TARGET_BLOB_1: db79b732e1b99559c0998858b2438acee43d9019
  TARGET_FILE_2: .github/scripts/wos01a/scan-bootstrap.mjs
  TARGET_BLOB_2: 7f1200024566bcd681676421c234c1eb89612a9c
  RAW_PATCH_SHA256: ed8c753d03fc3105b416f4df1cf1dbd97b1fa4c73a35ac51df40a2cb05a3de90
  XZ_PATCH_SHA256: 060fe14b54232210748176dfe618db2803f17cea554c88a47e379c34e1fac31c
  PR_NUMBER: '18'

jobs:
  recover:
    name: Publish exact retained-test dependency correction
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify live PR #18 start gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PR_NUMBER) });
            const failures = [];
            if (pr.state !== 'open') failures.push(`state=${pr.state}`);
            if (!pr.draft) failures.push('not Draft');
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`head.ref=${pr.head.ref}`);
            if (pr.head.sha !== process.env.EXPECTED_TARGET_HEAD) failures.push(`head.sha=${pr.head.sha}`);
            if (pr.base.ref !== 'main') failures.push(`base.ref=${pr.base.ref}`);
            if (failures.length) core.setFailed(`PR #18 recovery guard failed: ${failures.join(', ')}`);

      - name: Checkout exact PR #18 branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TARGET_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Decode and verify approved two-file correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test -z "$(git status --porcelain)"
          cat > /tmp/wos01a.patch.xz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/wos01a.patch.xz.b64 > /tmp/wos01a.patch.xz
          test "$(sha256sum /tmp/wos01a.patch.xz | cut -d' ' -f1)" = "$XZ_PATCH_SHA256"
          xz -dc /tmp/wos01a.patch.xz > /tmp/wos01a.patch
          test "$(sha256sum /tmp/wos01a.patch | cut -d' ' -f1)" = "$RAW_PATCH_SHA256"
          git apply --binary --index /tmp/wos01a.patch
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$TARGET_FILE_1"
          test "${changed[1]}" = "$TARGET_FILE_2"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE_1")" = "$TARGET_BLOB_1"
          test "$(git hash-object "$TARGET_FILE_2")" = "$TARGET_BLOB_2"

      - name: Materialize exact Git objects and atomically fast-forward existing PR #18 branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const oldHead = process.env.EXPECTED_TARGET_HEAD;
            const targetTree = process.env.EXPECTED_TARGET_TREE;
            const targets = [
              [process.env.TARGET_FILE_1, process.env.TARGET_BLOB_1],
              [process.env.TARGET_FILE_2, process.env.TARGET_BLOB_2],
            ];
            const entries = [];
            for (const [targetPath, expectedBlob] of targets) {
              const content = fs.readFileSync(targetPath).toString('base64');
              const { data: blob } = await github.rest.git.createBlob({ owner, repo, content, encoding: 'base64' });
              if (blob.sha !== expectedBlob) throw new Error(`blob mismatch ${targetPath}: ${blob.sha}`);
              entries.push({ path: targetPath, mode: '100644', type: 'blob', sha: blob.sha });
            }
            const { data: parent } = await github.rest.git.getCommit({ owner, repo, commit_sha: oldHead });
            const { data: tree } = await github.rest.git.createTree({ owner, repo, base_tree: parent.tree.sha, tree: entries });
            if (tree.sha !== targetTree) throw new Error(`tree mismatch ${tree.sha}`);
            const { data: commit } = await github.rest.git.createCommit({ owner, repo, message: 'ci: close WOS-01A retained test document dependencies', tree: tree.sha, parents: [oldHead] });

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const failures = [];
            if (pr.state !== 'open') failures.push(`state=${pr.state}`);
            if (!pr.draft) failures.push('not Draft');
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`head.ref=${pr.head.ref}`);
            if (pr.head.sha !== oldHead) failures.push(`head.sha=${pr.head.sha}`);
            if (failures.length) throw new Error(`PR moved before publication: ${failures.join(', ')}`);

            await github.rest.git.updateRef({ owner, repo, ref: `heads/${process.env.TARGET_BRANCH}`, sha: commit.sha, force: false });
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${process.env.TARGET_BRANCH}` });
            if (ref.object.sha !== commit.sha) throw new Error(`publication mismatch ${ref.object.sha}`);
            core.notice(`Published PR #18 ${oldHead} -> ${commit.sha}, tree ${tree.sha}`);

      - name: Record publication checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PR_NUMBER) });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `### WOS-01A publisher correction published\n\n- Previous head: \`${process.env.EXPECTED_TARGET_HEAD}\`\n- Published head: \`${pr.head.sha}\`\n- Exact tree: \`${process.env.EXPECTED_TARGET_TREE}\`\n- Scope: retained-test dependency closure and context-safe path mapping.\n\nPR #18 remains Draft. Exact-head acceptance verification and fresh independent confirmation review remain mandatory before any merge.`
            });
