name: PR18 Guarded Recovery Runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pr18-recovery-runner.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: pr18-guarded-recovery-runner
  cancel-in-progress: false

env:
  TARGET_BRANCH: controller/wos01a-actions-publisher
  EXPECTED_TARGET_HEAD: 613aec9c70d806d8f45b87d6757b321ef282cf1d
  EXPECTED_TARGET_TREE: ec272c67f2a038b06fc24a1c2db2afd6f6572dc4
  TARGET_FILE: .github/scripts/wos01a-source-bootstrap.mjs
  TARGET_BLOB: fbb44f914a59b3fe628455360033bd0d1c77d97f
  RAW_PATCH_SHA256: c8a60d29847f750b7cf900a96c1aedfabab492a6320e04264d8fcb0790c59879
  XZ_PATCH_SHA256: 8f9c3d7e633e5ee5f6637385469216436353916fb0600da176dbb8ca1483d74e
  PR_NUMBER: '18'
  WOS01_PR_NUMBER: '16'
  WOS01_TARGET_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
  WOS01_EXPECTED_HEAD: 7e4b5fad6e0d0d95ddd6c58015a787fb201d8661
  WOS00_ACCEPTED_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  REFERENCE_REPOSITORY: APReddy-AutoBotz/Boundaryless-WorkOS
  REFERENCE_COMMIT: f2de1d85126f5d64f0e2e21b085b0303ca1d8417
  REFERENCE_TREE: fdaa5d92854d378dae1c6146a8f09c7f34f8c273

jobs:
  recover-and-verify:
    name: Publish and verify retained-test contract convergence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Verify live PR #18 start gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PR_NUMBER) });
            const failures = [];
            if (pr.state !== 'open') failures.push(`state=${pr.state}`);
            if (!pr.draft) failures.push('not Draft');
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`head.ref=${pr.head.ref}`);
            if (pr.head.sha !== process.env.EXPECTED_TARGET_HEAD) failures.push(`head.sha=${pr.head.sha}`);
            if (pr.base.ref !== 'main') failures.push(`base.ref=${pr.base.ref}`);
            if (failures.length) core.setFailed(`PR #18 recovery guard failed: ${failures.join(', ')}`);

      - name: Checkout exact PR #18 parent without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TARGET_HEAD }}
          path: publisher
          fetch-depth: 1
          persist-credentials: false

      - name: Decode and verify approved one-file correction
        shell: bash
        run: |
          set -euo pipefail
          cd publisher
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test -z "$(git status --porcelain)"
          cat > /tmp/wos01a.patch.xz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/wos01a.patch.xz.b64 > /tmp/wos01a.patch.xz
          test "$(sha256sum /tmp/wos01a.patch.xz | cut -d' ' -f1)" = "$XZ_PATCH_SHA256"
          xz -dc /tmp/wos01a.patch.xz > /tmp/wos01a.patch
          test "$(sha256sum /tmp/wos01a.patch | cut -d' ' -f1)" = "$RAW_PATCH_SHA256"
          git apply --binary --index /tmp/wos01a.patch
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET_FILE"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TARGET_TREE"
          test "$(git hash-object "$TARGET_FILE")" = "$TARGET_BLOB"

      - name: Materialize exact Git object and atomically fast-forward existing PR #18 branch
        id: publish
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const oldHead = process.env.EXPECTED_TARGET_HEAD;
            const content = fs.readFileSync(`publisher/${process.env.TARGET_FILE}`).toString('base64');
            const { data: blob } = await github.rest.git.createBlob({ owner, repo, content, encoding: 'base64' });
            if (blob.sha !== process.env.TARGET_BLOB) throw new Error(`blob mismatch ${blob.sha}`);
            const { data: parent } = await github.rest.git.getCommit({ owner, repo, commit_sha: oldHead });
            const { data: tree } = await github.rest.git.createTree({ owner, repo, base_tree: parent.tree.sha, tree: [{ path: process.env.TARGET_FILE, mode: '100644', type: 'blob', sha: blob.sha }] });
            if (tree.sha !== process.env.EXPECTED_TARGET_TREE) throw new Error(`tree mismatch ${tree.sha}`);
            const { data: commit } = await github.rest.git.createCommit({ owner, repo, message: 'ci: align retained configurable label contracts', tree: tree.sha, parents: [oldHead] });
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const failures = [];
            if (pr.state !== 'open') failures.push(`state=${pr.state}`);
            if (!pr.draft) failures.push('not Draft');
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`head.ref=${pr.head.ref}`);
            if (pr.head.sha !== oldHead) failures.push(`head.sha=${pr.head.sha}`);
            if (failures.length) throw new Error(`PR moved before publication: ${failures.join(', ')}`);
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${process.env.TARGET_BRANCH}`, sha: commit.sha, force: false });
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${process.env.TARGET_BRANCH}` });
            if (ref.object.sha !== commit.sha) throw new Error(`publication mismatch ${ref.object.sha}`);
            core.setOutput('new_head', commit.sha);
            core.setOutput('new_tree', tree.sha);
            core.notice(`Published PR #18 ${oldHead} -> ${commit.sha}, tree ${tree.sha}`);

      - name: Record publication checkpoint
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `### WOS-01A retained-test contract correction published\n\n- Previous head: \`${process.env.EXPECTED_TARGET_HEAD}\`\n- Published head: \`${{ steps.publish.outputs.new_head }}\`\n- Exact tree: \`${{ steps.publish.outputs.new_tree }}\`\n- Scope: deterministic configurable-label retained-test contract convergence only.\n\nThis workflow will now run read-only exact-head WOS-01A acceptance against the published controller revision. PR #18 remains Draft and PR #16 remains untouched.`
            });

      - name: Verify live PR #18 published head and PR #16 start state
        id: live_state
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisherPr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PR_NUMBER) });
            const { data: targetPr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.WOS01_PR_NUMBER) });
            const failures = [];
            if (publisherPr.state !== 'open' || !publisherPr.draft || publisherPr.head.ref !== process.env.TARGET_BRANCH || publisherPr.head.sha !== '${{ steps.publish.outputs.new_head }}') failures.push(`publisher=${publisherPr.state}/${publisherPr.draft}/${publisherPr.head.ref}/${publisherPr.head.sha}`);
            if (targetPr.state !== 'open' || !targetPr.draft || targetPr.head.ref !== process.env.WOS01_TARGET_BRANCH || targetPr.head.sha !== process.env.WOS01_EXPECTED_HEAD) failures.push(`target=${targetPr.state}/${targetPr.draft}/${targetPr.head.ref}/${targetPr.head.sha}`);
            if (targetPr.base.ref !== 'main') failures.push(`target.base.ref=${targetPr.base.ref}`);
            if (failures.length) core.setFailed(`Exact-head acceptance start gate failed: ${failures.join(', ')}`);
            core.setOutput('target_base_sha', targetPr.base.sha);

      - name: Checkout exact published PR #18 controller revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.publish.outputs.new_head }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact protected WOS-01A Draft branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WOS01_EXPECTED_HEAD }}
          path: workos
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned authorized reference read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REFERENCE_REPOSITORY }}
          ref: ${{ env.REFERENCE_COMMIT }}
          path: reference
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reference/package-lock.json

      - name: Verify immutable exact-head acceptance identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "${{ steps.publish.outputs.new_head }}"
          test "$(git -C controller rev-parse HEAD^{tree})" = "$EXPECTED_TARGET_TREE"
          test "$(git -C workos rev-parse HEAD)" = "$WOS01_EXPECTED_HEAD"
          test "$(git -C reference rev-parse HEAD)" = "$REFERENCE_COMMIT"
          test "$(git -C reference rev-parse HEAD^{tree})" = "$REFERENCE_TREE"
          test -z "$(git -C reference status --porcelain)"
          git -C controller merge-base --is-ancestor "$WOS00_ACCEPTED_BASE" HEAD
          git -C workos merge-base --is-ancestor "$WOS00_ACCEPTED_BASE" HEAD
          git -C controller cat-file -e "${{ steps.live_state.outputs.target_base_sha }}^{commit}"
          git -C controller merge-base --is-ancestor "$WOS00_ACCEPTED_BASE" "${{ steps.live_state.outputs.target_base_sha }}"

      - name: Assert package execution has no repository credential
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "$(git -C workos config --local --get-regexp 'http\..*\.extraheader|credential\..*|credential.helper' || true)"
          ! git -C workos remote get-url origin | grep -Eq 'https://[^/@]+@'

      - name: Apply bounded final neutralization to exact publisher code
        shell: bash
        run: |
          set -euo pipefail
          node controller/.github/scripts/wos01a/apply-final-neutralization.mjs controller/.github/scripts/wos01a-source-bootstrap.mjs

      - name: Materialize and verify complete WOS-01A package read-only
        shell: bash
        run: |
          set -euo pipefail
          node controller/.github/scripts/wos01a-source-bootstrap.mjs reference workos controller | tee /tmp/wos01a-result.json

      - name: Verify result digest without credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          node controller/.github/scripts/wos01a-source-bootstrap.mjs --verify-result-digest workos

      - name: Revalidate live heads after exact-head acceptance
        uses: actions/github-script@v7
        with:
          script: |
            const { data: publisherPr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PR_NUMBER) });
            const { data: targetPr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.WOS01_PR_NUMBER) });
            if (publisherPr.head.sha !== '${{ steps.publish.outputs.new_head }}') core.setFailed(`PR #18 moved during acceptance: ${publisherPr.head.sha}`);
            if (targetPr.head.sha !== process.env.WOS01_EXPECTED_HEAD) core.setFailed(`PR #16 moved during acceptance: ${targetPr.head.sha}`);

      - name: Comment exact-head acceptance success
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `### WOS-01A publisher exact-head acceptance PASS\n\n- Exact publisher head: \`${{ steps.publish.outputs.new_head }}\`\n- Exact publisher tree: \`${{ steps.publish.outputs.new_tree }}\`\n- Protected target head: \`${process.env.WOS01_EXPECTED_HEAD}\`\n- Pinned reference: \`${process.env.REFERENCE_REPOSITORY}@${process.env.REFERENCE_COMMIT}\`\n- Workflow run: \`${context.runId}\`\n\nThe complete materialization/result-digest path passed without publishing PR #16. Fresh independent exact-head confirmation review remains mandatory before any Ready/merge transition.`
            });

      - name: Comment fail-closed recovery or acceptance result
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `### WOS-01A publisher recovery / exact-head acceptance failed closed\n\nWorkflow \`${context.workflow}\` run \`${context.runId}\` failed before establishing a clean exact-head acceptance result. Inspect the real failing step/log and classify its root cause before any correction. PR #18 remains Draft and PR #16 must remain untouched.`
            });
