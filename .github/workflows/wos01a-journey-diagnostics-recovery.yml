name: WOS-01A Journey Diagnostics Publication Recovery

on:
  push:
    branches:
      - controller/wos01a-clean-runtime-acceptance-v2
    paths:
      - '.github/workflows/wos01a-journey-diagnostics-recovery.yml'

permissions:
  contents: write

concurrency:
  group: wos01a-journey-diagnostics-publication-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Publish bounded journey diagnostics correction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: controller/wos01a-clean-runtime-acceptance-v2
      EXPECTED_PARENT: 2c39f68521b159e35268385094c1c4502476e5db
      EXPECTED_ACCEPTANCE_BASE_BLOB: ca3566a31792fd5bb4222097e42493e68844bd51
      EXPECTED_TEST_BASE_BLOB: acbf8cc84870be49468c4e30987012ab3bca4986
      PATCH_GZIP_SHA256: 85779e98555a3e80d79aa734614a4e36b398eb4a354834cd36d028c82eae1ec5
      PATCH_SHA256: 56f56eefd86434b67d2329c8ebef257c9d11c6e3c0b9792a754bd93661264125
      EXPECTED_ACCEPTANCE_FINAL_BLOB: 551000fe2831e67719f72e947369b2bfa05922b5
      EXPECTED_TEST_FINAL_BLOB: caf8e294e6940254d44d92cf51c71adc60f575e3

    steps:
      - name: Checkout exact recovery trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify lease, apply patch and publish
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/wos01a-journey-diagnostics-recovery.yml'
          acceptance='.github/scripts/wos01a-browser-acceptance-v2.mjs'
          regression='.github/scripts/test-wos01a-browser-lifecycle-v2.mjs'

          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          trigger_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"
          test "$(git hash-object "$acceptance")" = "$EXPECTED_ACCEPTANCE_BASE_BLOB"
          test "$(git hash-object "$regression")" = "$EXPECTED_TEST_BASE_BLOB"

          base64 -d > /tmp/wos01a-journey-diagnostics.patch.gz <<'BASE64'

BASE64
          printf '%s  %s\n' "$PATCH_GZIP_SHA256" /tmp/wos01a-journey-diagnostics.patch.gz | sha256sum -c -
          gzip -dc /tmp/wos01a-journey-diagnostics.patch.gz > /tmp/wos01a-journey-diagnostics.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/wos01a-journey-diagnostics.patch | sha256sum -c -

          git apply --check /tmp/wos01a-journey-diagnostics.patch
          git apply /tmp/wos01a-journey-diagnostics.patch
          rm "$workflow"

          node --check "$acceptance"
          node --check "$regression"
          node "$regression"
          git diff --check
          test "$(git hash-object "$acceptance")" = "$EXPECTED_ACCEPTANCE_FINAL_BLOB"
          test "$(git hash-object "$regression")" = "$EXPECTED_TEST_FINAL_BLOB"

          actual_paths="$(git diff --name-only "$EXPECTED_PARENT" | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' "$acceptance" "$regression" | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"

          git config user.name 'WorkOS Journey Diagnostics Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ci: expose bounded browser journey phases'
          final_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$trigger_head"
          test "$(git diff --name-only "$EXPECTED_PARENT" "$final_head" | LC_ALL=C sort)" = "$expected_paths"
          git push --force-with-lease="refs/heads/$BRANCH:$trigger_head" origin "HEAD:refs/heads/$BRANCH"
