name: WOS-01A Publication Recovery

on:
  push:
    branches:
      - controller/wos01a-clean-runtime-acceptance-v2
    paths:
      - '.github/workflows/wos01a-publication-recovery.yml'

permissions:
  contents: write

concurrency:
  group: wos01a-publication-recovery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact target lease
        uses: actions/checkout@v4
        with:
          ref: 0935424a52b57cc3a51adeef737e6eaec2946a88
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and publish exact recovered tree
        shell: bash
        run: |
          set -euo pipefail
          target_branch='codex/wos01a-acceptance-closure'
          target_old='0935424a52b57cc3a51adeef737e6eaec2946a88'
          parent_branch='codex/wos-01-authorized-source-bootstrap-v2'
          parent_head='590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60'
          main_head='44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42'

          git fetch --no-tags origin \
            "refs/heads/$target_branch:refs/remotes/origin/$target_branch" \
            "refs/heads/$parent_branch:refs/remotes/origin/$parent_branch" \
            "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse "origin/$target_branch")" = "$target_old"
          test "$(git rev-parse "origin/$parent_branch")" = "$parent_head"
          test "$(git rev-parse origin/main)" = "$main_head"
          test "$(git rev-parse HEAD)" = "$target_old"

          cat > /tmp/wos01a.patch.gz.b64 <<'B64'



B64
          tr -d '\n\r ' < /tmp/wos01a.patch.gz.b64 > /tmp/wos01a.patch.gz.b64.clean
          base64 -d /tmp/wos01a.patch.gz.b64.clean > /tmp/wos01a.patch.gz
          test "$(wc -c < /tmp/wos01a.patch.gz)" = "8871"
          test "$(sha256sum /tmp/wos01a.patch.gz | cut -d' ' -f1)" = "386b2401f3ac9471f1e06ae995c519b84e61866cf16787d649c263dae096c15b"
          gzip -dc /tmp/wos01a.patch.gz > /tmp/wos01a.patch
          test "$(wc -c < /tmp/wos01a.patch)" = "30187"
          test "$(sha256sum /tmp/wos01a.patch | cut -d' ' -f1)" = "00959e9a2059ef9137222865494f4c21239fcdd01d9dc084f202749d1ac9977f"

          git apply --index --check /tmp/wos01a.patch
          git apply --index /tmp/wos01a.patch

          cat > /tmp/expected-files <<'EOF'
          docs/evidence/v0.2.0/DOC-WOS-01-001-SOURCE-BOOTSTRAP.md
          package.json
          server/identity-discovery.mjs
          server/index.mjs
          server/start-production.mjs
          tests/identity-discovery-smoke.mjs
          tests/production-identity-smoke.mjs
          EOF
          sed -i 's/^          //' /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

          test "$(sha256sum "docs/evidence/v0.2.0/DOC-WOS-01-001-SOURCE-BOOTSTRAP.md" | cut -d' ' -f1)" = "f704d16fafd4075c170fd699abe23a5d8d64a2412dbfbfc857f506e2d822c490"
          test "$(git hash-object "docs/evidence/v0.2.0/DOC-WOS-01-001-SOURCE-BOOTSTRAP.md")" = "7efaef2748e4ed863e3167b7c94af765a6bf54df"
          test "$(sha256sum "package.json" | cut -d' ' -f1)" = "4c3ec16f039fee870ff8341bcedfc62e3d56989c3b194cb118feceb8175c0ee0"
          test "$(git hash-object "package.json")" = "3dcb9f04af8a587afc6b3db024058a5533d31711"
          test "$(sha256sum "server/identity-discovery.mjs" | cut -d' ' -f1)" = "9b84c3affaff0bfed03f398cf6b046f47b2d2834a09729ce826ddd94d61e3c94"
          test "$(git hash-object "server/identity-discovery.mjs")" = "1ebd83cedf6e8c7c0e7ce41a3f5279837b513687"
          test "$(sha256sum "server/index.mjs" | cut -d' ' -f1)" = "b5c1ffb1db3ebc741616de567c12729b0bd918ac640ae8982fb5d9f2eef17d66"
          test "$(git hash-object "server/index.mjs")" = "830d9d65002aaf5fbd3cb0f5a0d6eb35064a5fc2"
          test "$(sha256sum "server/start-production.mjs" | cut -d' ' -f1)" = "47960ba786e307c43b63734809b864a8c119b0818d0fb851ea78b03efc0b7eea"
          test "$(git hash-object "server/start-production.mjs")" = "b45e0a4a4d7725633146a2136d81de78f8303668"
          test "$(sha256sum "tests/identity-discovery-smoke.mjs" | cut -d' ' -f1)" = "663015168a95842844c1b59340d728454ee32248022dc5ecb45989fc49334b32"
          test "$(git hash-object "tests/identity-discovery-smoke.mjs")" = "2b5621c709eacc648654b2c8b2d80654dd7c0a45"
          test "$(sha256sum "tests/production-identity-smoke.mjs" | cut -d' ' -f1)" = "fc1581bdbaecfcf36a4127be373c345f72ed4d05637f505b807b4b0b8f13887f"
          test "$(git hash-object "tests/production-identity-smoke.mjs")" = "c22937605db8a233f69113b0a38b7c8c8ce754ab"

          git diff --cached --check
          git config user.name 'WorkOS Build Controller'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce governed HTTPS identity discovery'
          test "$(git rev-parse HEAD^)" = "$target_old"
          test "$(git rev-parse HEAD^{tree})" = "9fcda3ca3632175e2a9c264f88e2ffb99ada28f0"

          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$target_branch" \
            --force-with-lease="refs/heads/$target_branch:$target_old"
          git fetch --no-tags origin "refs/heads/$target_branch:refs/remotes/origin/$target_branch"
          test "$(git rev-parse "origin/$target_branch")" = "$new_head"
          echo "Published WOS-01A recovery head $new_head"
