name: WOS-01A PR18 Patch Recovery

on:
  push:
    branches:
      - controller/wos01a-actions-publisher
    paths:
      - '.github/workflows/wos01a-pr18-patch-recovery.yml'

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: wos01a-pr18-patch-recovery
  cancel-in-progress: false

env:
  TARGET_BRANCH: controller/wos01a-actions-publisher
  EXPECTED_PARENT: 5932d3135f47612f9b7fa6dbd9c577207009e6b7
  EXPECTED_TARGET_TREE: 8958ebbc66ec4909aa7bec4fddab1363897e93a7
  RAW_PATCH_SHA256: d5822d2575c4bf59f8c4de0c1d8886db1d6b98ce85cdd9ca423a0cfd5b100eca
  XZ_PATCH_SHA256: 198cca7352008f88e357f1229fa102729c609503a3db395327cefebeb7895e8a
  PR_NUMBER: '18'

jobs:
  recover:
    name: Apply verified PR18 correction and self-delete
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify live Draft PR association
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const failures = [];
            if (pr.state !== 'open') failures.push(`state=${pr.state}`);
            if (!pr.draft) failures.push('PR is not Draft');
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`head.ref=${pr.head.ref}`);
            if (pr.head.sha !== context.sha) failures.push(`head.sha=${pr.head.sha} expected=${context.sha}`);
            if (pr.base.ref !== 'main') failures.push(`base.ref=${pr.base.ref}`);
            if (failures.length) core.setFailed(`PR #18 recovery start gate failed: ${failures.join(', ')}`);

      - name: Checkout exact recovery commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify helper commit is the only delta over the guarded parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          expected='.github/workflows/wos01a-pr18-patch-recovery.yml'
          actual="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Decode, verify and apply canonical correction
