          base64 -d /tmp/wos01a.patch.xz.b64 > /tmp/wos01a.patch.xz
          test "$(sha256sum /tmp/wos01a.patch.xz | cut -d' ' -f1)" = "$XZ_PATCH_SHA256"
          xz -dc /tmp/wos01a.patch.xz > /tmp/wos01a.patch
          test "$(sha256sum /tmp/wos01a.patch | cut -d' ' -f1)" = "$RAW_PATCH_SHA256"
          git apply --binary --index /tmp/wos01a.patch
          git rm .github/workflows/wos01a-pr18-patch-recovery.yml
          git diff --cached --check
          cat > /tmp/expected-paths <<'PATHS'
          .github/scripts/wos01a-source-bootstrap.mjs
          .github/scripts/wos01a/scan-bootstrap.mjs
          .github/workflows/wos01a-pr18-patch-recovery.yml
          .github/workflows/wos01a-source-bootstrap-publisher.yml
          PATHS
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          test "$(git write-tree)" = "$EXPECTED_TARGET_TREE"

      - name: Commit exact target tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WorkOS Implementation Controller"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci: secure WOS-01A publisher execution gates"
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TARGET_TREE"
          echo "new_head=$new_head" >> "$GITHUB_OUTPUT"

      - name: Re-verify Draft PR immediately before publication
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const failures = [];
            if (pr.state !== 'open') failures.push(`state=${pr.state}`);
            if (!pr.draft) failures.push('PR is not Draft');
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`head.ref=${pr.head.ref}`);
            if (pr.head.sha !== context.sha) failures.push(`head.sha=${pr.head.sha} expected=${context.sha}`);
            if (pr.base.ref !== 'main') failures.push(`base.ref=${pr.base.ref}`);
            if (failures.length) core.setFailed(`PR #18 moved before recovery publication: ${failures.join(', ')}`);

      - name: Publish with exact-old-head lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_HEAD: ${{ steps.commit.outputs.new_head }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.https://github.com/.extraheader="$auth_header" ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="$auth_header" push             --force-with-lease="refs/heads/$TARGET_BRANCH:$GITHUB_SHA"             origin "HEAD:refs/heads/$TARGET_BRANCH"
          published="$(git -c http.https://github.com/.extraheader="$auth_header" ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$published" = "$NEW_HEAD"

      - name: Record verified publication
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### PR #18 guarded correction published

            - Recovery parent: \`${context.sha}\`
            - Exact published head: \`${{ steps.commit.outputs.new_head }}\`
            - Exact published tree: \`${process.env.EXPECTED_TARGET_TREE}\`
            - Canonical raw patch SHA-256: \`${process.env.RAW_PATCH_SHA256}\`
            - Scope: three controller files; the temporary recovery workflow self-deleted.

            PR #18 remains Draft. PR #16 was not mutated or executed. Fresh exact-head CI and independent review remain mandatory.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });