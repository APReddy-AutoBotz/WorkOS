name: WOS-01A PR18 Publication Recovery Bridge

on:
  push:
    branches:
      - controller/wos01a-actions-publisher
    paths:
      - '.github/workflows/wos01a-pr18-recovery.yml'
      - '.github/recovery/wos01a-pr18-target.tar.xz.b64'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: wos01a-pr18-publication-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.head_commit.message == 'CTRL: stage PR18 recovery payload'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: controller/wos01a-actions-publisher
      OLD_HEAD: 3601bb92f8c607a99cb910f31cc8137ae0845c37
      TARGET_TREE: 5f7926b50da0811825796a3d99a0051dec7e0b2e
      ARCHIVE_SHA: a88c5c9bd6922516a5a3888792e5700d5d7f31a609f5b760e3ceba3f07450224
      PAYLOAD: .github/recovery/wos01a-pr18-target.tar.xz.b64
      SELF: .github/workflows/wos01a-pr18-recovery.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact recovery staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard, materialize, verify and atomically publish final two-file convergence
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/18" --jq .state)" = "open"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/18" --jq .draft)" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/18" --jq .head.ref)" = "$BRANCH"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/18" --jq .head.sha)" = "$GITHUB_SHA"

          tr -d '\r\n ' < "$PAYLOAD" | base64 -d > /tmp/wos01a-pr18-target.tar.xz
          echo "$ARCHIVE_SHA  /tmp/wos01a-pr18-target.tar.xz" | sha256sum -c -
          tar -xJf /tmp/wos01a-pr18-target.tar.xz -C .

          test "$(wc -c < .github/scripts/wos01a-source-bootstrap.mjs)" -eq 31897
          echo "5def1d28cc02ec7349fb61d5550f2e610bbb233eb23d7af653ce5c75c0453368  .github/scripts/wos01a-source-bootstrap.mjs" | sha256sum -c -
          test "$(git hash-object .github/scripts/wos01a-source-bootstrap.mjs)" = "0d0f5fff3a15a708865aefa16c26e7d076d7041a"

          test "$(wc -c < .github/scripts/wos01a/scan-bootstrap.mjs)" -eq 5132
          echo "b590602032d162e299a2a394297e161a7a3421c0ad8fd83c5fd7fdf01cfac191  .github/scripts/wos01a/scan-bootstrap.mjs" | sha256sum -c -
          test "$(git hash-object .github/scripts/wos01a/scan-bootstrap.mjs)" = "d85b7fd187ce650f1f4ea5c99813bd94fe195f59"

          node --check .github/scripts/wos01a-source-bootstrap.mjs
          node --check .github/scripts/wos01a/scan-bootstrap.mjs

          rm -f "$PAYLOAD" "$SELF"
          git add -A
          git diff --cached --check

          mapfile -t changed < <(git diff --cached --name-only "$OLD_HEAD")
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/scripts/wos01a-source-bootstrap.mjs"
          test "${changed[1]}" = ".github/scripts/wos01a/scan-bootstrap.mjs"

          test "$(git write-tree)" = "$TARGET_TREE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: converge WOS-01A materialization and scanner guards"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/18" --jq .state)" = "open"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/18" --jq .draft)" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/18" --jq .head.ref)" = "$BRANCH"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/18" --jq .head.sha)" = "$GITHUB_SHA"

          git push --force-with-lease="refs/heads/${BRANCH}:${GITHUB_SHA}" origin "HEAD:refs/heads/${BRANCH}"
