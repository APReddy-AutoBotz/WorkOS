name: WOS-01A Publication Recovery Bridge

on:
  push:
    branches:
      - controller/wos01a-actions-publisher

permissions:
  contents: write

concurrency:
  group: wos01a-publication-recovery-bridge
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact bridge head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify guarded bridge and materialize approved target
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='4d841b1ae783dd066c5d77fb7c29927b2657255f'
          expected_xz_sha='f10378f5effd905b291b93449cccdc6e5fffa0ae2d262b5d4c9e2a316a203b04'
          expected_file_sha='592a268dd55c08dcef75506a682b981fe59769bb1f263aa6aa2ba9d55806903e'
          expected_tree='6866d69ee89fd80363bd785aa9951a7a831d3df3'
          helper='.github/recovery/wos01a-source-bootstrap.mjs.xz'
          workflow='.github/workflows/wos01a-publication-recovery-bridge.yml'
          target='.github/scripts/wos01a-source-bootstrap.mjs'

          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git branch --show-current)" = 'controller/wos01a-actions-publisher'
          printf '%s  %s\n' "$expected_xz_sha" "$helper" | sha256sum -c -

          xz -dc "$helper" > "$target"
          test "$(wc -c < "$target" | tr -d ' ')" = '36026'
          printf '%s  %s\n' "$expected_file_sha" "$target" | sha256sum -c -
          node --check "$target"

          git rm "$helper" "$workflow"
          git add "$target"
          git diff --cached --check
          test "$(git write-tree)" = "$expected_tree"

          git config user.name 'WorkOS Implementation Controller'
          git config user.email 'controller@users.noreply.github.com'
          git commit -m 'ci: make WOS-01A branding transform JSX-safe'
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          git push origin HEAD:controller/wos01a-actions-publisher
