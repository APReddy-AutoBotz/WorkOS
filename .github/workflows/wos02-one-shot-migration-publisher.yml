name: WOS-02 Retained Reporting Diagnostic

on:
  push:
    branches:
      - controller/wos02-migration-publisher
    paths:
      - .github/workflows/wos02-one-shot-migration-publisher.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: wos02_reporting_diag
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U workos -d wos02_reporting_diag"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_reporting_diag
      MAIN_HEAD: 3070c80a71640fa4275477d0d2f1538cc8d2a819
      PRODUCT_HEAD: 28edf2f1966e293c44ca4d173a2ad0a2857e6b2b
      CONTROLLER_HEAD: 6d462275de3c3741393bed80d77bc7c91479e964
    steps:
      - name: Checkout exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_HEAD }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "$CONTROLLER_HEAD"
          test "$(git -C target rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq '.commit.sha')" = "$MAIN_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.head.sha')" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.head.sha')" = "$CONTROLLER_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.draft')" = "true"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: target/package-lock.json
      - name: Install and migrate
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          npm ci
          node server/migrate.mjs
      - name: Execute retained reporting matrix
        id: reporting
        shell: bash
        run: |
          set +e
          TARGET_ROOT="$GITHUB_WORKSPACE/target" DATABASE_URL="$DATABASE_URL" node controller/.github/scripts/wos02-reporting-period-acceptance.mjs > reporting.log 2>&1
          status=$?
          cat reporting.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload reporting log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos02-retained-reporting-diagnostic
          path: reporting.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail if reporting matrix failed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.reporting.outputs.exit_code }}" = "0"
