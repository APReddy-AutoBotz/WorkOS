name: WOS-02 U8-U9 Controller Rebind Publisher

on:
  push:
    branches:
      - controller/wos02-migration-publisher
    paths:
      - .github/workflows/wos02-one-shot-migration-publisher.yml

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: wos02-u8-u9-controller-rebind-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_HEAD: 3070c80a71640fa4275477d0d2f1538cc8d2a819
      PRODUCT_HEAD: 28edf2f1966e293c44ca4d173a2ad0a2857e6b2b
      PRODUCT_TREE: 23c9d49046e0af9a1540f71690825ef2845e5c07
      CONTROLLER_HEAD: 10ea59ed7d244c6fa457d0530fa13888065ace51
    steps:
      - name: Checkout exact controller base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact live leases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROLLER_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_HEAD"
          test "$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | cut -f1)" = "$PRODUCT_HEAD"
          test "$(git ls-remote origin refs/heads/controller/wos02-exact-acceptance | cut -f1)" = "$CONTROLLER_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.state')" = "open"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.merged')" = "false"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.head.sha')" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.state')" = "open"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.merged')" = "false"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.head.sha')" = "$CONTROLLER_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/commits/$PRODUCT_HEAD --jq '.tree.sha')" = "$PRODUCT_TREE"

      - name: Retrieve and verify controller rebind payload
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/issues/comments/5558390189 --jq '.body' > /tmp/rebind.md
          python - <<'PY'
          import base64, hashlib, re
          from pathlib import Path
          body = Path('/tmp/rebind.md').read_text()
          match = re.search(r"```base64\s*\n([A-Za-z0-9+/=\r\n]+)\n```", body)
          assert match, 'base64 payload block missing'
          payload = ''.join(match.group(1).split())
          assert len(payload) == 21856, len(payload)
          assert hashlib.sha256(payload.encode()).hexdigest() == '4b02322def958df67ac8a4b69a9131a419b5fb365c9bec3fdf516e87a9b6885f'
          decoded = base64.b64decode(payload, validate=True)
          assert len(decoded) == 16391, len(decoded)
          assert hashlib.sha256(decoded).hexdigest() == '897175d3513c4ad6b8bb1b8ecc91150ec5c92a254a7dd4dbe932f06ed46e37b0'
          Path('/tmp/rebind.py').write_bytes(decoded)
          PY
          python /tmp/rebind.py
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/scripts/wos02-reporting-period-acceptance.mjs .github/workflows/wos02-final-review-acceptance.yml "
          node --check .github/scripts/wos02-reporting-period-acceptance.mjs
          grep -F "TARGET_HEAD: $PRODUCT_HEAD" .github/workflows/wos02-final-review-acceptance.yml
          grep -F "TARGET_TREE: $PRODUCT_TREE" .github/workflows/wos02-final-review-acceptance.yml
          grep -F "030_wos02_reporting_period_frequency.sql" .github/workflows/wos02-final-review-acceptance.yml
          git add .github/scripts/wos02-reporting-period-acceptance.mjs .github/workflows/wos02-final-review-acceptance.yml
          git config user.name "WorkOS Implementation Controller"
          git config user.email "noreply@github.com"
          git commit -m "test: rebind U8-U9 reporting acceptance"
          test "$(git rev-parse HEAD^)" = "$CONTROLLER_HEAD"

      - name: Revalidate and non-force publish existing controller branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_HEAD"
          test "$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | cut -f1)" = "$PRODUCT_HEAD"
          test "$(git ls-remote origin refs/heads/controller/wos02-exact-acceptance | cut -f1)" = "$CONTROLLER_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.state')" = "open"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.head.sha')" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.state')" = "open"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.head.sha')" = "$CONTROLLER_HEAD"
          git push origin HEAD:refs/heads/controller/wos02-exact-acceptance
          test "$(git ls-remote origin refs/heads/controller/wos02-exact-acceptance | cut -f1)" = "$(git rev-parse HEAD)"
