name: WOS-02 Retained Live Diagnostic

on:
  push:
    branches:
      - controller/wos02-migration-publisher
    paths:
      - .github/workflows/wos02-one-shot-migration-publisher.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wos02-retained-live-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: wos02_diag
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U workos -d wos02_diag"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: postgresql://workos:workos@127.0.0.1:5432/wos02_diag
      MAIN_HEAD: 3070c80a71640fa4275477d0d2f1538cc8d2a819
      PRODUCT_HEAD: 28edf2f1966e293c44ca4d173a2ad0a2857e6b2b
      CONTROLLER_HEAD: e121f3c763aee2ef4a64174262b8403a2cb53809
    steps:
      - name: Checkout exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_HEAD }}
          path: controller
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact diagnostic authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "$CONTROLLER_HEAD"
          test "$(git -C target rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq '.commit.sha')" = "$MAIN_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.state')" = "open"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.head.sha')" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.state')" = "open"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.head.sha')" = "$CONTROLLER_HEAD"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Locked install and migrate exact product
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          npm ci
          node server/migrate.mjs

      - name: Execute retained 17-check matrix and capture exact failure
        id: live
        shell: bash
        run: |
          set +e
          TARGET_ROOT="$GITHUB_WORKSPACE/target" DATABASE_URL="$DATABASE_URL" node controller/.github/scripts/wos02-final-review-live-acceptance.mjs > retained-live.log 2>&1
          status=$?
          cat retained-live.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos02-retained-live-diagnostic
          path: retained-live.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail if retained matrix failed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.live.outputs.exit_code }}" = "0"
