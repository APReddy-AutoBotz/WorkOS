name: WOS-02 One-Shot Migration Publisher

on:
  push:
    branches:
      - controller/wos02-migration-publisher
    paths:
      - .github/workflows/wos02-one-shot-migration-publisher.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact product base
        uses: actions/checkout@v4
        with:
          ref: 7b8200a75e75d24f3c2cc114c5ebe74b789c9fba
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact live leases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7b8200a75e75d24f3c2cc114c5ebe74b789c9fba"
          test "$(git rev-parse HEAD^{tree})" = "f2f7a8e5b2c1f8244e6c7d6bfa8dc8f33d219a17"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | cut -f1)" = "7b8200a75e75d24f3c2cc114c5ebe74b789c9fba"

      - name: Reconstruct and verify exact writer payload
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.b64 <<'B64'
          
          B64
          test "$(wc -c < /tmp/payload.b64 | tr -d ' ')" = "1705"
          base64 -d /tmp/payload.b64 > /tmp/correction.diff.gz
          test "$(wc -c < /tmp/correction.diff.gz | tr -d ' ')" = "1276"
          echo "508aac7304883e6fd0d1f36cd3dd8dc5f3fc09a183d18bf11db99d7ba92d0a38  /tmp/correction.diff.gz" | sha256sum -c -
          gzip -dc /tmp/correction.diff.gz > /tmp/correction.diff
          test "$(wc -c < /tmp/correction.diff | tr -d ' ')" = "4226"
          echo "3f8519ab24039551cf4fddc0195ad98c469624a7385de42cde15128ae20545bb  /tmp/correction.diff" | sha256sum -c -
          git apply --binary /tmp/correction.diff
          git add -A
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "server/migrations/025a_wos02_project_legal_scope_unique_prerequisite.sql tests/organization-setup-smoke.mjs "
          git diff --cached --check
          git config user.name "Avala Parameswara Reddy"
          git config user.email "avalaparameswarareddy@gmail.com"
          git commit -m "fix: add project legal scope migration prerequisite"
          test "$(git rev-parse HEAD^{tree})" = "6f8813a9bb0a4821734ae8cd0a60f935fe1e16e1"
          test "$(git rev-parse HEAD^)" = "7b8200a75e75d24f3c2cc114c5ebe74b789c9fba"

      - name: Revalidate and non-force publish existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | cut -f1)" = "7b8200a75e75d24f3c2cc114c5ebe74b789c9fba"
          git push origin HEAD:refs/heads/codex/wos-02-organization-setup-foundation
