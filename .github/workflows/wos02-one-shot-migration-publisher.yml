name: WOS-02 Scope-Write Fixture Publisher

on:
  push:
    branches:
      - controller/wos02-migration-publisher
    paths:
      - .github/workflows/wos02-one-shot-migration-publisher.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_HEAD: 3070c80a71640fa4275477d0d2f1538cc8d2a819
      PRODUCT_HEAD: 28edf2f1966e293c44ca4d173a2ad0a2857e6b2b
      CONTROLLER_HEAD: f50a101b8d0c7477c73a1e9c6a0b1f1fc19e048a
    steps:
      - name: Checkout exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROLLER_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq '.commit.sha')" = "$MAIN_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.head.sha')" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.head.sha')" = "$CONTROLLER_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.draft')" = "true"

      - name: Correct stale frequency fixture only
        shell: bash
        run: |
          set -euo pipefail
          file=.github/scripts/wos02-scope-write-acceptance.mjs
          python -c "from pathlib import Path; p=Path('$file'); s=p.read_text(); old='insert into reporting_periods(organization_id,legal_entity_id,code,name,starts_on,ends_on,status) values'; new='insert into reporting_periods(organization_id,legal_entity_id,code,name,frequency,starts_on,ends_on,status) values'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('$file'); s=p.read_text(); pairs=[(\"'Scope Week 0816','2026-08-10'\",\"'Scope Week 0816','Weekly','2026-08-10'\"),(\"'Scope Week 0823','2026-08-17'\",\"'Scope Week 0823','Weekly','2026-08-17'\"),(\"'Scope Week 0830','2026-08-24'\",\"'Scope Week 0830','Weekly','2026-08-24'\")]; [(_ for _ in ()).throw(AssertionError((a,s.count(a)))) if s.count(a)!=1 else None for a,b in pairs]; [None for a,b in pairs if not (s:=s.replace(a,b,1))]; p.write_text(s)"
          python -c "from pathlib import Path; p=Path('$file'); s=p.read_text(); old='on conflict(organization_id,legal_entity_id,code) do nothing'; new='on conflict(organization_id,legal_entity_id,frequency,code) do nothing'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
          git add "$file"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$file"
          node --check "$file"
          grep -F "code,name,frequency,starts_on,ends_on,status" "$file"
          grep -F "'Scope Week 0816','Weekly','2026-08-10'" "$file"
          grep -F "on conflict(organization_id,legal_entity_id,frequency,code) do nothing" "$file"
          git config user.name "WorkOS Implementation Controller"
          git config user.email "noreply@github.com"
          git commit -m "test: align scope-write reporting fixtures with frequency authority"
          test "$(git rev-parse HEAD^)" = "$CONTROLLER_HEAD"
          echo "NEW_CONTROLLER=$(git rev-parse HEAD)"

      - name: Revalidate and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq '.commit.sha')" = "$MAIN_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.head.sha')" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.head.sha')" = "$CONTROLLER_HEAD"
          git push origin HEAD:refs/heads/controller/wos02-exact-acceptance
