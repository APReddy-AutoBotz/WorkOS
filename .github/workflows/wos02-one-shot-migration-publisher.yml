name: WOS-02 Scope-Write Frequency Fixture Publisher

on:
  push:
    branches:
      - controller/wos02-migration-publisher
    paths:
      - .github/workflows/wos02-one-shot-migration-publisher.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: wos02-scope-write-frequency-fixture-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_HEAD: 3070c80a71640fa4275477d0d2f1538cc8d2a819
      PRODUCT_HEAD: 28edf2f1966e293c44ca4d173a2ad0a2857e6b2b
      CONTROLLER_HEAD: f50a101b8d0c7477c73a1e9c6a0b1f1fc19e048a
    steps:
      - name: Checkout exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact live leases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROLLER_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq '.commit.sha')" = "$MAIN_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.state')" = "open"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.head.sha')" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.state')" = "open"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.draft')" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.head.sha')" = "$CONTROLLER_HEAD"

      - name: Correct only stale scope-write reporting fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/wos02-scope-write-acceptance.mjs')
          s = p.read_text()
          old = """await pool.query(`insert into reporting_periods(organization_id,legal_entity_id,code,name,starts_on,ends_on,status) values
 ('org-scope','legal-scope-a','RP-SCOPE-0816','Scope Week 0816','2026-08-10','2026-08-16','Open'),
 ('org-scope','legal-scope-a','RP-SCOPE-0823','Scope Week 0823','2026-08-17','2026-08-23','Open'),
 ('org-scope','legal-scope-a','RP-SCOPE-0830','Scope Week 0830','2026-08-24','2026-08-30','Open')
 on conflict(organization_id,legal_entity_id,code) do nothing`);"""
          new = """await pool.query(`insert into reporting_periods(organization_id,legal_entity_id,code,name,frequency,starts_on,ends_on,status) values
 ('org-scope','legal-scope-a','RP-SCOPE-0816','Scope Week 0816','Weekly','2026-08-10','2026-08-16','Open'),
 ('org-scope','legal-scope-a','RP-SCOPE-0823','Scope Week 0823','Weekly','2026-08-17','2026-08-23','Open'),
 ('org-scope','legal-scope-a','RP-SCOPE-0830','Scope Week 0830','Weekly','2026-08-24','2026-08-30','Open')
 on conflict(organization_id,legal_entity_id,frequency,code) do nothing`);"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add .github/scripts/wos02-scope-write-acceptance.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only)" = ".github/scripts/wos02-scope-write-acceptance.mjs"
          node --check .github/scripts/wos02-scope-write-acceptance.mjs
          git diff --cached -- .github/scripts/wos02-scope-write-acceptance.mjs
          git config user.name "WorkOS Implementation Controller"
          git config user.email "noreply@github.com"
          git commit -m "test: align scope-write reporting fixtures with frequency authority"
          test "$(git rev-parse HEAD^)" = "$CONTROLLER_HEAD"
          echo "CONTROLLER_COMMIT=$(git rev-parse HEAD)"
          echo "CONTROLLER_TREE=$(git rev-parse HEAD^{tree})"

      - name: Revalidate and non-force publish controller correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq '.commit.sha')" = "$MAIN_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/37 --jq '.head.sha')" = "$PRODUCT_HEAD"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/38 --jq '.head.sha')" = "$CONTROLLER_HEAD"
          git push origin HEAD:refs/heads/controller/wos02-exact-acceptance
