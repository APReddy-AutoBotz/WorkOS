name: WOS-01A Controller Target Refresh

on:
  push:
    branches:
      - controller/wos01a-clean-runtime-acceptance-v2
    paths:
      - .github/workflows/wos01a-controller-target-refresh.yml

concurrency:
  group: wos01a-controller-target-refresh
  cancel-in-progress: false

env:
  CONTROLLER_PR: '26'
  CONTROLLER_BRANCH: controller/wos01a-clean-runtime-acceptance-v2
  TARGET_PR: '27'
  TARGET_BRANCH: codex/wos01a-acceptance-closure
  OLD_TARGET_HEAD: 4415eb15aee8ce8f07d2b83d586241653f1c949d
  NEW_TARGET_HEAD: 117ad0afc2a0607ec290ba9d040d32cd08d20b3e
  PARENT_PR: '16'
  PARENT_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
  PARENT_HEAD: 590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60
  EXPECTED_MAIN_HEAD: 44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42
  REFRESH_WORKFLOW: .github/workflows/wos01a-controller-target-refresh.yml
  ACCEPTANCE_WORKFLOW: .github/workflows/wos01a-clean-runtime-acceptance-v2.yml
  VERIFIER: .github/scripts/verify-wos01a-controller-v2.mjs

jobs:
  refresh:
    name: Rebind controller to exact corrected target
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact live controller and stacked target authority
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const {data: controller} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.CONTROLLER_PR),
            });
            if (controller.state !== 'open') failures.push(`controller.state=${controller.state}`);
            if (!controller.draft) failures.push('controller is not Draft');
            if (controller.head.ref !== process.env.CONTROLLER_BRANCH) failures.push(`controller.head.ref=${controller.head.ref}`);
            if (controller.head.sha !== context.sha) failures.push(`controller.head.sha=${controller.head.sha}`);
            if (controller.base.ref !== 'main') failures.push(`controller.base.ref=${controller.base.ref}`);
            if (controller.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`controller.base.sha=${controller.base.sha}`);

            const {data: target} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR),
            });
            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target is not Draft');
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.NEW_TARGET_HEAD) failures.push(`target.head.sha=${target.head.sha}`);
            if (target.base.ref !== process.env.PARENT_BRANCH) failures.push(`target.base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.PARENT_HEAD) failures.push(`target.base.sha=${target.base.sha}`);

            const {data: parent} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PARENT_PR),
            });
            if (parent.state !== 'open') failures.push(`parent.state=${parent.state}`);
            if (!parent.draft) failures.push('parent is not Draft');
            if (parent.head.ref !== process.env.PARENT_BRANCH) failures.push(`parent.head.ref=${parent.head.ref}`);
            if (parent.head.sha !== process.env.PARENT_HEAD) failures.push(`parent.head.sha=${parent.head.sha}`);
            if (failures.length) core.setFailed(`WOS-01A target refresh authority failed: ${failures.join(', ')}`);

      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply exact two-file target rebind
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(grep -F -l "$OLD_TARGET_HEAD" "$ACCEPTANCE_WORKFLOW" "$VERIFIER" | wc -l)" -eq 2
          sed -i "s/$OLD_TARGET_HEAD/$NEW_TARGET_HEAD/g" "$ACCEPTANCE_WORKFLOW" "$VERIFIER"
          test -z "$(grep -F -l "$OLD_TARGET_HEAD" "$ACCEPTANCE_WORKFLOW" "$VERIFIER" || true)"
          test "$(grep -F -l "$NEW_TARGET_HEAD" "$ACCEPTANCE_WORKFLOW" "$VERIFIER" | wc -l)" -eq 2
          node --check "$VERIFIER"
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0)); YAML.load_file(ARGV.fetch(1))' "$ACCEPTANCE_WORKFLOW" "$REFRESH_WORKFLOW"
          rm "$REFRESH_WORKFLOW"
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "$VERIFIER"
          test "${changed[1]}" = "$ACCEPTANCE_WORKFLOW"
          test "${changed[2]}" = "$REFRESH_WORKFLOW"
          git diff --check

      - name: Commit and push under exact-old-head lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_origin="https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$trusted_origin"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          git config --local core.hooksPath /dev/null
          git config user.name "WorkOS Implementation Controller"
          git config user.email "actions@users.noreply.github.com"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.https://github.com/.extraheader="$auth_header" ls-remote origin "refs/heads/$CONTROLLER_BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git checkout -B "$CONTROLLER_BRANCH" "$GITHUB_SHA"
          git add "$VERIFIER" "$ACCEPTANCE_WORKFLOW" "$REFRESH_WORKFLOW"
          git diff --cached --check
          git commit --no-verify -m "ci: rebind WOS-01A acceptance to corrected closure head"
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="$auth_header" push --no-verify \
            --force-with-lease="refs/heads/$CONTROLLER_BRANCH:$GITHUB_SHA" \
            origin "HEAD:refs/heads/$CONTROLLER_BRANCH"
