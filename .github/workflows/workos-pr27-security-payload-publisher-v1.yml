name: WorkOS PR27 Security Payload Publisher v1

on:
  push:
    branches:
      - controller/workos-root-publisher-v1
    paths:
      - '.github/workflows/workos-pr27-security-payload-publisher-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: workos-pr27-security-payload-publisher-v1
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/wos01a-acceptance-closure
  TARGET_OLD_HEAD: 53dd7b8d372cae9cd3480d39d549a709a12c4c90
  COMMENT_ID: '5454196702'
  EXPECTED_LOCAL_COMMIT: e6064240ec0a2d1e47e00689ff6eb4dc13d7b3c9
  EXPECTED_GZIP_BYTES: '9660'
  EXPECTED_GZIP_SHA256: 85d56a4ff3f91ba6df4b3ba66689cffbcb4982b50c4275017bd0e2d3aa5e73c8
  EXPECTED_PATCH_BYTES: '36112'
  EXPECTED_PATCH_SHA256: 9af2b5cf5e511078c0281ff755d194e678a0dcbbd4bd99acf377670cc9e332b0

jobs:
  publish:
    name: Materialize, validate and publish PR27 security closure
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact published PR27 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_OLD_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact remote branch lease
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_OLD_HEAD"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$TARGET_OLD_HEAD"
          test -z "$(git status --porcelain)"

      - name: Fetch and verify complete controller-materializable payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
            > /tmp/pr27-comment.json

          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          payload = json.loads(Path('/tmp/pr27-comment.json').read_text())
          body = payload.get('body', '')
          expected_base = '53dd7b8d372cae9cd3480d39d549a709a12c4c90'
          expected_commit = 'e6064240ec0a2d1e47e00689ff6eb4dc13d7b3c9'
          if expected_base not in body or expected_commit not in body:
              raise SystemExit('comment authority does not match expected base/local commit')
          matches = re.findall(r'```base64\s*\n([A-Za-z0-9+/=\r\n]+?)\n```', body)
          if len(matches) != 1:
              raise SystemExit(f'expected one complete base64 block, found {len(matches)}')
          encoded = ''.join(matches[0].split())
          compressed = base64.b64decode(encoded, validate=True)
          raw = gzip.decompress(compressed)
          Path('/tmp/pr27-security.patch.gz').write_bytes(compressed)
          Path('/tmp/pr27-security.patch').write_bytes(raw)
          print(json.dumps({
              'gzip_bytes': len(compressed),
              'gzip_sha256': hashlib.sha256(compressed).hexdigest(),
              'patch_bytes': len(raw),
              'patch_sha256': hashlib.sha256(raw).hexdigest(),
          }, indent=2))
          PY

          test "$(stat -c%s /tmp/pr27-security.patch.gz)" = "$EXPECTED_GZIP_BYTES"
          test "$(sha256sum /tmp/pr27-security.patch.gz | awk '{print $1}')" = "$EXPECTED_GZIP_SHA256"
          test "$(stat -c%s /tmp/pr27-security.patch)" = "$EXPECTED_PATCH_BYTES"
          test "$(sha256sum /tmp/pr27-security.patch | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"

      - name: Apply exact binary patch and verify changed scope
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --binary /tmp/pr27-security.patch
          git apply --binary --index /tmp/pr27-security.patch
          git diff --cached --check

          cat > /tmp/expected-paths.txt <<'EOF'
          docs/evidence/v0.2.0/DOC-WOS-01-001-SOURCE-BOOTSTRAP.md
          scripts/scan-bootstrap.mjs
          server/identity-discovery.mjs
          server/index.mjs
          server/start-production.mjs
          tests/identity-discovery-smoke.mjs
          tests/production-identity-smoke.mjs
          tests/support/entra-fetch-fixture.mjs
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

          if git diff --cached -- . ':!*.lock' | grep -E 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}'; then
            echo 'Unexpected credential or private-key material in PR27 patch' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run locked engineering and security validation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/verify-baseline.mjs
          node scripts/scan-bootstrap.mjs --self-test
          npm run test:bootstrap-scan
          npm run typecheck
          npm run lint
          npm run test:identity-discovery
          env NODE_ENV=test APP_MODE=test VITE_APP_MODE=test ALLOW_TEST_FALLBACK=true VITE_ALLOW_TEST_FALLBACK=true npm test

          rm -rf dist
          env -u VITE_PRODUCT_NAME -u VITE_PRODUCT_LOGO_URL -u VITE_ORGANIZATION_NAME -u VITE_SUPPORT_NAME -u VITE_SUPPORT_EMAIL npm run build
          grep -q '<title>WorkOS</title>' dist/index.html
          grep -q 'href="/workos-mark.svg"' dist/index.html
          ! grep -R -n -E '%VITE_[A-Z0-9_]+%' dist

          rm -rf dist
          VITE_APP_MODE=production \
          VITE_ALLOW_TEST_FALLBACK=false \
          VITE_PRODUCT_NAME='Configured WorkOS' \
          VITE_ORGANIZATION_NAME='Acceptance Organization' \
          VITE_PRODUCT_LOGO_URL='/configured-workos.svg' \
          VITE_SUPPORT_NAME='WorkOS Acceptance Support' \
          VITE_SUPPORT_EMAIL='support@example.test' \
            npm run build
          grep -q '<title>Configured WorkOS</title>' dist/index.html
          grep -q 'href="/configured-workos.svg"' dist/index.html
          ! grep -R -n -E '%VITE_[A-Z0-9_]+%' dist
          rm -rf dist

          npm audit --omit=dev --json > /tmp/npm-audit-runtime.json || runtime_rc=$?
          RUNTIME_RC="${runtime_rc:-0}" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report = JSON.parse(readFileSync('/tmp/npm-audit-runtime.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (!counts || !Number.isInteger(counts.high) || !Number.isInteger(counts.critical)) {
            throw new Error('runtime audit metadata is incomplete');
          }
          if (counts.high > 0 || counts.critical > 0) process.exit(1);
          if (Number(process.env.RUNTIME_RC) !== 0 && Number(counts.total || 0) === 0) process.exit(1);
          console.log(JSON.stringify(counts, null, 2));
          NODE

          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --name-only)"
          test -z "$(git status --porcelain --untracked-files=normal | grep '^??' || true)"

      - name: Commit and publish under exact-old-head guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: bind production identity to governed authority'
          NEW_HEAD="$(git rev-parse HEAD)"
          git push origin \
            HEAD:"refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_OLD_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$NEW_HEAD"
          {
            echo '## PR27 security closure publication'
            echo
            echo "- Exact old head: \`$TARGET_OLD_HEAD\`"
            echo "- Published head: \`$NEW_HEAD\`"
            echo "- Recovery source local commit: \`$EXPECTED_LOCAL_COMMIT\`"
            echo "- Gzip: $EXPECTED_GZIP_BYTES bytes, \`$EXPECTED_GZIP_SHA256\`"
            echo "- Raw patch: $EXPECTED_PATCH_BYTES bytes, \`$EXPECTED_PATCH_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
