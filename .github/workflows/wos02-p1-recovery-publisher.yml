name: WOS-02 Controller Date Carrier TEMP

on:
  push:
    branches:
      - controller/wos02-p1-publisher-temp
    paths:
      - '.github/recovery/wos02-controller-date-trigger.txt'

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize-controller-date-carrier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary carrier branch
        uses: actions/checkout@v4
        with:
          ref: controller/wos02-p1-publisher-temp
          path: publisher
          fetch-depth: 0

      - name: Checkout exact controller parent
        uses: actions/checkout@v4
        with:
          ref: cfafb3bccff3e897cea9f88e111c581ce5012385
          path: controller
          fetch-depth: 0

      - name: Verify exact live authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C controller ls-remote origin refs/heads/main | awk '{print $1}')" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$(git -C controller ls-remote origin refs/heads/controller/wos02-exact-acceptance | awk '{print $1}')" = "cfafb3bccff3e897cea9f88e111c581ce5012385"
          test "$(git -C controller ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | awk '{print $1}')" = "ff278306c5394d3c43d0c860a736d783ad59d19c"
          gh api "repos/$GITHUB_REPOSITORY/pulls/37" > /tmp/pr37.json
          jq -e '.state == "open" and .draft == true and .merged_at == null and .head.sha == "ff278306c5394d3c43d0c860a736d783ad59d19c" and .base.sha == "3070c80a71640fa4275477d0d2f1538cc8d2a819" and .changed_files == 43' /tmp/pr37.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/pulls/38" > /tmp/pr38.json
          jq -e '.state == "open" and .draft == true and .merged_at == null and .head.sha == "cfafb3bccff3e897cea9f88e111c581ce5012385" and .base.sha == "3070c80a71640fa4275477d0d2f1538cc8d2a819"' /tmp/pr38.json >/dev/null
          grep -q 'TARGET_HEAD: ff278306c5394d3c43d0c860a736d783ad59d19c' controller/.github/workflows/wos02-final-review-acceptance.yml
          grep -q 'TARGET_TREE: d81d00223cc64d1db25695395bc0b696f82e34cd' controller/.github/workflows/wos02-final-review-acceptance.yml

      - name: Apply only date-normalization controller correction
        shell: bash
        run: |
          set -euo pipefail
          cd controller
          python3 ../publisher/.github/scripts/wos02-controller-rebind-temp.py
          node --check .github/scripts/wos02-mutation-lifecycle-acceptance.mjs
          test "$(grep -o "toIsoDate(after.employee.exit_date)" .github/scripts/wos02-mutation-lifecycle-acceptance.mjs | wc -l)" = "3"
          test "$(grep -o "String(after.employee.exit_date).slice(0,10)" .github/scripts/wos02-mutation-lifecycle-acceptance.mjs | wc -l)" = "0"
          grep -q "const toIsoDate = value => value instanceof Date ? value.toISOString().slice(0,10) : String(value ?? '').slice(0,10);" .github/scripts/wos02-mutation-lifecycle-acceptance.mjs
          git diff --check
          mapfile -t files < <(git diff --name-only)
          test "${#files[@]}" = "1"
          test "${files[0]}" = ".github/scripts/wos02-mutation-lifecycle-acceptance.mjs"
          test -z "$(git diff -- .github/workflows/wos02-final-review-acceptance.yml)"

      - name: Publish inert verified script carrier to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publisher/.github/recovery/wos02-controller-date-fix
          cp controller/.github/scripts/wos02-mutation-lifecycle-acceptance.mjs publisher/.github/recovery/wos02-controller-date-fix/mutation-lifecycle.mjs
          {
            echo "controller_parent=cfafb3bccff3e897cea9f88e111c581ce5012385"
            echo "product_head=ff278306c5394d3c43d0c860a736d783ad59d19c"
            echo "product_tree=d81d00223cc64d1db25695395bc0b696f82e34cd"
            sha256sum publisher/.github/recovery/wos02-controller-date-fix/mutation-lifecycle.mjs
            wc -c publisher/.github/recovery/wos02-controller-date-fix/mutation-lifecycle.mjs
          } > publisher/.github/recovery/wos02-controller-date-fix/manifest.txt
          cd publisher
          git config user.name "WorkOS Implementation Controller"
          git config user.email "noreply@github.com"
          git add .github/recovery/wos02-controller-date-fix/
          git diff --cached --check
          git commit -m "chore: materialize WOS-02 controller date-fix carrier"
          git push origin HEAD:refs/heads/controller/wos02-p1-publisher-temp
