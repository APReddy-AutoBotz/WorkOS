name: WOS-02 Exit Replay Recovery Publisher TEMP

on:
  push:
    branches:
      - controller/wos02-p1-publisher-temp
    paths:
      - .github/recovery/exit-replay-v2-trigger.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  publish-exact-exit-replay-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary publisher authority
        uses: actions/checkout@v4
        with:
          ref: controller/wos02-p1-publisher-temp
          path: publisher
          fetch-depth: 0

      - name: Checkout exact product parent
        uses: actions/checkout@v4
        with:
          ref: 436ac4ad7f984cd402495d25a8d2799a9947f217
          path: product
          fetch-depth: 0

      - name: Verify exact live authority before reconstruction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_remote="$(git -C product ls-remote origin refs/heads/main | awk '{print $1}')"
          product_remote="$(git -C product ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | awk '{print $1}')"
          test "$main_remote" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$product_remote" = "436ac4ad7f984cd402495d25a8d2799a9947f217"
          test "$(git -C product rev-parse HEAD)" = "436ac4ad7f984cd402495d25a8d2799a9947f217"
          test "$(git -C product rev-parse HEAD^{tree})" = "d7ceedbd604fc0cc35febc28600ef006990b0484"

          gh api "repos/$GITHUB_REPOSITORY/pulls/37" > /tmp/pr37.json
          jq -e '.state == "open" and .draft == true and .merged_at == null and .head.ref == "codex/wos-02-organization-setup-foundation" and .head.sha == "436ac4ad7f984cd402495d25a8d2799a9947f217" and .base.ref == "main" and .base.sha == "3070c80a71640fa4275477d0d2f1538cc8d2a819"' /tmp/pr37.json >/dev/null
          test "$(jq -r '.changed_files' /tmp/pr37.json)" = "43"

          gh api "repos/$GITHUB_REPOSITORY/pulls/38" > /tmp/pr38.json
          jq -e '.state == "open" and .draft == true and .merged_at == null and .head.ref == "controller/wos02-exact-acceptance" and .head.sha == "544d08699294b36bf4f2ad4af033b6430e60776d"' /tmp/pr38.json >/dev/null

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/37/files?per_page=100" --jq '.[].filename' | sort -u > /tmp/pr37-files.txt
          test "$(wc -l < /tmp/pr37-files.txt)" = "43"
          grep '^server/migrations/' /tmp/pr37-files.txt | sort > /tmp/migrations.txt
          cat > /tmp/expected-migrations.txt <<'EOF'
          server/migrations/022_organization_setup_foundation.sql
          server/migrations/023_wos02_scope_lifecycle_integrity.sql
          server/migrations/024_wos02_final_review_closure.sql
          server/migrations/025_wos02_timesheet_scope_integrity.sql
          server/migrations/025a_wos02_project_legal_scope_unique_prerequisite.sql
          server/migrations/026_wos02_canonical_legal_scope_integrity.sql
          server/migrations/027_wos02_reporting_period_authority.sql
          server/migrations/028_wos02_organization_legal_entity_profiles.sql
          server/migrations/029_wos02_working_calendar_authority.sql
          EOF
          diff -u /tmp/expected-migrations.txt /tmp/migrations.txt

      - name: Verify and reconstruct exact recovery payload
        shell: bash
        run: |
          set -euo pipefail
          cd publisher/.github/recovery
          test "$(wc -c < exit-replay-v2-payload-00.b64)" = "1200"
          test "$(wc -c < exit-replay-v2-payload-01.b64)" = "1200"
          test "$(wc -c < exit-replay-v2-payload-02.b64)" = "760"
          echo "8b930d0dd4b8f72f26217c3722c096e904284d598c252d0fccdb15ba8a9cc78e  exit-replay-v2-payload-00.b64" | sha256sum -c -
          echo "119dc2ff78859f27ee23fc64ee3a34ddd5b68e374d28bfe8e172d9f0bd1ccf49  exit-replay-v2-payload-01.b64" | sha256sum -c -
          echo "5fdabce9ed90fe45d2e02f1dafc301ea91d210c02de4541c601faa983b2461c8  exit-replay-v2-payload-02.b64" | sha256sum -c -
          cat exit-replay-v2-payload-{00..02}.b64 > "$GITHUB_WORKSPACE/payload.b64"
          test "$(wc -c < "$GITHUB_WORKSPACE/payload.b64")" = "3160"
          base64 -d "$GITHUB_WORKSPACE/payload.b64" > "$GITHUB_WORKSPACE/exit-replay-v2.diff.gz"
          test "$(wc -c < "$GITHUB_WORKSPACE/exit-replay-v2.diff.gz")" = "2370"
          echo "bae50154044191e8eda9371de381a2fb49a912591145e888e0ba2029019bb277  $GITHUB_WORKSPACE/exit-replay-v2.diff.gz" | sha256sum -c -
          gzip -dc "$GITHUB_WORKSPACE/exit-replay-v2.diff.gz" > "$GITHUB_WORKSPACE/exit-replay-v2.diff"
          test "$(wc -c < "$GITHUB_WORKSPACE/exit-replay-v2.diff")" = "8427"
          echo "c7951477e93cb120db83ccced9de8a9a20f60132599761fffb92e47a3a55bd95  $GITHUB_WORKSPACE/exit-replay-v2.diff" | sha256sum -c -

      - name: Apply exact bounded recovery and verify target tree
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git apply --check --binary "$GITHUB_WORKSPACE/exit-replay-v2.diff"
          git apply --binary "$GITHUB_WORKSPACE/exit-replay-v2.diff"
          git diff --check
          mapfile -t files < <(git diff --name-only | sort)
          test "${#files[@]}" = "2"
          test "${files[0]}" = "server/index.mjs"
          test "${files[1]}" = "tests/organization-setup-smoke.mjs"
          read -r adds dels < <(git diff --numstat | awk '{a+=$1; d+=$2} END {print a,d}')
          test "$adds" = "39"
          test "$dels" = "7"
          git add server/index.mjs tests/organization-setup-smoke.mjs
          test "$(git write-tree)" = "d81d00223cc64d1db25695395bc0b696f82e34cd"

      - name: Focused retained verification
        shell: bash
        run: |
          set -euo pipefail
          cd product
          npm ci
          npm run test:organization-setup
          npm run test:backend
          npm run test:authorization-convergence
          APP_MODE=test ALLOW_TEST_FALLBACK=true npm test
          npm run typecheck
          npm run lint
          npm run build
          npm run test:bootstrap-scan
          npm run test:wos00-baseline
          NODE_ENV=production node server/index.mjs >/tmp/wos02-prod-start.log 2>&1 && exit 1 || true
          grep -q "Production startup blocked" /tmp/wos02-prod-start.log

      - name: Commit exact verified product tree
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "WorkOS Implementation Controller"
          git config user.email "noreply@github.com"
          git commit -m "fix: preserve idempotent exited worker replays"
          test "$(git rev-parse HEAD^)" = "436ac4ad7f984cd402495d25a8d2799a9947f217"
          test "$(git rev-parse HEAD^{tree})" = "d81d00223cc64d1db25695395bc0b696f82e34cd"

      - name: Verify second exact live lease and non-force publish PR37 branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_remote="$(git -C product ls-remote origin refs/heads/main | awk '{print $1}')"
          product_remote="$(git -C product ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | awk '{print $1}')"
          test "$main_remote" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$product_remote" = "436ac4ad7f984cd402495d25a8d2799a9947f217"
          gh api "repos/$GITHUB_REPOSITORY/pulls/37" > /tmp/pr37-second.json
          jq -e '.state == "open" and .draft == true and .merged_at == null and .head.sha == "436ac4ad7f984cd402495d25a8d2799a9947f217" and .base.sha == "3070c80a71640fa4275477d0d2f1538cc8d2a819" and .changed_files == 43' /tmp/pr37-second.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/pulls/38" > /tmp/pr38-second.json
          jq -e '.state == "open" and .draft == true and .merged_at == null and .head.sha == "544d08699294b36bf4f2ad4af033b6430e60776d"' /tmp/pr38-second.json >/dev/null
          git -C product push origin HEAD:refs/heads/codex/wos-02-organization-setup-foundation
