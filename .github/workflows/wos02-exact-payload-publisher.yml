name: WOS-02 exact payload publisher

on:
  push:
    branches:
      - codex/wos-02-organization-setup-foundation
    paths:
      - .github/workflows/wos02-exact-payload-publisher.yml

permissions:
  contents: write

concurrency:
  group: wos02-exact-payload-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper head
        uses: actions/checkout@v4
        with:
          fetch-depth: 16
          persist-credentials: true

      - name: Apply exact controller-verified payload
        shell: bash
        env:
          EXPECTED_BASE: 072a1f1f6c7826f4c2b62566a033a32fa507a981
          EXPECTED_TREE: 799fb8711d7d770ac3a6ee67f7267100d3aa184d
          EXPECTED_GZIP_SHA256: 25bb7e6b32fdf5b45cd43009e18cb55149592e31b2128f817a59df2047fd041b
          EXPECTED_RAW_SHA256: d04b45e71fee7e2db9e2a5594af2e4d15991a0113b0fc1a365bb7aae3178dda6
          EXPECTED_GZIP_SIZE: "11169"
          EXPECTED_RAW_SIZE: "47824"
        run: |
          set -euo pipefail
          helpers=(
            .github/workflows/wos02-exact-payload-publisher.yml
            .github/wos02-recovery-payload.b64
            .github/wos02-payload.part0
            .github/wos02-payload.part1
            .github/wos02-payload.part2
            .github/wos02-payload.part3
            .github/wos02-payload.part4
          )
          test "${GITHUB_REF_NAME}" = "codex/wos-02-organization-setup-foundation"
          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          actual_pre="$(git diff --name-only "$EXPECTED_BASE" HEAD | sort)"
          expected_pre="$(printf '%s\n' "${helpers[@]}" | sort)"
          test "$actual_pre" = "$expected_pre"

          cat .github/wos02-payload.part0 .github/wos02-payload.part1 .github/wos02-payload.part2 .github/wos02-payload.part3 .github/wos02-payload.part4 > /tmp/payload.b64
          test "$(wc -c < /tmp/payload.b64 | tr -d ' ')" = "14892"
          base64 -d /tmp/payload.b64 > /tmp/payload.gz
          test "$(wc -c < /tmp/payload.gz | tr -d ' ')" = "$EXPECTED_GZIP_SIZE"
          test "$(sha256sum /tmp/payload.gz | awk '{print $1}')" = "$EXPECTED_GZIP_SHA256"
          gzip -dc /tmp/payload.gz > /tmp/wos02.diff
          test "$(wc -c < /tmp/wos02.diff | tr -d ' ')" = "$EXPECTED_RAW_SIZE"
          test "$(sha256sum /tmp/wos02.diff | awk '{print $1}')" = "$EXPECTED_RAW_SHA256"

          git apply --check --binary /tmp/wos02.diff
          git apply --binary /tmp/wos02.diff
          git add -A
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "9"

          git update-index --force-remove "${helpers[@]}"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git reset HEAD -- "${helpers[@]}"
          for helper in "${helpers[@]}"; do test -f "$helper"; done

          git config user.name "WorkOS WOS-02 Controller"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: add organization setup foundation"
          git push origin HEAD:refs/heads/codex/wos-02-organization-setup-foundation
