name: WOS-02 exact payload publisher

on:
  push:
    branches:
      - codex/wos-02-organization-setup-foundation
    paths:
      - .github/workflows/wos02-exact-payload-publisher.yml

permissions:
  contents: write

concurrency:
  group: wos02-exact-payload-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: true

