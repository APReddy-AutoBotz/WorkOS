name: WorkOS WOS-01A Subject-Only Identity Publisher

on:
  push:
    branches:
      - controller/workos-root-publisher-v1
    paths:
      - '.github/workflows/workos-pr26-token-isolated-proof-v1.yml'
      - '.github/scripts/publish-wos01a-subject-only.sh'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: workos-wos01a-subject-only-publisher
  cancel-in-progress: false

env:
  TARGET_PR: '27'
  TARGET_BRANCH: codex/wos01a-acceptance-closure
  OLD_TARGET_HEAD: b4d0a37322c428035122306fd3b77e35f5dffb7a
  PARENT_PR: '16'
  PARENT_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
  PARENT_HEAD: 590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60
  EXPECTED_MAIN_HEAD: 44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42

jobs:
  publish:
    name: Verify, correct and publish exact product head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify exact live target, parent and main
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const {data: target} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR),
            });
            const {data: parent} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PARENT_PR),
            });
            const {data: main} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (target.state !== 'open' || !target.draft) failures.push(`target=${target.state}/${target.draft}`);
            if (target.head.ref !== process.env.TARGET_BRANCH || target.head.sha !== process.env.OLD_TARGET_HEAD) failures.push(`target.head=${target.head.ref}@${target.head.sha}`);
            if (target.base.ref !== process.env.PARENT_BRANCH || target.base.sha !== process.env.PARENT_HEAD) failures.push(`target.base=${target.base.ref}@${target.base.sha}`);
            if (parent.state !== 'open' || !parent.draft) failures.push(`parent=${parent.state}/${parent.draft}`);
            if (parent.head.ref !== process.env.PARENT_BRANCH || parent.head.sha !== process.env.PARENT_HEAD) failures.push(`parent.head=${parent.head.ref}@${parent.head.sha}`);
            if (parent.base.ref !== 'main') failures.push(`parent.base.ref=${parent.base.ref}`);
            if (main.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push(`main=${main.commit.sha}`);
            if (failures.length) core.setFailed(failures.join(', '));

      - name: Checkout publisher script without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: controller/workos-root-publisher-v1
          path: publisher
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact product head without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OLD_TARGET_HEAD }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Execute deterministic exact-old-head publisher
        shell: bash
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../publisher/.github/scripts/publish-wos01a-subject-only.sh
