name: WOS-02 Terminology Recovery Publisher

on:
  push:
    branches:
      - controller/wos02-terminology-publisher-temp

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact product base
        uses: actions/checkout@v4
        with:
          ref: c2d067cd63b7c84b5ec51dafe5f500730f6d3276
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact live lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c2d067cd63b7c84b5ec51dafe5f500730f6d3276"
          test "$(git rev-parse HEAD^{tree})" = "56d09de608606596397129ffa628fe6e6d4838ce"
          MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          PROD="$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | awk '{print $1}')"
          test "$MAIN" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$PROD" = "c2d067cd63b7c84b5ec51dafe5f500730f6d3276"

      - name: Reconstruct and verify exact terminology payload
        shell: bash
        run: |
          set -euo pipefail
          git show origin/controller/wos02-terminology-publisher-temp:.github/terminology-recovery.diff.gz > /tmp/terminology.diff.gz
          test "$(wc -c < /tmp/terminology.diff.gz)" = "12703"
          echo "7f8f278c9d321245dfbfd7a2e5cf71c1e3478cbe1d8f0b3e96cbd5e71614c701  /tmp/terminology.diff.gz" | sha256sum -c -
          gzip -dc /tmp/terminology.diff.gz > /tmp/terminology.diff
          test "$(wc -c < /tmp/terminology.diff)" = "54482"
          echo "50c95d61a8db626858ca1b04247ea875fb63467f25e3a79e1f1bd04bb614aee8  /tmp/terminology.diff" | sha256sum -c -
          git apply --check --binary /tmp/terminology.diff
          git apply --binary /tmp/terminology.diff
          git diff --check
          git add -A
          test "$(git write-tree)" = "c5387984997e765690f0ebd2a89437701a9279e0"

      - name: Focused terminology verification
        shell: bash
        env:
          APP_MODE: test
          ALLOW_TEST_FALLBACK: "true"
        run: |
          set -euo pipefail
          npm ci
          npm run test:terminology-runtime
          npm run test:organization-setup
          npm run typecheck
          npm run lint
          npm run build
          npm run test:bootstrap-scan
          npm run test:wos00-baseline
          git diff --cached --check

      - name: Commit exact terminology tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WorkOS implementation controller"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: finalize runtime terminology coverage"
          test "$(git rev-parse HEAD^)" = "c2d067cd63b7c84b5ec51dafe5f500730f6d3276"
          test "$(git rev-parse HEAD^{tree})" = "c5387984997e765690f0ebd2a89437701a9279e0"

      - name: Verify lease again and publish non-force
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          PROD="$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | awk '{print $1}')"
          test "$MAIN" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$PROD" = "c2d067cd63b7c84b5ec51dafe5f500730f6d3276"
          git push origin HEAD:refs/heads/codex/wos-02-organization-setup-foundation
