name: WOS-02 Terminology Recovery Publisher

on:
  push:
    branches:
      - controller/wos02-terminology-publisher-temp

permissions:
  contents: write
  issues: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact product base
        uses: actions/checkout@v4
        with:
          ref: c2d067cd63b7c84b5ec51dafe5f500730f6d3276
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact live lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c2d067cd63b7c84b5ec51dafe5f500730f6d3276"
          test "$(git rev-parse HEAD^{tree})" = "56d09de608606596397129ffa628fe6e6d4838ce"
          MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          PROD="$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | awk '{print $1}')"
          test "$MAIN" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$PROD" = "c2d067cd63b7c84b5ec51dafe5f500730f6d3276"

      - name: Fetch exact recovery result comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const response = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: 5552885251,
            });
            fs.writeFileSync('/tmp/comment-body.txt', response.data.body, 'utf8');

      - name: Reconstruct and verify complete terminology recovery payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, re
          body = open('/tmp/comment-body.txt', encoding='utf-8').read()
          pattern = re.compile(
              r"### TERM-FINAL-PAYLOAD-(\d+).*?"
              r"Character count: `(\d+)`.*?"
              r"SHA-256: `([0-9a-f]{64})`.*?"
              r"```text\n([A-Za-z0-9+/=]+)\n```",
              re.S,
          )
          rows = sorted(pattern.findall(body), key=lambda row: int(row[0]))
          assert len(rows) == 15, f"expected 15 chunks, got {len(rows)}"
          assert [int(row[0]) for row in rows] == list(range(15))
          chunks = []
          for index, count, expected_sha, payload in rows:
              assert len(payload) == int(count), (index, len(payload), count)
              assert hashlib.sha256(payload.encode()).hexdigest() == expected_sha
              chunks.append(payload)
          encoded = ''.join(chunks)
          assert len(encoded) == 16940
          compressed = base64.b64decode(encoded, validate=True)
          assert len(compressed) == 12703
          assert hashlib.sha256(compressed).hexdigest() == '7f8f278c9d321245dfbfd7a2e5cf71c1e3478cbe1d8f0b3e96cbd5e71614c701'
          raw = gzip.decompress(compressed)
          assert len(raw) == 54482
          assert hashlib.sha256(raw).hexdigest() == '50c95d61a8db626858ca1b04247ea875fb63467f25e3a79e1f1bd04bb614aee8'
          open('/tmp/terminology.diff', 'wb').write(raw)
          PY
          git apply --check --binary /tmp/terminology.diff
          git apply --binary /tmp/terminology.diff
          git diff --check
          git add -A
          test "$(git write-tree)" = "c5387984997e765690f0ebd2a89437701a9279e0"

      - name: Focused terminology verification
        shell: bash
        env:
          APP_MODE: test
          ALLOW_TEST_FALLBACK: "true"
        run: |
          set -euo pipefail
          npm ci
          npm run test:terminology-runtime
          npm run test:organization-setup
          npm run typecheck
          npm run lint
          npm run build
          npm run test:bootstrap-scan
          npm run test:wos00-baseline
          git diff --cached --check

      - name: Commit exact terminology tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WorkOS implementation controller"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: finalize runtime terminology coverage"
          test "$(git rev-parse HEAD^)" = "c2d067cd63b7c84b5ec51dafe5f500730f6d3276"
          test "$(git rev-parse HEAD^{tree})" = "c5387984997e765690f0ebd2a89437701a9279e0"

      - name: Verify lease again and publish non-force
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          PROD="$(git ls-remote origin refs/heads/codex/wos-02-organization-setup-foundation | awk '{print $1}')"
          test "$MAIN" = "3070c80a71640fa4275477d0d2f1538cc8d2a819"
          test "$PROD" = "c2d067cd63b7c84b5ec51dafe5f500730f6d3276"
          git push origin HEAD:refs/heads/codex/wos-02-organization-setup-foundation
