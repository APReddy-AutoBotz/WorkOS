name: WOS-02 Allocation Recovery Publisher

on:
  push:
    branches: [controller/wos02-migration-publisher-temp2]
    paths: ['.github/workflows/wos02-allocation-recovery-publisher.yml']

permissions:
  contents: write
  pull-requests: read

env:
  EXPECTED_MAIN: 3070c80a71640fa4275477d0d2f1538cc8d2a819
  EXPECTED_PRODUCT: 031be9e18b6871594f0cfef25f8b098741dde74c
  EXPECTED_PRODUCT_TREE: 6f8813a9bb0a4821734ae8cd0a60f935fe1e16e1
  RESULT_TREE: 78bc027edc4f44b2e4e5c8a773c1b0e75cd4af3e
  RAW_BYTES: '4416'
  RAW_SHA: e5deb0c5f02641d07530445aea32c5e83d53b58a48f6fdd100c59d26d5dd0ffb
  GZIP_BYTES: '1341'
  GZIP_SHA: 79651d3456d20ffb3be758977d4bad43c94d1dd44f0740d0020a2c25890b358c
  TARGET_BRANCH: codex/wos-02-organization-setup-foundation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact live leases
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const {data: main} = await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            const {data: pr} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:37});
            if (main.commit.sha !== process.env.EXPECTED_MAIN) failures.push(`main=${main.commit.sha}`);
            if (pr.state !== 'open' || !pr.draft) failures.push(`PR37 lifecycle=${pr.state}/draft:${pr.draft}`);
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`PR37 branch=${pr.head.ref}`);
            if (pr.head.sha !== process.env.EXPECTED_PRODUCT) failures.push(`PR37 head=${pr.head.sha}`);
            if (pr.base.sha !== process.env.EXPECTED_MAIN) failures.push(`PR37 base=${pr.base.sha}`);
            const {data: commit} = await github.rest.repos.getCommit({owner:context.repo.owner,repo:context.repo.repo,ref:process.env.EXPECTED_PRODUCT});
            if (commit.commit.tree.sha !== process.env.EXPECTED_PRODUCT_TREE) failures.push(`PR37 tree=${commit.commit.tree.sha}`);
            if (failures.length) core.setFailed(`lease failed: ${failures.join('; ')}`);

      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_PRODUCT }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply exact recovery payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_PRODUCT_TREE"
          cat > "$RUNNER_TEMP/payload.b64" <<'PAYLOAD'
          
          PAYLOAD
          base64 -d "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/correction.diff.gz"
          test "$(wc -c < "$RUNNER_TEMP/correction.diff.gz")" = "$GZIP_BYTES"
          echo "$GZIP_SHA  $RUNNER_TEMP/correction.diff.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/correction.diff.gz" > "$RUNNER_TEMP/correction.diff"
          test "$(wc -c < "$RUNNER_TEMP/correction.diff")" = "$RAW_BYTES"
          echo "$RAW_SHA  $RUNNER_TEMP/correction.diff" | sha256sum -c -
          git apply --binary "$RUNNER_TEMP/correction.diff"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "server/index.mjs tests/organization-setup-smoke.mjs "
          git diff --check
          git add server/index.mjs tests/organization-setup-smoke.mjs
          git config user.name 'WorkOS Controller'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: allow explicit allocation IDs on create'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RESULT_TREE"

      - name: Revalidate live lease immediately before publish
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const {data: main} = await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            const {data: pr} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:37});
            if (main.commit.sha !== process.env.EXPECTED_MAIN) failures.push(`main=${main.commit.sha}`);
            if (pr.state !== 'open' || !pr.draft) failures.push(`PR37 lifecycle=${pr.state}/draft:${pr.draft}`);
            if (pr.head.sha !== process.env.EXPECTED_PRODUCT) failures.push(`PR37 head=${pr.head.sha}`);
            if (pr.head.ref !== process.env.TARGET_BRANCH) failures.push(`PR37 branch=${pr.head.ref}`);
            if (failures.length) core.setFailed(`pre-publish lease failed: ${failures.join('; ')}`);

      - name: Non-force fast-forward existing product branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Verify published exact product tree
        uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:37});
            if (pr.state !== 'open' || !pr.draft) return core.setFailed(`PR37 lifecycle=${pr.state}/draft:${pr.draft}`);
            const {data: commit} = await github.rest.repos.getCommit({owner:context.repo.owner,repo:context.repo.repo,ref:pr.head.sha});
            if (commit.commit.tree.sha !== process.env.RESULT_TREE) core.setFailed(`published tree=${commit.commit.tree.sha}`);
            if (commit.parents?.[0]?.sha !== process.env.EXPECTED_PRODUCT) core.setFailed(`published parent=${commit.parents?.[0]?.sha}`);
