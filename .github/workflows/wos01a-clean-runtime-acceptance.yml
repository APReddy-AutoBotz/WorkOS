name: WOS-01A Clean Runtime Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - '.github/workflows/wos01a-clean-runtime-acceptance.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wos01a-clean-runtime-acceptance
  cancel-in-progress: false

env:
  TARGET_PR_NUMBER: '16'
  TARGET_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
  EXPECTED_TARGET_HEAD: 590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60
  EXPECTED_TARGET_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  EXPECTED_MAIN_HEAD: 44aeaa8eb5ba67692cbcb7fef48239dbbfc77a42
  CONTROLLER_BRANCH: controller/wos01a-clean-runtime-acceptance
  CONTROLLER_PATH: .github/workflows/wos01a-clean-runtime-acceptance.yml

jobs:
  authority:
    name: Verify exact read-only acceptance authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify controller PR and target PR identities
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              return core.setFailed(`Unsupported event: ${context.eventName}`);
            }

            const controller = context.payload.pull_request;
            const failures = [];
            if (!controller) failures.push('missing controller pull_request payload');
            if (controller?.state !== 'open') failures.push(`controller.state=${controller?.state}`);
            if (!controller?.draft) failures.push('controller PR must remain Draft');
            if (controller?.head?.ref !== process.env.CONTROLLER_BRANCH) {
              failures.push(`controller.head.ref=${controller?.head?.ref}`);
            }
            if (controller?.base?.ref !== 'main') failures.push(`controller.base.ref=${controller?.base?.ref}`);
            if (controller?.base?.sha !== process.env.EXPECTED_MAIN_HEAD) {
              failures.push(`controller.base.sha=${controller?.base?.sha}`);
            }

            const { data: mainBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (mainBranch.commit.sha !== process.env.EXPECTED_MAIN_HEAD) {
              failures.push(`current.main=${mainBranch.commit.sha}`);
            }

            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: controller.number,
              per_page: 100,
            });
            const changedPaths = changed.map(file => file.filename).sort();
            if (changedPaths.length !== 1 || changedPaths[0] !== process.env.CONTROLLER_PATH) {
              failures.push(`controller.changedPaths=${JSON.stringify(changedPaths)}`);
            }

            const { data: target } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR_NUMBER),
            });
            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target PR is not Draft');
            if (target.merged_at) failures.push(`target.merged_at=${target.merged_at}`);
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha !== process.env.EXPECTED_TARGET_HEAD) failures.push(`target.head.sha=${target.head.sha}`);
            if (target.base.ref !== 'main') failures.push(`target.base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.EXPECTED_TARGET_BASE) failures.push(`target.base.sha=${target.base.sha}`);

            if (failures.length) {
              core.setFailed(`WOS-01A acceptance authority failed: ${failures.join(', ')}`);
            }

      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current main and one-file controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "$CONTROLLER_BRANCH"
          test "$GITHUB_BASE_REF" = "main"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e "$EXPECTED_MAIN_HEAD^{commit}"
          git merge-base --is-ancestor "$EXPECTED_MAIN_HEAD" HEAD

          trusted_origin="https://github.com/${GITHUB_REPOSITORY}"
          case "$(git remote get-url origin)" in
            "$trusted_origin"|"$trusted_origin.git") ;;
            *) echo "Unexpected origin URL" >&2; exit 1 ;;
          esac

          mapfile -t changed_paths < <(git diff --name-only "$EXPECTED_MAIN_HEAD"...HEAD)
          test "${#changed_paths[@]}" -eq 1
          test "${changed_paths[0]}" = "$CONTROLLER_PATH"

  static_dependency:
    name: Exact-head static, dependency and default-build acceptance
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact WOS-01A head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify exact implementation identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$EXPECTED_TARGET_BASE" HEAD
          mkdir -p acceptance-artifacts
          : > acceptance-artifacts/static-failures.txt

      - name: Locked install and retained checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee acceptance-artifacts/npm-ci.log

          run_check() {
            check_name="$1"
            log_file="$2"
            shift 2
            set +e
            "$@" 2>&1 | tee "$log_file"
            check_rc="${PIPESTATUS[0]}"
            set -e
            if test "$check_rc" -ne 0; then
              echo "${check_name} failed with exit ${check_rc}." >> acceptance-artifacts/static-failures.txt
            fi
          }

          run_check "Type check" acceptance-artifacts/typecheck.log npm run typecheck
          run_check "Configured lint command" acceptance-artifacts/lint.log npm run lint
          run_check "WOS-00 baseline verifier" acceptance-artifacts/wos00-baseline.log npm run test:wos00-baseline
          run_check "Bootstrap security scan" acceptance-artifacts/bootstrap-scan.log npm run test:bootstrap-scan

          run_check "Retained safe test suite" acceptance-artifacts/retained-tests.log \
            env \
              NODE_ENV=test \
              APP_MODE=test \
              VITE_APP_MODE=test \
              ALLOW_TEST_FALLBACK=true \
              VITE_ALLOW_TEST_FALLBACK=true \
              npm test

      - name: Classify full and production dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          full_rc=0
          prod_rc=0
          npm audit --json > acceptance-artifacts/npm-audit-full.json || full_rc=$?
          npm audit --omit=dev --json > acceptance-artifacts/npm-audit-production.json || prod_rc=$?
          FULL_RC="$full_rc" PROD_RC="$prod_rc" node --input-type=module <<'NODE' | tee acceptance-artifacts/npm-audit-summary.json
          import { readFileSync, appendFileSync } from 'node:fs';

          const readAudit = (file) => {
            try {
              return JSON.parse(readFileSync(file, 'utf8'));
            } catch (error) {
              appendFileSync('acceptance-artifacts/static-failures.txt', `Dependency audit JSON unreadable for ${file}: ${error.message}\n`);
              return {};
            }
          };

          const counts = (audit) => {
            const source = audit?.metadata?.vulnerabilities || {};
            return {
              info: Number(source.info || 0),
              low: Number(source.low || 0),
              moderate: Number(source.moderate || 0),
              high: Number(source.high || 0),
              critical: Number(source.critical || 0),
              total: Number(source.total || 0),
            };
          };

          const full = counts(readAudit('acceptance-artifacts/npm-audit-full.json'));
          const production = counts(readAudit('acceptance-artifacts/npm-audit-production.json'));
          const summary = {
            fullCommandExit: Number(process.env.FULL_RC),
            productionCommandExit: Number(process.env.PROD_RC),
            full,
            production,
            policy: 'Production high/critical advisories are merge blockers; development-only findings require explicit disposition.',
          };
          console.log(JSON.stringify(summary, null, 2));

          if (production.high > 0 || production.critical > 0) {
            appendFileSync(
              'acceptance-artifacts/static-failures.txt',
              `Production dependency audit has ${production.high} high and ${production.critical} critical advisories.\n`,
            );
          }
          if (Number(process.env.FULL_RC) !== 0 && full.total === 0) {
            appendFileSync('acceptance-artifacts/static-failures.txt', 'Full dependency audit failed without parseable advisory counts.\n');
          }
          if (Number(process.env.PROD_RC) !== 0 && production.total === 0) {
            appendFileSync('acceptance-artifacts/static-failures.txt', 'Production dependency audit failed without parseable advisory counts.\n');
          }
          NODE

      - name: Build with no branding environment and reject unresolved tokens
        shell: bash
        run: |
          set -euo pipefail
          build_rc=0
          env \
            -u VITE_PRODUCT_NAME \
            -u VITE_PRODUCT_LOGO_URL \
            -u VITE_ORGANIZATION_NAME \
            -u VITE_SUPPORT_NAME \
            -u VITE_SUPPORT_EMAIL \
            npm run build > acceptance-artifacts/default-build.log 2>&1 || build_rc=$?
          cat acceptance-artifacts/default-build.log

          if test "$build_rc" -ne 0; then
            echo "Default production build failed with exit $build_rc." >> acceptance-artifacts/static-failures.txt
          fi

          if grep -E '%VITE_(PRODUCT_NAME|PRODUCT_LOGO_URL)%' acceptance-artifacts/default-build.log >/dev/null; then
            echo "Default build emitted unresolved product-name/logo placeholder warnings." >> acceptance-artifacts/static-failures.txt
          fi

          if test -f dist/index.html && grep -E '%VITE_(PRODUCT_NAME|PRODUCT_LOGO_URL)%' dist/index.html >/dev/null; then
            echo "Default dist/index.html contains unresolved product-name/logo placeholders." >> acceptance-artifacts/static-failures.txt
          fi

          if test -f dist/index.html; then
            cp dist/index.html acceptance-artifacts/default-dist-index.html
          fi

      - name: Static acceptance adjudication
        shell: bash
        run: |
          set -euo pipefail
          if test -s acceptance-artifacts/static-failures.txt; then
            echo "WOS-01A static acceptance blockers:"
            cat acceptance-artifacts/static-failures.txt
            exit 1
          fi
          echo "No static/dependency/default-build merge blocker detected."

      - name: Upload static acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01a-static-dependency-${{ env.EXPECTED_TARGET_HEAD }}
          path: acceptance-artifacts
          if-no-files-found: error
          retention-days: 14

  database_runtime:
    name: Disposable PostgreSQL migration and production-runtime acceptance
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos-acceptance
          POSTGRES_DB: workos_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d workos_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://workos:workos-acceptance@127.0.0.1:5432/workos_acceptance
      UPGRADE_DATABASE_URL: postgresql://workos:workos-acceptance@127.0.0.1:5432/workos_upgrade
      PGSSLMODE: disable
    steps:
      - name: Checkout exact WOS-01A head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          mkdir -p acceptance-artifacts
          npm ci --ignore-scripts 2>&1 | tee acceptance-artifacts/npm-ci.log

      - name: Execute fresh and replay migrations
        shell: bash
        run: |
          set -euo pipefail
          npm run api:migrate 2>&1 | tee acceptance-artifacts/migrate-fresh.log
          npm run api:migrate 2>&1 | tee acceptance-artifacts/migrate-replay.log

          node --input-type=module <<'NODE' | tee acceptance-artifacts/migration-fresh-summary.json
          import pg from 'pg';
          import { readdirSync } from 'node:fs';

          const expected = 1 + readdirSync('server/migrations').filter(name => name.endsWith('.sql')).length;
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const rows = await pool.query('select id from schema_migrations order by id');
          const summary = { expectedMigrationCount: expected, actualMigrationCount: rows.rowCount, migrationIds: rows.rows.map(row => row.id) };
          console.log(JSON.stringify(summary, null, 2));
          await pool.end();
          if (rows.rowCount !== expected) process.exit(1);
          NODE

      - name: Execute upgrade-style migration path
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { readFileSync } from 'node:fs';

          const admin = new pg.Client({
            connectionString: 'postgresql://workos:workos-acceptance@127.0.0.1:5432/postgres',
          });
          await admin.connect();
          await admin.query('drop database if exists workos_upgrade');
          await admin.query('create database workos_upgrade');
          await admin.end();

          const client = new pg.Client({ connectionString: process.env.UPGRADE_DATABASE_URL });
          await client.connect();
          await client.query('begin');
          await client.query(readFileSync('server/schema.sql', 'utf8'));
          await client.query(`
            create table if not exists schema_migrations (
              id text primary key,
              applied_at timestamptz not null default now()
            )
          `);
          await client.query(
            'insert into schema_migrations (id) values ($1) on conflict (id) do nothing',
            ['005_auth_lifecycle'],
          );
          await client.query('commit');
          await client.end();
          NODE

          DATABASE_URL="$UPGRADE_DATABASE_URL" npm run api:migrate 2>&1 | tee acceptance-artifacts/migrate-upgrade.log

          DATABASE_URL="$UPGRADE_DATABASE_URL" node --input-type=module <<'NODE' | tee acceptance-artifacts/migration-upgrade-summary.json
          import pg from 'pg';
          import { readdirSync } from 'node:fs';

          const expected = 1 + readdirSync('server/migrations').filter(name => name.endsWith('.sql')).length;
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const rows = await pool.query('select id from schema_migrations order by id');
          console.log(JSON.stringify({ expectedMigrationCount: expected, actualMigrationCount: rows.rowCount, migrationIds: rows.rows.map(row => row.id) }, null, 2));
          await pool.end();
          if (rows.rowCount !== expected) process.exit(1);
          NODE

      - name: Verify production fail-closed configuration gates
        shell: bash
        run: |
          set -euo pipefail
          missing_idp_rc=0
          timeout 20s env \
            NODE_ENV=production \
            APP_MODE=production \
            AUTO_SEED_DEMO=false \
            DATABASE_URL="$DATABASE_URL" \
            PGSSLMODE=disable \
            API_SESSION_SECRET=acceptance-session-secret-not-for-production \
            IDENTITY_PROVIDER= \
            npm start > acceptance-artifacts/start-missing-idp.log 2>&1 || missing_idp_rc=$?
          if test "$missing_idp_rc" -eq 0 || test "$missing_idp_rc" -eq 124; then
            echo "Production startup did not fail closed when IDENTITY_PROVIDER was absent." >&2
            cat acceptance-artifacts/start-missing-idp.log
            exit 1
          fi

          auto_seed_rc=0
          timeout 20s env \
            NODE_ENV=production \
            APP_MODE=production \
            AUTO_SEED_DEMO=true \
            DATABASE_URL="$DATABASE_URL" \
            PGSSLMODE=disable \
            API_SESSION_SECRET=acceptance-session-secret-not-for-production \
            IDENTITY_PROVIDER=oidc \
            OIDC_ISSUER_URL=https://issuer.example.test \
            OIDC_CLIENT_ID=acceptance-client \
            OIDC_CLIENT_SECRET=acceptance-secret \
            OIDC_REDIRECT_URI=http://127.0.0.1:4010/api/auth/oidc/callback \
            npm start > acceptance-artifacts/start-auto-seed.log 2>&1 || auto_seed_rc=$?
          if test "$auto_seed_rc" -eq 0 || test "$auto_seed_rc" -eq 124; then
            echo "Production startup did not reject AUTO_SEED_DEMO=true." >&2
            cat acceptance-artifacts/start-auto-seed.log
            exit 1
          fi

      - name: Build and start production against disposable database
        shell: bash
        run: |
          set -euo pipefail
          VITE_APP_MODE=production \
          VITE_ALLOW_TEST_FALLBACK=false \
          VITE_PRODUCT_NAME=WorkOS \
          VITE_ORGANIZATION_NAME="Your organization" \
          VITE_PRODUCT_LOGO_URL=/workos-mark.svg \
          VITE_SUPPORT_NAME="WorkOS Support" \
          VITE_SUPPORT_EMAIL=support@example.test \
          npm run build 2>&1 | tee acceptance-artifacts/production-build.log

          env \
            PORT=4010 \
            NODE_ENV=production \
            APP_MODE=production \
            APP_URL=http://127.0.0.1:3000 \
            AUTO_SEED_DEMO=false \
            RESET_DEMO_DATA=false \
            DATABASE_URL="$DATABASE_URL" \
            PGSSLMODE=disable \
            API_SESSION_SECRET=acceptance-session-secret-not-for-production \
            IDENTITY_PROVIDER=oidc \
            OIDC_ISSUER_URL=https://issuer.example.test \
            OIDC_CLIENT_ID=acceptance-client \
            OIDC_CLIENT_SECRET=acceptance-secret \
            OIDC_REDIRECT_URI=http://127.0.0.1:4010/api/auth/oidc/callback \
            npm start > acceptance-artifacts/production-server.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > acceptance-artifacts/production-server.pid
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          healthy=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4010/api/health > acceptance-artifacts/health.json; then
              healthy=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if test "$healthy" != true; then
            cat acceptance-artifacts/production-server.log
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const health = JSON.parse(readFileSync('acceptance-artifacts/health.json', 'utf8'));
          if (health.status !== 'ok' || health.database !== 'connected') {
            throw new Error(`Unexpected health response: ${JSON.stringify(health)}`);
          }
          NODE

          login_status="$(curl --silent --output acceptance-artifacts/local-login-response.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"username":"acceptance","password":"not-a-real-password"}' \
            http://127.0.0.1:4010/api/auth/login)"
          test "$login_status" = "404"

          curl --fail --silent http://127.0.0.1:4010/ > acceptance-artifacts/root-index.html
          ! grep -E '%VITE_(PRODUCT_NAME|PRODUCT_LOGO_URL)%' acceptance-artifacts/root-index.html
          grep -F '<title>WorkOS</title>' acceptance-artifacts/root-index.html

          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Upload database/runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01a-database-runtime-${{ env.EXPECTED_TARGET_HEAD }}
          path: acceptance-artifacts
          if-no-files-found: error
          retention-days: 14

  browser_roles:
    name: Local browser role and route journeys
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSER_ARTIFACTS: /tmp/wos01a-browser-artifacts
    steps:
      - name: Checkout exact WOS-01A head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and start explicit test-fallback frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          rm -rf "$BROWSER_ARTIFACTS"
          mkdir -p "$BROWSER_ARTIFACTS"
          npm ci --ignore-scripts 2>&1 | tee "$BROWSER_ARTIFACTS/npm-ci.log"

          cat > public/__wos01a_acceptance.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>WOS-01A acceptance</title></head>
            <body>
              <pre id="result">pending</pre>
              <script>
                const params = new URLSearchParams(location.search);
                const role = params.get('role');
                const targetPath = params.get('path');
                const expectedPath = params.get('expected');
                const permission = params.get('permission');
                const session = {
                  id: `acceptance-${role}`,
                  userName: `acceptance-${role.toLowerCase()}`,
                  employeeId: `ACCEPT-${role}`,
                  name: `${role} Acceptance`,
                  email: `${role.toLowerCase()}@example.test`,
                  role,
                  availableRoles: [role],
                  permissions: permission ? [permission] : [],
                  permissionRole: role,
                  lastLogin: new Date().toISOString(),
                };
                localStorage.setItem('workos_demo_data_version', JSON.stringify('demo-your-organization-anonymized-v10'));
                localStorage.setItem('workos_auth', JSON.stringify(session));

                const frame = document.createElement('iframe');
                frame.id = 'app-frame';
                frame.src = targetPath;
                frame.style.width = '1280px';
                frame.style.height = '900px';
                document.body.appendChild(frame);

                const finish = () => {
                  try {
                    const finalPath = frame.contentWindow.location.pathname;
                    const body = frame.contentDocument.body.innerText || '';
                    const invalid = /Page not found|Sign in to|Authentication required/i.test(body);
                    const pass = finalPath === expectedPath && body.trim().length > 80 && !invalid;
                    document.documentElement.dataset.acceptance = pass ? 'pass' : 'fail';
                    document.getElementById('result').textContent = JSON.stringify({
                      role,
                      targetPath,
                      expectedPath,
                      finalPath,
                      bodyLength: body.length,
                      invalid,
                      pass,
                      excerpt: body.slice(0, 800),
                    });
                  } catch (error) {
                    document.documentElement.dataset.acceptance = 'fail';
                    document.getElementById('result').textContent = JSON.stringify({ role, error: String(error), pass: false });
                  }
                };

                const timer = setInterval(() => {
                  try {
                    if (frame.contentDocument?.body?.innerText?.trim().length > 80) {
                      clearInterval(timer);
                      setTimeout(finish, 500);
                    }
                  } catch {}
                }, 200);
                setTimeout(() => {
                  clearInterval(timer);
                  finish();
                }, 7000);
              </script>
            </body>
          </html>
          HTML

          nohup env \
            VITE_APP_MODE=test \
            VITE_ALLOW_TEST_FALLBACK=true \
            VITE_PRODUCT_NAME=WorkOS \
            VITE_ORGANIZATION_NAME="Your organization" \
            VITE_PRODUCT_LOGO_URL=/workos-mark.svg \
            VITE_SUPPORT_NAME="WorkOS Support" \
            VITE_SUPPORT_EMAIL=support@example.test \
            npm run dev > "$BROWSER_ARTIFACTS/vite.log" 2>&1 &
          vite_pid=$!
          echo "$vite_pid" > "$BROWSER_ARTIFACTS/vite.pid"
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat "$BROWSER_ARTIFACTS/vite.log"
              exit 1
            fi
            sleep 1
          done
          cat "$BROWSER_ARTIFACTS/vite.log"
          exit 1

      - name: Execute role and denied-route browser journeys
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --version | tee "$BROWSER_ARTIFACTS/chrome-version.txt"

          journey() {
            case_name="$1"
            role="$2"
            target_path="$3"
            expected_path="$4"
            permission="$5"
            output="$BROWSER_ARTIFACTS/browser-${case_name}.html"
            profile="/tmp/wos01a-chrome-${case_name}"
            rm -rf "$profile"
            url="http://127.0.0.1:3000/__wos01a_acceptance.html?role=${role}&path=${target_path}&expected=${expected_path}&permission=${permission}"
            "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --host-resolver-rules="MAP * 0.0.0.0, EXCLUDE 127.0.0.1, EXCLUDE localhost" \
              --user-data-dir="$profile" \
              --virtual-time-budget=10000 \
              --dump-dom "$url" > "$output" 2> "$BROWSER_ARTIFACTS/browser-${case_name}.log"
            grep -F 'data-acceptance="pass"' "$output"
          }

          journey admin-home Admin %2F %2F dashboard.view
          journey hr-home HR %2F %2F dashboard.view
          journey regional-home CountryDirector %2F %2F dashboard.view
          journey pm-home ProjectManager %2Fpm-workspace %2Fpm-workspace pm_workspace.view
          journey teamlead-home TeamLead %2Ftimesheets%2Fapproval %2Ftimesheets%2Fapproval timesheets.approve
          journey employee-home Employee %2Fess %2Fess employee_workspace.view

          journey pm-admin-denied ProjectManager %2Fadmin %2Fpm-workspace pm_workspace.view
          journey teamlead-admin-denied TeamLead %2Fadmin %2Ftimesheets%2Fapproval timesheets.approve
          journey employee-admin-denied Employee %2Fadmin %2Fess employee_workspace.view

      - name: Stop local frontend
        if: always()
        shell: bash
        run: |
          if test -f "$BROWSER_ARTIFACTS/vite.pid"; then
            kill "$(cat "$BROWSER_ARTIFACTS/vite.pid")" 2>/dev/null || true
          fi
          rm -f public/__wos01a_acceptance.html

      - name: Upload browser journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01a-browser-roles-${{ env.EXPECTED_TARGET_HEAD }}
          path: ${{ env.BROWSER_ARTIFACTS }}
          if-no-files-found: error
          retention-days: 14
