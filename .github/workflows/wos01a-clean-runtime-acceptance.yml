name: WOS-01B Post-Publish Clean Runtime Acceptance

on:
  workflow_run:
    workflows:
      - WOS-01B Clean Runtime Publisher
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wos01b-post-publish-acceptance
  cancel-in-progress: false

env:
  TARGET_PR_NUMBER: '16'
  TARGET_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
  EXPECTED_PARENT: 590bc6a6d28ac185e4c4a0dd486649f3a8c9cc60
  EXPECTED_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
  BROWSER_SCRIPT: .github/scripts/wos01b-browser-acceptance.mjs

jobs:
  authority:
    name: Resolve exact published WOS-01B authority
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_head: ${{ steps.target.outputs.head_sha }}
      target_tree: ${{ steps.target.outputs.tree_sha }}
    steps:
      - name: Verify publisher and exact target ancestry
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const failures = [];
            if (run.name !== 'WOS-01B Clean Runtime Publisher') failures.push(`run.name=${run.name}`);
            if (run.conclusion !== 'success') failures.push(`run.conclusion=${run.conclusion}`);
            if (run.head_branch !== 'main') failures.push(`run.head_branch=${run.head_branch}`);

            const { data: target } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.TARGET_PR_NUMBER),
            });
            if (target.state !== 'open') failures.push(`target.state=${target.state}`);
            if (!target.draft) failures.push('target PR is not Draft');
            if (target.merged_at) failures.push(`target.merged_at=${target.merged_at}`);
            if (target.head.ref !== process.env.TARGET_BRANCH) failures.push(`target.head.ref=${target.head.ref}`);
            if (target.head.sha === process.env.EXPECTED_PARENT) failures.push('target head did not advance');
            if (target.base.ref !== 'main') failures.push(`target.base.ref=${target.base.ref}`);
            if (target.base.sha !== process.env.EXPECTED_BASE) failures.push(`target.base.sha=${target.base.sha}`);

            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: target.head.sha,
            });
            if (commit.parents.length !== 1 || commit.parents[0].sha !== process.env.EXPECTED_PARENT) {
              failures.push(`target.parent=${commit.parents.map(parent => parent.sha).join(',')}`);
            }
            if (commit.commit.message.split('\n')[0] !== 'fix: close WOS-01B clean-runtime blockers') {
              failures.push(`target.message=${commit.commit.message.split('\n')[0]}`);
            }

            if (failures.length) return core.setFailed(`Post-publish authority failed: ${failures.join(', ')}`);
            core.setOutput('head_sha', target.head.sha);
            core.setOutput('tree_sha', commit.commit.tree.sha);

  static:
    name: Published exact-head static and dependency acceptance
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact published target head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authority.outputs.target_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify exact tree and complete static gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.authority.outputs.target_head }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.authority.outputs.target_tree }}"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"

          npm ci --ignore-scripts
          npm audit --json > /tmp/audit-full.json || full_rc=$?
          npm audit --omit=dev --json > /tmp/audit-production.json || prod_rc=$?
          FULL_RC="${full_rc:-0}" PROD_RC="${prod_rc:-0}" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const [label, file, rc] of [
            ['full', '/tmp/audit-full.json', Number(process.env.FULL_RC)],
            ['production', '/tmp/audit-production.json', Number(process.env.PROD_RC)],
          ]) {
            const audit = JSON.parse(readFileSync(file, 'utf8'));
            const counts = audit.metadata?.vulnerabilities || {};
            console.log(JSON.stringify({ label, commandExit: rc, counts }));
            if (Number(counts.high || 0) > 0 || Number(counts.critical || 0) > 0) process.exit(1);
            if (rc !== 0 && Number(counts.total || 0) === 0) process.exit(1);
          }
          NODE

          npm run typecheck
          npm run lint
          npm run test:wos00-baseline
          node scripts/scan-bootstrap.mjs --self-test
          npm run test:bootstrap-scan
          env NODE_ENV=test APP_MODE=test VITE_APP_MODE=test ALLOW_TEST_FALLBACK=true VITE_ALLOW_TEST_FALLBACK=true npm test

          env -u VITE_PRODUCT_NAME -u VITE_PRODUCT_LOGO_URL -u VITE_ORGANIZATION_NAME -u VITE_SUPPORT_NAME -u VITE_SUPPORT_EMAIL npm run build > /tmp/default-build.log 2>&1
          cat /tmp/default-build.log
          ! grep -E '%VITE_[A-Z0-9_]+%' /tmp/default-build.log
          ! grep -E '%VITE_[A-Z0-9_]+%' dist/index.html
          grep -F '<title>WorkOS</title>' dist/index.html
          grep -F '/workos-mark.svg' dist/index.html

          rm -rf dist
          VITE_APP_MODE=production VITE_ALLOW_TEST_FALLBACK=false VITE_PRODUCT_NAME='Configured WorkOS' VITE_PRODUCT_LOGO_URL='/configured-workos.svg' VITE_ORGANIZATION_NAME='Configured organization' VITE_SUPPORT_NAME='Configured Support' VITE_SUPPORT_EMAIL='support@example.test' npm run build > /tmp/configured-build.log 2>&1
          cat /tmp/configured-build.log
          ! grep -E '%VITE_[A-Z0-9_]+%' /tmp/configured-build.log
          grep -R -F 'Configured WorkOS' dist/assets >/dev/null
          grep -R -F '/configured-workos.svg' dist/assets >/dev/null
          npm run test:product-identity
          git diff --check

      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01b-static-${{ needs.authority.outputs.target_head }}
          path: |
            /tmp/audit-full.json
            /tmp/audit-production.json
            /tmp/default-build.log
            /tmp/configured-build.log
          if-no-files-found: warn
          retention-days: 14

  database_runtime:
    name: Published exact-head PostgreSQL and production runtime acceptance
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos-acceptance
          POSTGRES_DB: workos_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d workos_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://workos:workos-acceptance@127.0.0.1:5432/workos_acceptance
      UPGRADE_DATABASE_URL: postgresql://workos:workos-acceptance@127.0.0.1:5432/workos_upgrade
      PGSSLMODE: disable
      EVIDENCE_DIR: /tmp/wos01b-database-runtime
    steps:
      - name: Checkout exact published target head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authority.outputs.target_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and execute fresh/replay/upgrade migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "${{ needs.authority.outputs.target_head }}"
          npm ci --ignore-scripts
          npm run api:migrate | tee "$EVIDENCE_DIR/migrate-fresh.log"
          npm run api:migrate | tee "$EVIDENCE_DIR/migrate-replay.log"

          node --input-type=module <<'NODE' | tee "$EVIDENCE_DIR/fresh-summary.json"
          import pg from 'pg';
          import { readdirSync } from 'node:fs';
          const expected = 1 + readdirSync('server/migrations').filter(name => name.endsWith('.sql')).length;
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const rows = await pool.query('select id from schema_migrations order by id');
          console.log(JSON.stringify({ expected, actual: rows.rowCount, ids: rows.rows.map(row => row.id) }, null, 2));
          await pool.end();
          if (rows.rowCount !== expected) process.exit(1);
          NODE

          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { readFileSync } from 'node:fs';
          const admin = new pg.Client({ connectionString: 'postgresql://workos:workos-acceptance@127.0.0.1:5432/postgres' });
          await admin.connect();
          await admin.query('drop database if exists workos_upgrade');
          await admin.query('create database workos_upgrade');
          await admin.end();
          const client = new pg.Client({ connectionString: process.env.UPGRADE_DATABASE_URL });
          await client.connect();
          await client.query('begin');
          await client.query(readFileSync('server/schema.sql', 'utf8'));
          await client.query('create table if not exists schema_migrations (id text primary key, applied_at timestamptz not null default now())');
          await client.query('insert into schema_migrations (id) values ($1) on conflict (id) do nothing', ['005_auth_lifecycle']);
          await client.query('commit');
          await client.end();
          NODE
          DATABASE_URL="$UPGRADE_DATABASE_URL" npm run api:migrate | tee "$EVIDENCE_DIR/migrate-upgrade.log"

          DATABASE_URL="$UPGRADE_DATABASE_URL" node --input-type=module <<'NODE' | tee "$EVIDENCE_DIR/upgrade-summary.json"
          import pg from 'pg';
          import { readdirSync } from 'node:fs';
          const expected = 1 + readdirSync('server/migrations').filter(name => name.endsWith('.sql')).length;
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const rows = await pool.query('select id from schema_migrations order by id');
          console.log(JSON.stringify({ expected, actual: rows.rowCount, ids: rows.rows.map(row => row.id) }, null, 2));
          await pool.end();
          if (rows.rowCount !== expected) process.exit(1);
          NODE

      - name: Verify fail-closed production configuration and live local runtime
        shell: bash
        run: |
          set -euo pipefail
          missing_idp_rc=0
          timeout 20s env NODE_ENV=production APP_MODE=production AUTO_SEED_DEMO=false DATABASE_URL="$DATABASE_URL" PGSSLMODE=disable API_SESSION_SECRET=acceptance-session-secret-not-for-production IDENTITY_PROVIDER= npm start > "$EVIDENCE_DIR/start-missing-idp.log" 2>&1 || missing_idp_rc=$?
          test "$missing_idp_rc" -ne 0
          test "$missing_idp_rc" -ne 124

          auto_seed_rc=0
          timeout 20s env NODE_ENV=production APP_MODE=production AUTO_SEED_DEMO=true DATABASE_URL="$DATABASE_URL" PGSSLMODE=disable API_SESSION_SECRET=acceptance-session-secret-not-for-production IDENTITY_PROVIDER=oidc OIDC_ISSUER_URL=https://issuer.example.test OIDC_CLIENT_ID=acceptance-client OIDC_CLIENT_SECRET=acceptance-secret OIDC_REDIRECT_URI=http://127.0.0.1:4010/api/auth/oidc/callback npm start > "$EVIDENCE_DIR/start-auto-seed.log" 2>&1 || auto_seed_rc=$?
          test "$auto_seed_rc" -ne 0
          test "$auto_seed_rc" -ne 124

          VITE_APP_MODE=production VITE_ALLOW_TEST_FALLBACK=false VITE_PRODUCT_NAME=WorkOS VITE_ORGANIZATION_NAME='Your organization' VITE_PRODUCT_LOGO_URL=/workos-mark.svg VITE_SUPPORT_NAME='WorkOS Support' VITE_SUPPORT_EMAIL=support@example.test npm run build > "$EVIDENCE_DIR/production-build.log" 2>&1

          env PORT=4010 NODE_ENV=production APP_MODE=production APP_URL=http://127.0.0.1:3000 AUTO_SEED_DEMO=false RESET_DEMO_DATA=false DATABASE_URL="$DATABASE_URL" PGSSLMODE=disable API_SESSION_SECRET=acceptance-session-secret-not-for-production IDENTITY_PROVIDER=oidc OIDC_ISSUER_URL=https://issuer.example.test OIDC_CLIENT_ID=acceptance-client OIDC_CLIENT_SECRET=acceptance-secret OIDC_REDIRECT_URI=http://127.0.0.1:4010/api/auth/oidc/callback npm start > "$EVIDENCE_DIR/production-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4010/api/health > "$EVIDENCE_DIR/health.json"; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const health = JSON.parse(readFileSync(`${process.env.EVIDENCE_DIR}/health.json`, 'utf8'));
          if (health.status !== 'ok' || health.database !== 'connected') process.exit(1);
          NODE
          login_status="$(curl --silent --output "$EVIDENCE_DIR/local-login.json" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"username":"acceptance","password":"not-a-real-password"}' http://127.0.0.1:4010/api/auth/login)"
          test "$login_status" = '404'
          curl --fail --silent http://127.0.0.1:4010/ > "$EVIDENCE_DIR/root-index.html"
          ! grep -E '%VITE_[A-Z0-9_]+%' "$EVIDENCE_DIR/root-index.html"
          grep -F '<title>WorkOS</title>' "$EVIDENCE_DIR/root-index.html"
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Upload database/runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01b-database-runtime-${{ needs.authority.outputs.target_head }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Published exact-head browser role journeys
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact controller scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact published target head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authority.outputs.target_head }}
          path: workos
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workos/package-lock.json

      - name: Install and run bounded local browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C workos rev-parse HEAD)" = "${{ needs.authority.outputs.target_head }}"
          node --check "controller/$BROWSER_SCRIPT"
          npm --prefix workos ci --ignore-scripts
          node "controller/$BROWSER_SCRIPT" workos /tmp/wos01b-browser-evidence | tee /tmp/wos01b-browser-summary.json
          test -z "$(git -C workos status --porcelain)"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wos01b-browser-${{ needs.authority.outputs.target_head }}
          path: |
            /tmp/wos01b-browser-evidence
            /tmp/wos01b-browser-summary.json
          if-no-files-found: warn
          retention-days: 14
