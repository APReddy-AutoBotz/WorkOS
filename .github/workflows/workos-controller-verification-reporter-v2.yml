name: WorkOS Controller Verification Reporter v2

on:
  push:
    branches:
      - controller/workos-root-publisher-v1
    paths:
      - '.github/workflows/workos-controller-verification-reporter-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: workos-controller-verification-reporter-v2
  cancel-in-progress: false

jobs:
  authority:
    name: Wait for exact corrected controller heads
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      acceptance: ${{ steps.wait.outputs.acceptance }}
      product: ${{ steps.wait.outputs.product }}
      parent: ${{ steps.wait.outputs.parent }}
      monitor: ${{ steps.wait.outputs.monitor }}
      main: ${{ steps.wait.outputs.main }}
    steps:
      - name: Poll live corrected controller authority
        id: wait
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              const [main, acceptance, product, parent, monitor] = await Promise.all([
                github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'}),
                github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 26}),
                github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 27}),
                github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 16}),
                github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 28}),
              ]);
              const a = acceptance.data;
              const t = product.data;
              const p = parent.data;
              const r = monitor.data;
              if (a.state !== 'open' || !a.draft || a.head.ref !== 'controller/wos01a-clean-runtime-acceptance-v2' || a.base.ref !== 'main') return core.setFailed('PR #26 authority changed');
              if (t.state !== 'open' || !t.draft || t.head.ref !== 'codex/wos01a-acceptance-closure' || t.base.ref !== 'codex/wos-01-authorized-source-bootstrap-v2') return core.setFailed('PR #27 authority changed');
              if (p.state !== 'open' || !p.draft || p.head.ref !== 'codex/wos-01-authorized-source-bootstrap-v2' || p.base.ref !== 'main') return core.setFailed('PR #16 authority changed');
              if (r.state !== 'open' || !r.draft || r.head.ref !== 'controller/workos-continuous-controller-v2' || r.base.ref !== 'main') return core.setFailed('PR #28 authority changed');
              const [matrixFile, workflowFile, monitorFile] = await Promise.all([
                github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: '.github/scripts/wos01a-clean-runtime-matrix-v2.sh', ref: a.head.sha}),
                github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: '.github/workflows/wos01a-clean-runtime-acceptance-v2.yml', ref: a.head.sha}),
                github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: '.github/scripts/workos-continuous-controller.cjs', ref: r.head.sha}),
              ]);
              const matrix = Buffer.from(matrixFile.data.content, 'base64').toString('utf8');
              const workflow = Buffer.from(workflowFile.data.content, 'base64').toString('utf8');
              const monitorSource = Buffer.from(monitorFile.data.content, 'base64').toString('utf8');
              const acceptanceCorrect = !matrix.includes('GH_TOKEN')
                && !matrix.includes('Authorization: Bearer')
                && workflow.includes('id: final_authority')
                && workflow.includes('controller.head.ref !== process.env.CONTROLLER_BRANCH')
                && workflow.includes('steps.final_authority.outcome');
              const monitorCorrect = monitorSource.includes("combinedState !== 'success'")
                && monitorSource.includes('combined.data.state')
                && monitorSource.includes('REVIEW_RESULT_PATTERN = /^');
              core.info(`attempt=${attempt} acceptance=${a.head.sha} corrected=${acceptanceCorrect} monitor=${r.head.sha} corrected=${monitorCorrect}`);
              if (acceptanceCorrect && monitorCorrect) {
                core.setOutput('acceptance', a.head.sha);
                core.setOutput('product', t.head.sha);
                core.setOutput('parent', p.head.sha);
                core.setOutput('monitor', r.head.sha);
                core.setOutput('main', main.data.commit.sha);
                return;
              }
              if (attempt < 10) await sleep(120000);
            }
            core.setFailed('Timed out waiting for corrected PR #26 and PR #28 controller heads.');

  acceptance-proof:
    name: Reprove live PR 26 against live PR 27
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos
          POSTGRES_PASSWORD: workos
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CONTROLLER_PR: '26'
      CONTROLLER_BRANCH: controller/wos01a-clean-runtime-acceptance-v2
      CONTROLLER_HEAD: ${{ needs.authority.outputs.acceptance }}
      TARGET_PR: '27'
      TARGET_BRANCH: codex/wos01a-acceptance-closure
      TARGET_HEAD: ${{ needs.authority.outputs.product }}
      PARENT_PR: '16'
      PARENT_BRANCH: codex/wos-01-authorized-source-bootstrap-v2
      PARENT_HEAD: ${{ needs.authority.outputs.parent }}
      EXPECTED_MAIN_HEAD: ${{ needs.authority.outputs.main }}
      ACCEPTED_WOS00_BASE: 1aa8d1fb7ea1a013b07cb282a9bf3941bf851dea
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: workos
      PGPASSWORD: workos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_HEAD }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_HEAD }}
          path: current-main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json
      - name: Execute complete token-free matrix
        id: matrix
        continue-on-error: true
        run: |
          chmod +x controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh
          bash controller/.github/scripts/wos01a-clean-runtime-matrix-v2.sh "$GITHUB_WORKSPACE/controller" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/current-main"
      - name: Final isolated live authority
        id: authority
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const failures = [];
            const [c, t, p, m] = await Promise.all([
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 26}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 27}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 16}),
              github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'}),
            ]);
            if (c.data.state !== 'open' || !c.data.draft || c.data.head.ref !== process.env.CONTROLLER_BRANCH || c.data.head.sha !== process.env.CONTROLLER_HEAD || c.data.base.ref !== 'main' || c.data.base.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push('controller lease changed');
            if (t.data.state !== 'open' || !t.data.draft || t.data.head.ref !== process.env.TARGET_BRANCH || t.data.head.sha !== process.env.TARGET_HEAD || t.data.base.ref !== process.env.PARENT_BRANCH || t.data.base.sha !== process.env.PARENT_HEAD) failures.push('target lease changed');
            if (p.data.state !== 'open' || !p.data.draft || p.data.head.ref !== process.env.PARENT_BRANCH || p.data.head.sha !== process.env.PARENT_HEAD || p.data.base.ref !== 'main' || p.data.base.sha !== process.env.ACCEPTED_WOS00_BASE) failures.push('parent lease changed');
            if (m.data.commit.sha !== process.env.EXPECTED_MAIN_HEAD) failures.push('main changed');
            const dir = path.join(process.env.GITHUB_WORKSPACE, 'target', '.acceptance-evidence');
            fs.mkdirSync(dir, {recursive: true});
            fs.writeFileSync(path.join(dir, 'verification-v2-final-authority.json'), `${JSON.stringify({status: failures.length ? 'failed' : 'passed', failures, controller: c.data, target: t.data, parent: p.data, main: m.data}, null, 2)}\n`);
            if (failures.length) core.setFailed(failures.join(', '));
      - name: Upload exact proof evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workos-controller-verification-v2-${{ env.CONTROLLER_HEAD }}-${{ env.TARGET_HEAD }}
          path: target/.acceptance-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Aggregate exact proof
        if: always()
        run: |
          set -euo pipefail
          test '${{ steps.matrix.outcome }}' = success
          test '${{ steps.authority.outcome }}' = success
          test '${{ steps.upload.outcome }}' = success

  monitor-proof:
    name: Reprove live PR 28 controller policy
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONITOR_HEAD: ${{ needs.authority.outputs.monitor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MONITOR_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run exact policy proof
        run: |
          set -euo pipefail
          node .github/scripts/test-workos-continuous-controller.cjs
          node --check .github/scripts/workos-continuous-controller.cjs
          grep -q "combinedState !== 'success'" .github/scripts/workos-continuous-controller.cjs
          grep -q 'combined.data.state' .github/scripts/workos-continuous-controller.cjs
          grep -q 'REVIEW_RESULT_PATTERN = /\^' .github/scripts/workos-continuous-controller.cjs
          git diff --check
          test -z "$(git status --porcelain)"

  report:
    name: Publish exact verification-v2 checkpoints
    needs: [authority, acceptance-proof, monitor-proof]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const acceptance = '${{ needs.authority.outputs.acceptance }}';
            const product = '${{ needs.authority.outputs.product }}';
            const monitor = '${{ needs.authority.outputs.monitor }}';
            const acceptanceResult = '${{ needs.acceptance-proof.result }}';
            const monitorResult = '${{ needs.monitor-proof.result }}';
            if (acceptance) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 26, body: `### Live exact-head verification reporter\n\n- Controller head: \`${acceptance}\`\n- Product head: \`${product}\`\n- Acceptance proof: **${acceptanceResult}**\n- Workflow run: \`${context.runId}\`\n\nThe product matrix received no GitHub token; the final GitHub authority step revalidated the controller ref/head/base, target, parent and main.`});
            if (monitor) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 28, body: `### Live exact-head verification reporter\n\n- Continuous-controller head: \`${monitor}\`\n- Policy proof: **${monitorResult}**\n- Workflow run: \`${context.runId}\`\n\nThe exact policy requires an unquoted standalone clean result and GitHub combined commit status exactly success.`});
            if (acceptanceResult === 'success') {
              for (const id of ['PRRT_kwDOUAv8Lc6dISNf', 'PRRT_kwDOUAv8Lc6dISNn']) {
                try { await github.graphql(`mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { id isResolved } } }`, {id}); }
                catch (error) { core.warning(`Could not resolve ${id}: ${error.message}`); }
              }
            }
            if (acceptanceResult !== 'success' || monitorResult !== 'success') core.setFailed(`acceptance=${acceptanceResult} monitor=${monitorResult}`);
