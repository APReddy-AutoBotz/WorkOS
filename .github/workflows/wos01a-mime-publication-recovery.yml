name: WOS-01A Static Asset MIME Publication Recovery

on:
  push:
    branches:
      - controller/wos01a-clean-runtime-acceptance-v2
    paths:
      - '.github/workflows/wos01a-mime-publication-recovery.yml'

permissions:
  contents: write

concurrency:
  group: wos01a-static-asset-mime-publication-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Publish bounded static asset MIME correction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: controller/wos01a-clean-runtime-acceptance-v2
      EXPECTED_BASE: 902bfb4b6a01a77814b428a4910a46bdaa262ff5
      EXPECTED_WORKFLOW_BASE_BLOB: e02b8994945c89c7fc98f8b0608896ed1c5f3d79
      EXPECTED_VERIFIER_BASE_BLOB: f5e00a057d3465c2381999d80f725cfac5ed1080
      PATCH_GZIP_SHA256: 5e5fce9cea2a7df7828ecf6de9ab94b7031bdd1bc43fccbc4a9a85460c814cbc
      PATCH_SHA256: 07191d8a9ffa874c47715832c42f368f1b34416a0cc2a6beb3673121661281f3

    steps:
      - name: Checkout exact recovery trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify lease, apply patch and publish
        shell: bash
        run: |
          set -euo pipefail
          recovery='.github/workflows/wos01a-mime-publication-recovery.yml'
          workflow='.github/workflows/wos01a-clean-runtime-acceptance-v2.yml'
          verifier='.github/scripts/verify-wos01a-controller-v2.mjs'

          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          trigger_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE" "$trigger_head")" = "$recovery"
          test "$(git hash-object "$workflow")" = "$EXPECTED_WORKFLOW_BASE_BLOB"
          test "$(git hash-object "$verifier")" = "$EXPECTED_VERIFIER_BASE_BLOB"

          printf '%s' '' | base64 -d > /tmp/wos01a-mime-fix.patch.gz
          printf '%s  %s\n' "$PATCH_GZIP_SHA256" /tmp/wos01a-mime-fix.patch.gz | sha256sum -c -
          gzip -dc /tmp/wos01a-mime-fix.patch.gz > /tmp/wos01a-mime-fix.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/wos01a-mime-fix.patch | sha256sum -c -

          git apply --check /tmp/wos01a-mime-fix.patch
          git apply /tmp/wos01a-mime-fix.patch
          rm "$recovery"

          ruby -e "require 'yaml'; YAML.parse_file('$workflow'); puts 'workflow yaml passed'"
          node --check "$verifier"
          node "$verifier"
          git diff --check
          grep -F 'include /etc/nginx/mime.types;' "$workflow"
          grep -F 'main-asset-headers.txt' "$workflow"

          actual_paths="$(git diff --name-only "$EXPECTED_BASE" | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' "$verifier" "$workflow" | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"

          git config user.name 'WorkOS Static MIME Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ci: serve isolated browser assets with JavaScript MIME'
          final_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$trigger_head"
          test "$(git diff --name-only "$EXPECTED_BASE" "$final_head" | LC_ALL=C sort)" = "$expected_paths"
          git push --force-with-lease="refs/heads/$BRANCH:$trigger_head" origin "HEAD:refs/heads/$BRANCH"
