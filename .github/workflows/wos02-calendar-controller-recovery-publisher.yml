name: WOS-02 Calendar Controller Recovery Publisher

on:
  push:
    branches:
      - controller/wos02-migration-publisher-temp2
    paths:
      - '.github/workflows/wos02-calendar-controller-recovery-publisher.yml'

permissions:
  contents: write
  pull-requests: read
  issues: read

env:
  EXPECTED_MAIN: 3070c80a71640fa4275477d0d2f1538cc8d2a819
  EXPECTED_PRODUCT: 6ec5debaf3c8827bc948d1101c12ca0e21e39653
  EXPECTED_PRODUCT_TREE: 22b027d0bc4cd5124cab7f2ca56e61b03f23af87
  EXPECTED_CONTROLLER: 58f319827138521e0e2ed3b9d7b7653c8f609644
  RESULT_TREE: 1beb1dbf3a0a29865faa8f716ab7dcd70e73e812
  RAW_BYTES: '29925'
  RAW_SHA: ea8ca99ccda8f9f72d03061e5f9cfb9e96d85d2c96df7a9f0aa73bd5da782bc8
  GZIP_BYTES: '7227'
  GZIP_SHA: ad37092db7702011c5e46af5aa66e8d54b0392dd22026f7e7cc22fd933f38c7d
  B64_BYTES: '9636'
  SOURCE_COMMENT: '5549241727'
  CONTROLLER_BRANCH: controller/wos02-exact-acceptance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact live leases
        uses: actions/github-script@v7
        with:
          script: |
            const failures=[];
            const {data:main}=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            const {data:product}=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:37});
            const {data:controller}=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:38});
            if(main.commit.sha!==process.env.EXPECTED_MAIN) failures.push(`main=${main.commit.sha}`);
            if(product.state!=='open'||!product.draft||product.head.sha!==process.env.EXPECTED_PRODUCT||product.base.sha!==process.env.EXPECTED_MAIN) failures.push(`product=${product.head.sha}/${product.state}/draft:${product.draft}/base:${product.base.sha}`);
            const {data:pc}=await github.rest.repos.getCommit({owner:context.repo.owner,repo:context.repo.repo,ref:product.head.sha});
            if(pc.commit.tree.sha!==process.env.EXPECTED_PRODUCT_TREE) failures.push(`product tree=${pc.commit.tree.sha}`);
            if(controller.state!=='open'||!controller.draft||controller.head.ref!==process.env.CONTROLLER_BRANCH||controller.head.sha!==process.env.EXPECTED_CONTROLLER||controller.base.sha!==process.env.EXPECTED_MAIN) failures.push(`controller=${controller.head.sha}/${controller.state}/draft:${controller.draft}/base:${controller.base.sha}`);
            if(failures.length) core.setFailed(`lease failed: ${failures.join('; ')}`);

      - name: Checkout exact controller lease
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CONTROLLER }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch verify and apply complete controller recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${SOURCE_COMMENT}" --jq .body > "$RUNNER_TEMP/comment.txt"
          python - <<'PY'
          import os,re,base64,hashlib,gzip,pathlib
          body=pathlib.Path(os.environ['RUNNER_TEMP']+'/comment.txt').read_text()
          blocks=re.findall(r'```text\s*\n(H4sI[A-Za-z0-9+/=\r\n]+?)\n```',body,re.S)
          assert len(blocks)==1, f'expected one recovery payload block, found {len(blocks)}'
          compact=''.join(blocks[0].split())
          want_len=int(os.environ['B64_BYTES'])
          want_gzip_bytes=int(os.environ['GZIP_BYTES'])
          want_gzip_sha=os.environ['GZIP_SHA']
          matches=[]
          for start in range(0,max(0,len(compact)-want_len)+1):
              candidate=compact[start:start+want_len]
              try:
                  gz=base64.b64decode(candidate,validate=True)
              except Exception:
                  continue
              if len(gz)==want_gzip_bytes and hashlib.sha256(gz).hexdigest()==want_gzip_sha:
                  matches.append((start,candidate,gz))
          assert len(matches)==1, f'expected one cryptographic payload window; captured={len(compact)} target={want_len} matches={[(m[0],len(m[1])) for m in matches]}'
          start,b64,gz=matches[0]
          print(f'validated payload window start={start} chars={len(b64)} captured={len(compact)}')
          raw=gzip.decompress(gz)
          assert len(raw)==int(os.environ['RAW_BYTES']), (len(raw),os.environ['RAW_BYTES'])
          assert hashlib.sha256(raw).hexdigest()==os.environ['RAW_SHA']
          pathlib.Path(os.environ['RUNNER_TEMP']+'/calendar-controller.diff').write_bytes(raw)
          PY
          git apply --check --binary "$RUNNER_TEMP/calendar-controller.diff"
          git apply --binary "$RUNNER_TEMP/calendar-controller.diff"
          git diff --check
          git add -A
          expected='.github/scripts/wos02-calendar-acceptance.mjs .github/workflows/wos02-final-review-acceptance.yml '
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          test "$actual" = "$expected"
          test "$(git diff --cached --numstat | awk '{a+=$1;d+=$2} END{print a"|"d}')" = '231|10'
          git config user.name 'WorkOS Controller'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'CTRL: accept calendar authority at exact head'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CONTROLLER"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RESULT_TREE"

      - name: Revalidate live leases before publish
        uses: actions/github-script@v7
        with:
          script: |
            const failures=[];
            const {data:main}=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            const {data:product}=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:37});
            const {data:controller}=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:38});
            if(main.commit.sha!==process.env.EXPECTED_MAIN) failures.push(`main=${main.commit.sha}`);
            if(product.head.sha!==process.env.EXPECTED_PRODUCT||!product.draft) failures.push(`product=${product.head.sha}/draft:${product.draft}`);
            if(controller.head.sha!==process.env.EXPECTED_CONTROLLER||!controller.draft) failures.push(`controller=${controller.head.sha}/draft:${controller.draft}`);
            if(failures.length) core.setFailed(`pre-publish lease failed: ${failures.join('; ')}`);

      - name: Non-force fast-forward existing controller branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:"$CONTROLLER_BRANCH"
