name: TEMP WOS-02 Terminology Controller Publisher

on:
  push:
    branches:
      - controller/wos02-terminology-controller-publisher-temp
    paths:
      - .github/workflows/wos02-terminology-controller-publisher-temp.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live leases, payload, exact tree and publish controller non-force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          expected_main='3070c80a71640fa4275477d0d2f1538cc8d2a819'
          product_head='86c4cc1bef7a96adad3fc31b9ff3b717ba63444f'
          product_tree='c5387984997e765690f0ebd2a89437701a9279e0'
          controller_base='4b7e1748e455727dd51ffd3a662bcbd46d8898ad'
          expected_tree='c1e162c5378270750c596780eacae7167fa8813b'

          test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$expected_main"
          test "$(gh api "repos/$repo/pulls/37" --jq '.state+"|"+(.draft|tostring)+"|"+.head.ref+"|"+.head.sha+"|"+.base.sha')" = "open|true|codex/wos-02-organization-setup-foundation|$product_head|$expected_main"
          test "$(gh api "repos/$repo/git/commits/$product_head" --jq '.tree.sha')" = "$product_tree"
          test "$(gh api "repos/$repo/pulls/38" --jq '.state+"|"+(.draft|tostring)+"|"+.head.ref+"|"+.head.sha+"|"+.base.sha')" = "open|true|controller/wos02-exact-acceptance|$controller_base|$expected_main"

          git fetch origin controller/wos02-exact-acceptance
          git checkout -B controller/wos02-exact-acceptance origin/controller/wos02-exact-acceptance
          test "$(git rev-parse HEAD)" = "$controller_base"

          cat > /tmp/p00 <<'PAYLOAD'

PAYLOAD
          cat > /tmp/p01 <<'PAYLOAD'

PAYLOAD
          cat > /tmp/p02 <<'PAYLOAD'

PAYLOAD
          cat > /tmp/p03 <<'PAYLOAD'

PAYLOAD
          cat > /tmp/p04 <<'PAYLOAD'
EvvsYee/C2D78XAmAAA=
PAYLOAD

          for f in /tmp/p0{0,1,2,3,4}; do truncate -s -1 "$f"; done
          echo 'ece1acdf41fcb8078816a5c2205d312e1cdd1bd1cd8e4eb842fc212d9121507e  /tmp/p00' | sha256sum -c -
          echo 'f080b9b082db0c8d0e0c6640b8a3c61d34d4d6542960b51c5709b9adef14c269  /tmp/p01' | sha256sum -c -
          echo '24d55d678c0c27e7dcb478e002c70e0dfaa3c4c36aca3a17083839821a7258a9  /tmp/p02' | sha256sum -c -
          echo '2cdc1a7847aa6ebdb94a91e6a27e9aa8ff6188cc8255c41c0479f611823397b8  /tmp/p03' | sha256sum -c -
          echo '6c32b2b38e0be3d890f9e84d2857017803ab8d87797a7c836e2afa4b22351827  /tmp/p04' | sha256sum -c -
          cat /tmp/p0{0,1,2,3,4} > /tmp/payload.b64
          test "$(wc -c < /tmp/payload.b64)" = 4820
          base64 -d /tmp/payload.b64 > /tmp/controller.diff.gz
          test "$(wc -c < /tmp/controller.diff.gz)" = 3614
          echo '94c126425c2215d7f50167f3e225db79340c1229dce12bc53df0868e387b7aee  /tmp/controller.diff.gz' | sha256sum -c -
          gzip -dc /tmp/controller.diff.gz > /tmp/controller.diff
          test "$(wc -c < /tmp/controller.diff)" = 9840
          echo 'e2c9d1d26e15f00aafd634dd9306d4260c1ffbf993c90c05511c70c8ecb61826  /tmp/controller.diff' | sha256sum -c -

          git apply --index --binary /tmp/controller.diff
          test "$(git write-tree)" = "$expected_tree"
          git diff --cached --check
          node --check .github/scripts/wos02-terminology-acceptance.mjs
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/wos02-final-review-acceptance.yml')"

          git config user.name 'APReddy-AutoBotz'
          git config user.email 'avalaparameswarareddy@gmail.com'
          git commit -m 'CTRL: accept final terminology at exact head'
          test "$(git rev-parse HEAD^)" = "$controller_base"
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"

          test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$expected_main"
          test "$(gh api "repos/$repo/pulls/37" --jq '.state+"|"+(.draft|tostring)+"|"+.head.sha')" = "open|true|$product_head"
          test "$(gh api "repos/$repo/pulls/38" --jq '.state+"|"+(.draft|tostring)+"|"+.head.sha')" = "open|true|$controller_base"

          git push origin HEAD:controller/wos02-exact-acceptance
