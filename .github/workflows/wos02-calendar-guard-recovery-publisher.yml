name: WOS-02 Calendar Guard Recovery Publisher

on:
  push:
    branches:
      - controller/wos02-migration-publisher-temp2
    paths:
      - .github/workflows/wos02-calendar-guard-recovery-publisher.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact product lease
        uses: actions/checkout@v4
        with:
          ref: codex/wos-02-organization-setup-foundation
          fetch-depth: 0

      - name: Verify and publish exact recovery
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='6ec5debaf3c8827bc948d1101c12ca0e21e39653'
          EXPECTED_MAIN='3070c80a71640fa4275477d0d2f1538cc8d2a819'
          EXPECTED_TREE='483e6fbab2a204c7356dcd61677bae3538c51624'
          EXPECTED_RAW_BYTES='3741'
          EXPECTED_RAW_SHA='b257821eda60d5000b19705a25d08ace135438cc506cbb3ade39a92d472e33d8'
          EXPECTED_GZ_BYTES='1412'
          EXPECTED_GZ_SHA='78bc7a94291ea06e9e03613462e113088dcbf8fbd14406fc14b72be2ed881bb3'
          BRANCH='codex/wos-02-organization-setup-foundation'

          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git fetch origin main "$BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_BASE"

          cat > payload.b64 <<'PAYLOAD'

PAYLOAD

          base64 -d payload.b64 > recovery.diff.gz
          test "$(wc -c < recovery.diff.gz)" = "$EXPECTED_GZ_BYTES"
          echo "$EXPECTED_GZ_SHA  recovery.diff.gz" | sha256sum -c -
          gzip -dc recovery.diff.gz > recovery.diff
          test "$(wc -c < recovery.diff)" = "$EXPECTED_RAW_BYTES"
          echo "$EXPECTED_RAW_SHA  recovery.diff" | sha256sum -c -

          git apply --check --binary recovery.diff
          git apply --binary recovery.diff
          mapfile -t files < <(git diff --name-only | sort)
          test "${#files[@]}" = '2'
          test "${files[0]}" = 'server/organization-setup.mjs'
          test "${files[1]}" = 'tests/organization-setup-smoke.mjs'
          test "$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a ":" d}')" = '4:1'

          git add server/organization-setup.mjs tests/organization-setup-smoke.mjs
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'WorkOS Controller'
          git config user.email 'workos-controller@users.noreply.github.com'
          git commit -m 'fix: guard first calendar version'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_BASE"
          git push origin HEAD:"$BRANCH"
