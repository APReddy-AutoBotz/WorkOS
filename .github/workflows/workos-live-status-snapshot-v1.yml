name: WorkOS Live Status Snapshot v1

on:
  push:
    branches:
      - controller/workos-root-publisher-v1
    paths:
      - '.github/workflows/workos-live-status-snapshot-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read
  issues: read

concurrency:
  group: workos-live-status-snapshot-v1
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/workos-root-publisher-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Capture exact live state
        id: capture
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const [main, pr16, pr26, pr27, pr28, runs, issueComments] = await Promise.all([
              github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 16}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 26}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 27}),
              github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 28}),
              github.rest.actions.listWorkflowRunsForRepo({owner: context.repo.owner, repo: context.repo.repo, branch: 'controller/workos-root-publisher-v1', per_page: 100}),
              github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: 3, per_page: 100}),
            ]);
            const summarizePr = pr => ({
              number: pr.number,
              state: pr.state,
              draft: pr.draft,
              merged: pr.merged,
              mergeable: pr.mergeable,
              mergeable_state: pr.mergeable_state,
              head_ref: pr.head.ref,
              head_sha: pr.head.sha,
              base_ref: pr.base.ref,
              base_sha: pr.base.sha,
              updated_at: pr.updated_at,
            });
            const watchedNames = [
              'WorkOS Controller Fixes Publisher v3',
              'WorkOS Controller Fixes Publisher v4',
              'WorkOS Controller Fixes Publisher v5',
              'WorkOS Controller Verification Reporter v1',
              'WorkOS PR26 Closure Watcher v1',
              'WorkOS PR27 Patch Watcher v1',
              'WorkOS PR27 Live Proof v1',
              'WorkOS PR27 Closure and Parent Proof v1',
              'WorkOS PR16 Closure and PR28 Refresh v1',
              'WorkOS PR28 Final Closure v1',
              'WorkOS Publisher Workflow Syntax v1',
            ];
            const latest = {};
            for (const run of runs.data.workflow_runs) {
              if (!watchedNames.includes(run.name) || latest[run.name]) continue;
              latest[run.name] = {
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                run_number: run.run_number,
                head_sha: run.head_sha,
                created_at: run.created_at,
                updated_at: run.updated_at,
                html_url: run.html_url,
              };
            }
            const recentMarkers = issueComments.data
              .filter(comment => /WOS-01A|WorkOS|controller|publisher|verification|proof/i.test(comment.body || ''))
              .slice(-15)
              .map(comment => ({
                id: comment.id,
                author: comment.user?.login,
                created_at: comment.created_at,
                first_line: String(comment.body || '').split(/\r?\n/).find(line => line.trim()) || '',
              }));
            const snapshot = {
              captured_at: new Date().toISOString(),
              main: main.data.commit.sha,
              prs: [pr16.data, pr26.data, pr27.data, pr28.data].map(summarizePr),
              workflows: latest,
              recent_issue3_markers: recentMarkers,
            };
            fs.mkdirSync('docs/control', {recursive: true});
            fs.writeFileSync('docs/control/WORKOS_LIVE_STATUS.json', `${JSON.stringify(snapshot, null, 2)}\n`);
            core.summary.addCodeBlock(JSON.stringify(snapshot, null, 2), 'json').write();
      - name: Publish snapshot to temporary controller branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/WORKOS_LIVE_STATUS.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh live WorkOS pipeline snapshot'
          git push origin HEAD:refs/heads/controller/workos-root-publisher-v1
